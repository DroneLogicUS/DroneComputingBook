<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dclArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
    <marker id="dclArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a33a2a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="660" fill="#ffffff"/>

  <text x="470" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">The deployment gap: three places a model can run</text>
  <text x="470" y="52" font-size="12.5" fill="#555" text-anchor="middle">Each step toward the aircraft cuts memory and power by orders of magnitude &#8212; and removes the wireless link from the decision path</text>

  <!-- ============ COLUMN 1: CLOUD GPU ============ -->
  <rect x="40" y="80" width="270" height="360" rx="8" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="2"/>
  <text x="175" y="108" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Cloud / server GPU</text>
  <text x="175" y="126" font-size="11.5" fill="#555" text-anchor="middle">off the aircraft entirely</text>

  <!-- server rack icon -->
  <rect x="115" y="140" width="120" height="86" rx="4" fill="#2f3a3f"/>
  <rect x="123" y="148" width="104" height="16" rx="2" fill="#55636b"/>
  <rect x="123" y="170" width="104" height="16" rx="2" fill="#55636b"/>
  <rect x="123" y="192" width="104" height="16" rx="2" fill="#55636b"/>
  <circle cx="219" cy="156" r="4" fill="#e8b04a"/>
  <circle cx="219" cy="178" r="4" fill="#e8b04a"/>
  <circle cx="219" cy="200" r="4" fill="#e8b04a"/>

  <text x="60" y="252" font-size="11.5" fill="#222">Memory:</text>
  <text x="300" y="252" font-size="11.5" font-weight="bold" fill="#222" text-anchor="end">tens of GB</text>
  <text x="60" y="272" font-size="11.5" fill="#222">Power:</text>
  <text x="300" y="272" font-size="11.5" font-weight="bold" fill="#222" text-anchor="end">hundreds of W</text>
  <text x="60" y="292" font-size="11.5" fill="#222">Compute clock:</text>
  <text x="300" y="292" font-size="11.5" font-weight="bold" fill="#222" text-anchor="end">GHz, thousands of cores</text>
  <text x="60" y="312" font-size="11.5" fill="#222">Reached via:</text>
  <text x="300" y="312" font-size="11.5" font-weight="bold" fill="#a33a2a" text-anchor="end">wireless link (variable)</text>

  <rect x="56" y="330" width="238" height="94" rx="6" fill="#ffffff" stroke="#1a7a8a" stroke-width="1.2"/>
  <text x="175" y="349" font-size="11" font-weight="bold" fill="#1a4a5a" text-anchor="middle">Runs well here</text>
  <text x="175" y="366" font-size="10.5" fill="#555" text-anchor="middle">training and retraining &#183; heavy review</text>
  <text x="175" y="381" font-size="10.5" fill="#555" text-anchor="middle">mapping &#183; labeling &#183; long-term learning</text>
  <text x="175" y="402" font-size="10.5" font-style="italic" fill="#a33a2a" text-anchor="middle">never the only path for a decision</text>
  <text x="175" y="416" font-size="10.5" font-style="italic" fill="#a33a2a" text-anchor="middle">the mission needs in the next 100 ms</text>

  <!-- ============ COLUMN 2: COMPANION COMPUTER ============ -->
  <rect x="335" y="80" width="270" height="360" rx="8" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="2"/>
  <text x="470" y="108" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Companion computer</text>
  <text x="470" y="126" font-size="11.5" fill="#555" text-anchor="middle">on the airframe &#8212; Jetson-class SBC</text>

  <!-- board icon -->
  <rect x="410" y="140" width="120" height="86" rx="4" fill="#e8edef" stroke="#55636b" stroke-width="1.5"/>
  <rect x="420" y="150" width="40" height="34" rx="2" fill="#2f3a3f"/>
  <rect x="468" y="150" width="52" height="34" rx="2" fill="#e8b04a" stroke="#4a3410" stroke-width="1"/>
  <text x="494" y="171" font-size="9" font-weight="bold" fill="#4a3410" text-anchor="middle">GPU</text>
  <text x="440" y="171" font-size="9" fill="#ffffff" text-anchor="middle">CPU</text>
  <rect x="420" y="192" width="100" height="14" rx="2" fill="#55636b"/>
  <text x="470" y="203" font-size="8.5" fill="#ffffff" text-anchor="middle">shared RAM</text>
  <rect x="420" y="212" width="70" height="8" rx="1" fill="#2f3a3f"/>

  <text x="355" y="252" font-size="11.5" fill="#222">Memory:</text>
  <text x="595" y="252" font-size="11.5" font-weight="bold" fill="#222" text-anchor="end">a few GB, shared CPU/GPU</text>
  <text x="355" y="272" font-size="11.5" fill="#222">Power:</text>
  <text x="595" y="272" font-size="11.5" font-weight="bold" fill="#222" text-anchor="end">~10 W (from the battery)</text>
  <text x="355" y="292" font-size="11.5" fill="#222">Compute clock:</text>
  <text x="595" y="292" font-size="11.5" font-weight="bold" fill="#222" text-anchor="end">GHz, ~100 GPU cores</text>
  <text x="355" y="312" font-size="11.5" fill="#222">Reached via:</text>
  <text x="595" y="312" font-size="11.5" font-weight="bold" fill="#1a7a8a" text-anchor="end">onboard bus &#8212; no radio</text>

  <rect x="351" y="330" width="238" height="94" rx="6" fill="#ffffff" stroke="#1a7a8a" stroke-width="1.2"/>
  <text x="470" y="349" font-size="11" font-weight="bold" fill="#1a4a5a" text-anchor="middle">Runs well here</text>
  <text x="470" y="366" font-size="10.5" fill="#555" text-anchor="middle">vision models at frame rate &#183; ROS 2 nodes</text>
  <text x="470" y="381" font-size="10.5" fill="#555" text-anchor="middle">logging &#183; the running example&#8217;s detector</text>
  <text x="470" y="402" font-size="10.5" font-style="italic" fill="#1a7a8a" text-anchor="middle">every watt of compute is subtracted</text>
  <text x="470" y="416" font-size="10.5" font-style="italic" fill="#1a7a8a" text-anchor="middle">from flight time</text>

  <!-- ============ COLUMN 3: MICROCONTROLLER ============ -->
  <rect x="630" y="80" width="270" height="360" rx="8" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="2"/>
  <text x="765" y="108" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Microcontroller (MCU)</text>
  <text x="765" y="126" font-size="11.5" fill="#555" text-anchor="middle">always-on &#8212; STM32 / Arduino-class</text>

  <!-- chip icon -->
  <rect x="725" y="152" width="80" height="62" rx="4" fill="#2f3a3f"/>
  <text x="765" y="188" font-size="9.5" fill="#ffffff" text-anchor="middle">MCU</text>
  <line x1="725" y1="162" x2="711" y2="162" stroke="#55636b" stroke-width="3"/>
  <line x1="725" y1="176" x2="711" y2="176" stroke="#55636b" stroke-width="3"/>
  <line x1="725" y1="190" x2="711" y2="190" stroke="#55636b" stroke-width="3"/>
  <line x1="725" y1="204" x2="711" y2="204" stroke="#55636b" stroke-width="3"/>
  <line x1="805" y1="162" x2="819" y2="162" stroke="#55636b" stroke-width="3"/>
  <line x1="805" y1="176" x2="819" y2="176" stroke="#55636b" stroke-width="3"/>
  <line x1="805" y1="190" x2="819" y2="190" stroke="#55636b" stroke-width="3"/>
  <line x1="805" y1="204" x2="819" y2="204" stroke="#55636b" stroke-width="3"/>

  <text x="650" y="252" font-size="11.5" fill="#222">Memory:</text>
  <text x="890" y="252" font-size="11.5" font-weight="bold" fill="#222" text-anchor="end">SRAM in the KB range</text>
  <text x="650" y="272" font-size="11.5" fill="#222">Power:</text>
  <text x="890" y="272" font-size="11.5" font-weight="bold" fill="#222" text-anchor="end">mW or below</text>
  <text x="650" y="292" font-size="11.5" fill="#222">Compute clock:</text>
  <text x="890" y="292" font-size="11.5" font-weight="bold" fill="#222" text-anchor="end">MHz, one core</text>
  <text x="650" y="312" font-size="11.5" fill="#222">Reached via:</text>
  <text x="890" y="312" font-size="11.5" font-weight="bold" fill="#1a7a8a" text-anchor="end">wired to its sensor</text>

  <rect x="646" y="330" width="238" height="94" rx="6" fill="#ffffff" stroke="#1a7a8a" stroke-width="1.2"/>
  <text x="765" y="349" font-size="11" font-weight="bold" fill="#1a4a5a" text-anchor="middle">Runs well here</text>
  <text x="765" y="366" font-size="10.5" fill="#555" text-anchor="middle">always-on IMU / audio triggers</text>
  <text x="765" y="381" font-size="10.5" fill="#555" text-anchor="middle">window classifiers &#183; wake-up cascades</text>
  <text x="765" y="402" font-size="10.5" font-style="italic" fill="#1a7a8a" text-anchor="middle">activations count against SRAM</text>
  <text x="765" y="416" font-size="10.5" font-style="italic" fill="#1a7a8a" text-anchor="middle">as hard as the weights do</text>

  <!-- gap arrows between columns -->
  <line x1="312" y1="248" x2="333" y2="248" stroke="#1a7a8a" stroke-width="1.8" marker-end="url(#dclArrow)"/>
  <line x1="607" y1="248" x2="628" y2="248" stroke="#1a7a8a" stroke-width="1.8" marker-end="url(#dclArrow)"/>

  <!-- memory scale bar -->
  <text x="60" y="474" font-size="12" font-weight="bold" fill="#222">Same axis, log scale &#8212; memory available to the model:</text>
  <line x1="60" y1="500" x2="880" y2="500" stroke="#55636b" stroke-width="1.5"/>
  <line x1="850" y1="494" x2="850" y2="506" stroke="#55636b" stroke-width="1.5"/>
  <line x1="720" y1="494" x2="720" y2="506" stroke="#55636b" stroke-width="1.5"/>
  <line x1="174" y1="494" x2="174" y2="506" stroke="#55636b" stroke-width="1.5"/>
  <text x="838" y="522" font-size="11" fill="#222" text-anchor="middle">40 GB (server GPU)</text>
  <text x="704" y="522" font-size="11" fill="#222" text-anchor="middle">4 GB (Jetson Nano)</text>
  <text x="174" y="522" font-size="11" fill="#222" text-anchor="middle">256 KB (MCU SRAM)</text>
  <text x="785" y="491" font-size="10.5" font-style="italic" fill="#1a7a8a" text-anchor="middle">&#215;10 down</text>
  <text x="447" y="491" font-size="10.5" font-style="italic" fill="#1a7a8a" text-anchor="middle">&#215;16,000 down</text>
  <line x1="840" y1="500" x2="730" y2="500" stroke="#1a7a8a" stroke-width="2.5" marker-end="url(#dclArrow)"/>
  <line x1="710" y1="500" x2="184" y2="500" stroke="#1a7a8a" stroke-width="2.5" marker-end="url(#dclArrow)"/>

  <!-- banner -->
  <rect x="40" y="548" width="860" height="92" rx="8" fill="#10233c"/>
  <text x="470" y="576" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Deployment is a placement problem: choose where the model runs before choosing the model</text>
  <text x="470" y="600" font-size="12.5" fill="#ffffff" text-anchor="middle">keep urgent sensing local &#8212; offload only what can wait &#183; a decision the mission consumes at frame rate can never depend on a radio</text>
  <text x="470" y="624" font-size="12" fill="#e8b04a" text-anchor="middle">Running example: the goose detector runs on the Jetson Nano &#8212; trained in the cloud tier, flown in the companion tier</text>
</svg>
