<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="wpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
    <marker id="wpArrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="wpDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <text x="480" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">A waypoint mission: an ordered list with a start, a sweep, and a way home</text>
  <text x="480" y="52" font-size="13" fill="#555" text-anchor="middle">Every marker is one mission item &#8212; a command plus a latitude, longitude, and altitude &#8212; executed in sequence.</text>

  <!-- geofence polygon -->
  <polygon points="170,120 850,138 838,532 155,510" fill="#fdf3e7" fill-opacity="0.45" stroke="#b26a1a" stroke-width="2.4" stroke-dasharray="10 6"/>
  <text x="520" y="110" font-size="12" font-weight="bold" fill="#8a4d0f" text-anchor="middle">geofence inclusion polygon &#8212; the mission must stay inside it (next chapter&#8217;s subject)</text>

  <!-- north arrow -->
  <line x1="905" y1="90" x2="905" y2="55" stroke="#666" stroke-width="2" marker-end="url(#wpDim)"/>
  <text x="905" y="104" font-size="11" font-weight="bold" fill="#666" text-anchor="middle">N</text>

  <!-- row pitch dimension between leg 1 and leg 2 -->
  <line x1="300" y1="152" x2="480" y2="152" stroke="#666" stroke-width="1.4" marker-start="url(#wpDim)" marker-end="url(#wpDim)"/>
  <text x="390" y="143" font-size="10.5" fill="#666" text-anchor="middle" font-style="italic">row pitch &#8212; set by the sensor footprint (Part IV)</text>

  <!-- flight path: H -> 1 -> 2 -> 3 -> 4 -> 5 -->
  <line x1="252" y1="464" x2="286" y2="450" stroke="#1a7a8a" stroke-width="2.6" marker-end="url(#wpArrow)"/>
  <line x1="300" y1="433" x2="300" y2="206" stroke="#1a7a8a" stroke-width="2.6" marker-end="url(#wpArrow)"/>
  <line x1="312" y1="192" x2="466" y2="192" stroke="#1a7a8a" stroke-width="2.6" marker-end="url(#wpArrow)"/>
  <line x1="480" y1="204" x2="480" y2="431" stroke="#1a7a8a" stroke-width="2.6" marker-end="url(#wpArrow)"/>
  <line x1="492" y1="445" x2="646" y2="445" stroke="#1a7a8a" stroke-width="2.6" marker-end="url(#wpArrow)"/>

  <!-- RTL dashed return, dipping south of the waypoint row -->
  <path d="M 648 452 Q 450 548 264 470" fill="none" stroke="#8a8a8a" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#wpArrowGrey)"/>
  <text x="512" y="548" font-size="11" fill="#555" font-style="italic" text-anchor="middle">NAV_RETURN_TO_LAUNCH &#8212; fly home at a safe altitude, descend, land, disarm</text>

  <!-- home marker -->
  <circle cx="238" cy="470" r="11" fill="#ffffff" stroke="#b26a1a" stroke-width="2.6"/>
  <text x="238" y="474.5" font-size="11" font-weight="bold" fill="#8a4d0f" text-anchor="middle">H</text>
  <line x1="230" y1="479" x2="185" y2="522" stroke="#b26a1a" stroke-width="1.2"/>
  <text x="150" y="538" font-size="11.5" font-weight="bold" fill="#8a4d0f" text-anchor="middle">home position</text>
  <text x="150" y="552" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">recorded where the vehicle armed;</text>
  <text x="150" y="566" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">the point RTL returns to</text>
  <text x="50" y="430" font-size="10.5" fill="#555" font-style="italic" text-anchor="start">NAV_TAKEOFF:</text>
  <text x="50" y="444" font-size="10.5" fill="#555" font-style="italic" text-anchor="start">climb straight up to</text>
  <text x="50" y="458" font-size="10.5" fill="#555" font-style="italic" text-anchor="start">mission altitude first</text>

  <!-- waypoints -->
  <circle cx="300" cy="445" r="10" fill="#1a7a8a"/>
  <text x="300" y="449.5" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="300" cy="192" r="10" fill="#1a7a8a"/>
  <text x="300" y="196.5" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="480" cy="192" r="10" fill="#1a7a8a"/>
  <text x="480" y="196.5" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="480" cy="445" r="10" fill="#1a7a8a"/>
  <text x="480" y="449.5" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <circle cx="660" cy="445" r="10" fill="#1a7a8a"/>
  <text x="660" y="449.5" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

  <!-- acceptance radius on WP2 -->
  <circle cx="300" cy="192" r="32" fill="none" stroke="#1a7a8a" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="320" y1="217" x2="333" y2="248" stroke="#1a7a8a" stroke-width="1.4"/>
  <text x="332" y="264" font-size="10.5" fill="#1a4a5a" font-style="italic" text-anchor="start">acceptance radius r &#8212;</text>
  <text x="332" y="278" font-size="10.5" fill="#1a4a5a" font-style="italic" text-anchor="start">the waypoint counts as</text>
  <text x="332" y="292" font-size="10.5" fill="#1a4a5a" font-style="italic" text-anchor="start">reached when the estimated</text>
  <text x="332" y="306" font-size="10.5" fill="#1a4a5a" font-style="italic" text-anchor="start">position enters this circle;</text>
  <text x="332" y="320" font-size="10.5" fill="#1a4a5a" font-style="italic" text-anchor="start">only then does the navigator</text>
  <text x="332" y="334" font-size="10.5" fill="#1a4a5a" font-style="italic" text-anchor="start">advance to the next item</text>

  <!-- leg annotation -->
  <text x="270" y="330" font-size="10.5" fill="#555" font-style="italic" text-anchor="middle" transform="rotate(-90 270 330)">north&#8211;south legs, constant altitude and speed</text>

  <!-- footer note -->
  <text x="480" y="580" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">A lawnmower (boustrophedon) sweep: parallel legs joined by short row steps cover an area with a sensor of finite footprint &#8212;</text>
  <text x="480" y="596" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">the pattern the running example flies to search for geese, drawn by hand here and generated by algorithm in Part IV.</text>
</svg>
