<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="cfmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>

  <text x="440" y="32" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Convolution: one small kernel, slid over the whole image</text>
  <text x="440" y="54" font-size="13" fill="#555" text-anchor="middle">At every position: multiply the 3 &#215; 3 window by the kernel element-wise, sum, write one number to the feature map.</text>

  <!-- ===== input grid (9x9, 24px cells) ===== -->
  <text x="178" y="92" font-size="14" font-weight="bold" fill="#1a4a5a" text-anchor="middle">input image (one channel shown)</text>
  <g>
    <rect x="70" y="104" width="216" height="216" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="2"/>
    <g stroke="#c8ced2" stroke-width="0.8">
      <line x1="94" y1="104" x2="94" y2="320"/><line x1="118" y1="104" x2="118" y2="320"/>
      <line x1="142" y1="104" x2="142" y2="320"/><line x1="166" y1="104" x2="166" y2="320"/>
      <line x1="190" y1="104" x2="190" y2="320"/><line x1="214" y1="104" x2="214" y2="320"/>
      <line x1="238" y1="104" x2="238" y2="320"/><line x1="262" y1="104" x2="262" y2="320"/>
      <line x1="70" y1="128" x2="286" y2="128"/><line x1="70" y1="152" x2="286" y2="152"/>
      <line x1="70" y1="176" x2="286" y2="176"/><line x1="70" y1="200" x2="286" y2="200"/>
      <line x1="70" y1="224" x2="286" y2="224"/><line x1="70" y1="248" x2="286" y2="248"/>
      <line x1="70" y1="272" x2="286" y2="272"/><line x1="70" y1="296" x2="286" y2="296"/>
    </g>
    <!-- a vertical intensity edge in the image: darker columns on the right -->
    <rect x="214" y="104" width="72" height="216" fill="#c8d4d9" opacity="0.7"/>
    <!-- solid window position -->
    <rect x="118" y="152" width="72" height="72" fill="none" stroke="#8a5210" stroke-width="3"/>
    <!-- dashed later window position -->
    <rect x="190" y="224" width="72" height="72" fill="none" stroke="#8a5210" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="226" y="311" font-size="10.5" fill="#8a5210" text-anchor="middle">&#8230;later position</text>
  </g>
  <text x="178" y="342" font-size="12" fill="#555" text-anchor="middle" font-style="italic">a pixel means little alone; the 3 &#215; 3</text>
  <text x="178" y="358" font-size="12" fill="#555" text-anchor="middle" font-style="italic">neighbourhood is where the pattern lives</text>

  <!-- ===== kernel ===== -->
  <text x="440" y="128" font-size="14" font-weight="bold" fill="#8a5210" text-anchor="middle">kernel (learned weights)</text>
  <g font-size="14" text-anchor="middle">
    <rect x="380" y="140" width="120" height="120" fill="#fdf3e3" stroke="#8a5210" stroke-width="2.5"/>
    <line x1="420" y1="140" x2="420" y2="260" stroke="#8a5210" stroke-width="1"/>
    <line x1="460" y1="140" x2="460" y2="260" stroke="#8a5210" stroke-width="1"/>
    <line x1="380" y1="180" x2="500" y2="180" stroke="#8a5210" stroke-width="1"/>
    <line x1="380" y1="220" x2="500" y2="220" stroke="#8a5210" stroke-width="1"/>
    <text x="400" y="165" fill="#4a3410">&#8722;1</text><text x="440" y="165" fill="#4a3410">0</text><text x="480" y="165" fill="#4a3410">+1</text>
    <text x="400" y="205" fill="#4a3410">&#8722;2</text><text x="440" y="205" fill="#4a3410">0</text><text x="480" y="205" fill="#4a3410">+2</text>
    <text x="400" y="245" fill="#4a3410">&#8722;1</text><text x="440" y="245" fill="#4a3410">0</text><text x="480" y="245" fill="#4a3410">+1</text>
  </g>
  <text x="440" y="282" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">this one responds to vertical edges;</text>
  <text x="440" y="297" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">a network learns its own kernels</text>

  <!-- arrows through the kernel -->
  <line x1="292" y1="188" x2="372" y2="196" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#cfmArrow)"/>
  <line x1="506" y1="196" x2="586" y2="188" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#cfmArrow)"/>
  <text x="440" y="322" font-size="12" fill="#1a7a8a" text-anchor="middle">multiply element-wise, sum &#8594; one output value</text>

  <!-- ===== feature map ===== -->
  <text x="700" y="92" font-size="14" font-weight="bold" fill="#1a4a5a" text-anchor="middle">feature map</text>
  <g>
    <rect x="616" y="104" width="168" height="168" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="2"/>
    <g stroke="#c8ced2" stroke-width="0.8">
      <line x1="640" y1="104" x2="640" y2="272"/><line x1="664" y1="104" x2="664" y2="272"/>
      <line x1="688" y1="104" x2="688" y2="272"/><line x1="712" y1="104" x2="712" y2="272"/>
      <line x1="736" y1="104" x2="736" y2="272"/><line x1="760" y1="104" x2="760" y2="272"/>
      <line x1="616" y1="128" x2="784" y2="128"/><line x1="616" y1="152" x2="784" y2="152"/>
      <line x1="616" y1="176" x2="784" y2="176"/><line x1="616" y1="200" x2="784" y2="200"/>
      <line x1="616" y1="224" x2="784" y2="224"/><line x1="616" y1="248" x2="784" y2="248"/>
    </g>
    <!-- strong responses along the edge column -->
    <rect x="712" y="104" width="24" height="168" fill="#e8b04a" opacity="0.55"/>
    <!-- output cell for the solid window (near zero: window sits on a uniform region) -->
    <rect x="664" y="152" width="24" height="24" fill="none" stroke="#8a5210" stroke-width="3"/>
    <text x="676" y="169" font-size="10" fill="#8a5210" text-anchor="middle">~0</text>
  </g>
  <text x="700" y="294" font-size="12" fill="#555" text-anchor="middle" font-style="italic">where the pattern occurs, the map</text>
  <text x="700" y="310" font-size="12" fill="#555" text-anchor="middle" font-style="italic">is bright &#8212; a map of &#8220;pattern found here&#8221;</text>

  <!-- ===== footer: parameter arithmetic ===== -->
  <rect x="40" y="382" width="800" height="94" rx="8" fill="#f2f6f8" stroke="#1a7a8a" stroke-width="1.5"/>
  <text x="440" y="408" font-size="13" font-weight="bold" fill="#1a4a5a" text-anchor="middle">Weight sharing is the whole trick</text>
  <text x="440" y="430" font-size="12.5" fill="#222" text-anchor="middle">The same 3 &#215; 3 &#215; 3 kernel (27 weights + 1 bias = 28 parameters) is used at every one of the ~300,000 positions in a 640 &#215; 480 frame.</text>
  <text x="440" y="450" font-size="12.5" fill="#222" text-anchor="middle">A layer with F kernels maps an H &#215; W &#215; C tensor to an H&#8242; &#215; W&#8242; &#215; F tensor &#8212; the channel axis now counts detected features, not colours.</text>
  <text x="440" y="470" font-size="12" fill="#555" text-anchor="middle" font-style="italic">Because the kernel slides, a pattern learned once is recognized wherever it appears in the frame &#8212; translation equivariance.</text>
</svg>
