<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <g id="rfmGoose">
      <ellipse cx="0" cy="0" rx="30" ry="13" fill="#4a4a4a"/>
      <path d="M 20 -6 C 27 -15, 29 -26, 25 -37" stroke="#4a4a4a" stroke-width="5.5" fill="none" stroke-linecap="round"/>
      <circle cx="25" cy="-41" r="5" fill="#4a4a4a"/>
      <path d="M 30 -43 L 39 -40 L 30 -37 z" fill="#4a4a4a"/>
    </g>
  </defs>

  <rect x="0" y="0" width="900" height="660" fill="#ffffff"/>

  <text x="450" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">When the world leaves the dataset &#8212; three failure modes and their mitigations</text>
  <text x="450" y="52" font-size="13" fill="#555" text-anchor="middle">Each is a coverage statement about the dataset; each admits data, system, and evaluation responses.</text>

  <!-- ================= column 1: lighting change ================= -->
  <rect x="30" y="70" width="272" height="470" rx="8" fill="#fdf3e6" stroke="#8a5210" stroke-width="1.5"/>
  <text x="166" y="94" font-size="14" font-weight="bold" fill="#8a5210" text-anchor="middle">Lighting change</text>
  <text x="166" y="111" font-size="10.5" fill="#555" text-anchor="middle">low sun, overcast, glare, moving shadows, dusk</text>

  <!-- scene: half in harsh shadow -->
  <g>
    <rect x="50" y="122" width="232" height="110" fill="#dcebf2" stroke="#1a4a5a" stroke-width="1.5"/>
    <rect x="51" y="192" width="230" height="39" fill="#eef6f0"/>
    <rect x="166" y="123" width="115" height="108" fill="#333" opacity="0.45"/>
    <use href="#rfmGoose" x="185" y="205"/>
    <text x="108" y="140" font-size="9.5" fill="#555">morning side</text>
    <text x="222" y="140" font-size="9.5" fill="#eee">shadow side</text>
  </g>

  <text x="50" y="256" font-size="11.5" font-weight="bold" fill="#822">Symptom</text>
  <g font-size="10.5" fill="#222">
    <text x="50" y="272">confidence sags across whole flights;</text>
    <text x="50" y="286">recall drops in exactly the conditions the</text>
    <text x="50" y="300">dataset undersampled; dim light stretches</text>
    <text x="50" y="314">exposure, which adds blur on top</text>
  </g>

  <text x="50" y="340" font-size="11.5" font-weight="bold" fill="#2f5a3a">Mitigations</text>
  <g font-size="10.5" fill="#222">
    <text x="50" y="356">&#8226; brightness/contrast augmentation</text>
    <text x="50" y="370">&#8226; collect across times of day (the previous</text>
    <text x="58" y="384">chapter's checklist, taken seriously)</text>
    <text x="50" y="398">&#8226; report metrics per condition, so the</text>
    <text x="58" y="412">dusk gap is visible before deployment</text>
  </g>
  <text x="50" y="440" font-size="10" fill="#8a5210" font-style="italic">augmentation approximates a lighting shift;</text>
  <text x="50" y="454" font-size="10" fill="#8a5210" font-style="italic">only collection captures a lighting domain &#8212;</text>
  <text x="50" y="468" font-size="10" fill="#8a5210" font-style="italic">dusk is a domain, not a perturbation</text>

  <!-- ================= column 2: motion blur ================= -->
  <rect x="314" y="70" width="272" height="470" rx="8" fill="#fdf0ee" stroke="#822" stroke-width="1.5"/>
  <text x="450" y="94" font-size="14" font-weight="bold" fill="#822" text-anchor="middle">Motion blur</text>
  <text x="450" y="111" font-size="10.5" fill="#555" text-anchor="middle">vibration, fast yaw in search turns, long exposure</text>

  <!-- scene: smeared goose -->
  <g>
    <rect x="334" y="122" width="232" height="110" fill="#dcebf2" stroke="#1a4a5a" stroke-width="1.5"/>
    <rect x="335" y="192" width="230" height="39" fill="#eef6f0"/>
    <g opacity="0.25"><use href="#rfmGoose" x="424" y="205"/></g>
    <g opacity="0.35"><use href="#rfmGoose" x="437" y="205"/></g>
    <g opacity="0.5"><use href="#rfmGoose" x="450" y="205"/></g>
    <g opacity="0.75"><use href="#rfmGoose" x="463" y="205"/></g>
    <text x="450" y="140" font-size="9.5" fill="#555" text-anchor="middle">one exposure, smeared across the frame</text>
  </g>

  <text x="334" y="256" font-size="11.5" font-weight="bold" fill="#822">Symptom</text>
  <g font-size="10.5" fill="#222">
    <text x="334" y="272">single-frame dropouts: boxes vanish for</text>
    <text x="334" y="286">1&#8211;3 frames, then return; small, distant</text>
    <text x="334" y="300">targets smear into the background first</text>
    <text x="334" y="314">(the 7-pixel goose goes first)</text>
  </g>

  <text x="334" y="340" font-size="11.5" font-weight="bold" fill="#2f5a3a">Mitigations</text>
  <g font-size="10.5" fill="#222">
    <text x="334" y="356">&#8226; blur/noise augmentation</text>
    <text x="334" y="370">&#8226; gimbal stabilization, shorter exposure</text>
    <text x="342" y="384">where the hardware allows it</text>
    <text x="334" y="398">&#8226; slower, gentler flight on detection legs</text>
    <text x="334" y="412">&#8226; track coasting carries identity through</text>
    <text x="342" y="426">the blurred frames</text>
  </g>
  <text x="334" y="454" font-size="10" fill="#822" font-style="italic">note two mitigations are flight-profile and</text>
  <text x="334" y="468" font-size="10" fill="#822" font-style="italic">tracker design, not model design at all</text>

  <!-- ================= column 3: occlusion ================= -->
  <rect x="598" y="70" width="272" height="470" rx="8" fill="#eef6f0" stroke="#2f5a3a" stroke-width="1.5"/>
  <text x="734" y="94" font-size="14" font-weight="bold" fill="#2f5a3a" text-anchor="middle">Occlusion</text>
  <text x="734" y="111" font-size="10.5" fill="#555" text-anchor="middle">vegetation, terrain, other birds, the frame edge</text>

  <!-- scene: goose behind reeds -->
  <g>
    <rect x="618" y="122" width="232" height="110" fill="#dcebf2" stroke="#1a4a5a" stroke-width="1.5"/>
    <rect x="619" y="192" width="230" height="39" fill="#eef6f0"/>
    <use href="#rfmGoose" x="734" y="205"/>
    <g stroke="#2f5a3a" stroke-width="4" stroke-linecap="round">
      <line x1="742" y1="230" x2="738" y2="168"/>
      <line x1="752" y1="230" x2="750" y2="172"/>
      <line x1="762" y1="230" x2="766" y2="170"/>
      <line x1="731" y1="230" x2="726" y2="175"/>
    </g>
    <text x="680" y="140" font-size="9.5" fill="#555" text-anchor="middle">half a goose, behind reeds</text>
  </g>

  <text x="618" y="256" font-size="11.5" font-weight="bold" fill="#822">Symptom</text>
  <g font-size="10.5" fill="#222">
    <text x="618" y="272">partial boxes with depressed confidence;</text>
    <text x="618" y="286">misses while the animal is genuinely</text>
    <text x="618" y="300">present; ID switches when two birds</text>
    <text x="618" y="314">cross or one passes behind cover</text>
  </g>

  <text x="618" y="340" font-size="11.5" font-weight="bold" fill="#2f5a3a">Mitigations</text>
  <g font-size="10.5" fill="#222">
    <text x="618" y="356">&#8226; label partially visible targets, per the</text>
    <text x="626" y="370">dataset's written class-boundary rules</text>
    <text x="618" y="384">&#8226; tracker persistence + coasting bridge</text>
    <text x="626" y="398">brief disappearances</text>
    <text x="618" y="412">&#8226; approach geometry that keeps the</text>
    <text x="626" y="426">target in open view</text>
  </g>
  <text x="618" y="454" font-size="10" fill="#2f5a3a" font-style="italic">occlusion is the one mode the tracker was</text>
  <text x="618" y="468" font-size="10" fill="#2f5a3a" font-style="italic">practically built for &#8212; identity survives what</text>
  <text x="618" y="482" font-size="10" fill="#2f5a3a" font-style="italic">any single frame cannot show</text>

  <!-- shared structure strip -->
  <g font-size="10.5" fill="#555" text-anchor="middle">
    <text x="166" y="524" font-style="italic">data &#8594; system &#8594; evaluation</text>
    <text x="450" y="524" font-style="italic">data &#8594; system &#8594; evaluation</text>
    <text x="734" y="524" font-style="italic">data &#8594; system &#8594; evaluation</text>
  </g>

  <!-- footer -->
  <rect x="30" y="552" width="840" height="88" rx="8" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="1.5"/>
  <text x="450" y="575" font-size="12.5" fill="#222" text-anchor="middle"><tspan font-weight="bold">The common structure is distribution shift:</tspan> deployment inputs drift from the training distribution, and the</text>
  <text x="450" y="593" font-size="12.5" fill="#222" text-anchor="middle">validation score silently stops predicting field performance &#8212; the model keeps emitting confident boxes either way.</text>
  <text x="450" y="615" font-size="12" fill="#822" text-anchor="middle" font-style="italic"><tspan font-weight="bold">Runtime rule:</tspan> monitor confidence and detection-rate statistics in flight; on sustained anomaly, degrade gracefully &#8212;</text>
  <text x="450" y="631" font-size="12" fill="#822" text-anchor="middle" font-style="italic">widen persistence, slow the search, hold position, or hand back control &#8212; rather than steering on fiction.</text>
</svg>
