<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="600" fill="#ffffff"/>

  <!-- rotor bell: top plate and side walls (sectioned) -->
  <rect x="205" y="115" width="330" height="20" fill="#7a7a7a" stroke="#3f3f3f" stroke-width="1.5"/>
  <rect x="205" y="135" width="17" height="210" fill="#7a7a7a" stroke="#3f3f3f" stroke-width="1.5"/>
  <rect x="518" y="135" width="17" height="210" fill="#7a7a7a" stroke="#3f3f3f" stroke-width="1.5"/>

  <!-- permanent magnets bonded to the bell inner wall -->
  <rect x="222" y="150" width="18" height="180" fill="#c9524e" stroke="#7d2f2c" stroke-width="1.5"/>
  <rect x="500" y="150" width="18" height="180" fill="#5b84b8" stroke="#2f4d75" stroke-width="1.5"/>
  <text x="231" y="245" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">N</text>
  <text x="509" y="245" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">S</text>

  <!-- stator mounting tube and base (stationary) -->
  <rect x="340" y="175" width="60" height="280" fill="#d5d5d5" stroke="#666" stroke-width="1.5"/>
  <rect x="290" y="455" width="160" height="23" fill="#d5d5d5" stroke="#666" stroke-width="1.5"/>

  <!-- stator, left half of section: shoe, tooth shank, back iron -->
  <rect x="248" y="175" width="14" height="130" fill="#b5b5b5" stroke="#666" stroke-width="1.5"/>
  <rect x="262" y="212" width="50" height="56" fill="#b5b5b5" stroke="#666" stroke-width="1.5"/>
  <rect x="312" y="175" width="20" height="130" fill="#b5b5b5" stroke="#666" stroke-width="1.5"/>
  <!-- stator, right half of section -->
  <rect x="478" y="175" width="14" height="130" fill="#b5b5b5" stroke="#666" stroke-width="1.5"/>
  <rect x="428" y="212" width="50" height="56" fill="#b5b5b5" stroke="#666" stroke-width="1.5"/>
  <rect x="408" y="175" width="20" height="130" fill="#b5b5b5" stroke="#666" stroke-width="1.5"/>

  <!-- lamination lines in the iron -->
  <g stroke="#777" stroke-width="0.7">
    <path d="M249 187 H261 M249 199 H261 M249 211 H261 M249 223 H261 M249 235 H261 M249 247 H261 M249 259 H261 M249 271 H261 M249 283 H261 M249 295 H261"/>
    <path d="M313 187 H331 M313 199 H331 M313 211 H331 M313 223 H331 M313 235 H331 M313 247 H331 M313 259 H331 M313 271 H331 M313 283 H331 M313 295 H331"/>
    <path d="M263 224 H311 M263 236 H311 M263 248 H311 M263 260 H311"/>
    <path d="M479 187 H491 M479 199 H491 M479 211 H491 M479 223 H491 M479 235 H491 M479 247 H491 M479 259 H491 M479 271 H491 M479 283 H491 M479 295 H491"/>
    <path d="M409 187 H427 M409 199 H427 M409 211 H427 M409 223 H427 M409 235 H427 M409 247 H427 M409 259 H427 M409 271 H427 M409 283 H427 M409 295 H427"/>
    <path d="M429 224 H477 M429 236 H477 M429 248 H477 M429 260 H477"/>
  </g>

  <!-- copper windings in the slots around the tooth -->
  <g fill="#d08a3e" stroke="#8a5420" stroke-width="1.2">
    <circle cx="272" cy="188" r="6.5"/><circle cx="288" cy="188" r="6.5"/><circle cx="304" cy="188" r="6.5"/>
    <circle cx="272" cy="202" r="6.5"/><circle cx="288" cy="202" r="6.5"/><circle cx="304" cy="202" r="6.5"/>
    <circle cx="272" cy="278" r="6.5"/><circle cx="288" cy="278" r="6.5"/><circle cx="304" cy="278" r="6.5"/>
    <circle cx="272" cy="292" r="6.5"/><circle cx="288" cy="292" r="6.5"/><circle cx="304" cy="292" r="6.5"/>
    <circle cx="436" cy="188" r="6.5"/><circle cx="452" cy="188" r="6.5"/><circle cx="468" cy="188" r="6.5"/>
    <circle cx="436" cy="202" r="6.5"/><circle cx="452" cy="202" r="6.5"/><circle cx="468" cy="202" r="6.5"/>
    <circle cx="436" cy="278" r="6.5"/><circle cx="452" cy="278" r="6.5"/><circle cx="468" cy="278" r="6.5"/>
    <circle cx="436" cy="292" r="6.5"/><circle cx="452" cy="292" r="6.5"/><circle cx="468" cy="292" r="6.5"/>
  </g>

  <!-- bearings on the shaft, inside the mounting tube -->
  <g fill="#efefef" stroke="#555" stroke-width="1.3">
    <rect x="344" y="190" width="17" height="25"/><rect x="379" y="190" width="17" height="25"/>
    <rect x="344" y="395" width="17" height="25"/><rect x="379" y="395" width="17" height="25"/>
  </g>
  <g stroke="#666" stroke-width="1">
    <path d="M344 190 L361 215 M361 190 L344 215 M379 190 L396 215 M396 190 L379 215"/>
    <path d="M344 395 L361 420 M361 395 L344 420 M379 395 L396 420 M396 395 L379 420"/>
  </g>

  <!-- shaft (drawn last so it passes through the bell top plate) -->
  <rect x="362" y="45" width="16" height="425" fill="#9aa2ab" stroke="#4a4f55" stroke-width="1.5"/>

  <!-- rotation arc -->
  <path d="M 395 92 A 80 26 0 0 1 500 100" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="92" font-size="14" fill="#222">rotation</text>

  <!-- labels, left column -->
  <g font-size="15" fill="#222">
    <text x="15" y="55">shaft (rotates with the bell)</text>
    <text x="15" y="100">rotor bell (rotates)</text>
    <text x="15" y="168">permanent magnet</text>
    <text x="15" y="186">(bonded to the bell)</text>
    <text x="15" y="235">air gap</text>
    <text x="15" y="290">laminated iron stator core</text>
    <text x="15" y="308">(stationary)</text>
    <text x="15" y="360">copper windings</text>
  </g>
  <g stroke="#999" stroke-width="1.2">
    <line x1="205" y1="50" x2="360" y2="48"/>
    <line x1="145" y1="95" x2="212" y2="118"/>
    <line x1="140" y1="163" x2="226" y2="185"/>
    <line x1="70" y1="231" x2="244" y2="238"/>
    <line x1="192" y1="286" x2="252" y2="290"/>
    <line x1="130" y1="355" x2="272" y2="296"/>
  </g>

  <!-- labels, right side -->
  <text x="585" y="445" font-size="15" fill="#222">bearings</text>
  <line x1="580" y1="440" x2="398" y2="410" stroke="#999" stroke-width="1.2"/>
  <text x="560" y="472" font-size="15" fill="#222">motor mount (stationary)</text>
  <line x1="555" y1="467" x2="452" y2="466" stroke="#999" stroke-width="1.2"/>

  <!-- stator height dimension: the "12" -->
  <line x1="494" y1="175" x2="600" y2="175" stroke="#aaa" stroke-width="1"/>
  <line x1="494" y1="305" x2="600" y2="305" stroke="#aaa" stroke-width="1"/>
  <line x1="593" y1="175" x2="593" y2="305" stroke="#444" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="604" y="232" font-size="14.5" fill="#222">stator height &#8212;</text>
  <text x="604" y="250" font-size="14.5" fill="#222">the &#8220;12&#8221; (12 mm)</text>

  <!-- stator diameter dimension: the "28" -->
  <line x1="248" y1="310" x2="248" y2="492" stroke="#aaa" stroke-width="1"/>
  <line x1="492" y1="310" x2="492" y2="492" stroke="#aaa" stroke-width="1"/>
  <line x1="248" y1="486" x2="492" y2="486" stroke="#444" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="370" y="512" font-size="14.5" fill="#222" text-anchor="middle">stator diameter &#8212; the &#8220;28&#8221; (28 mm)</text>

  <!-- footer -->
  <text x="400" y="552" font-size="14.5" fill="#222" text-anchor="middle" font-style="italic">2812 900KV &#8212; 28: stator diameter (mm) &#183; 12: stator height (mm) &#183; 900KV: speed constant, RPM per volt of back-EMF</text>
  <text x="400" y="576" font-size="13" fill="#555" text-anchor="middle">the size digits describe the stationary iron and copper; KV describes the winding wound onto them</text>
</svg>
