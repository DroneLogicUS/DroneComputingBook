<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">
  <defs>
    <marker id="opTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
    <marker id="opAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b26a1a"/>
    </marker>
    <marker id="opGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <text x="480" y="28" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">The orbit pattern: pressure without pursuit</text>
  <text x="480" y="50" font-size="13" fill="#555" text-anchor="middle">A fixed-radius circle around the flock's tracked center, re-centered every tick, nose always on the flock.</text>

  <!-- current orbit -->
  <circle cx="300" cy="330" r="180" fill="none" stroke="#1a7a8a" stroke-width="2.6"/>

  <!-- re-centered orbit (dashed) -->
  <circle cx="420" cy="255" r="180" fill="none" stroke="#1a7a8a" stroke-width="1.8" stroke-dasharray="8 7" opacity="0.55"/>
  <path d="M 308 322 L 408 264" fill="none" stroke="#b26a1a" stroke-width="2.2" marker-end="url(#opAmber)"/>
  <text x="418" y="152" font-size="11" font-style="italic" fill="#1a4a5a" text-anchor="middle">orbit re-centered after the flock moves &#8212;</text>
  <text x="418" y="168" font-size="11" font-style="italic" fill="#1a4a5a" text-anchor="middle">a fresh target estimate slides the circle every tick</text>

  <!-- flock at center -->
  <g fill="#b26a1a">
    <ellipse cx="284" cy="322" rx="11" ry="7"/>
    <ellipse cx="308" cy="316" rx="11" ry="7"/>
    <ellipse cx="296" cy="340" rx="11" ry="7"/>
    <ellipse cx="318" cy="338" rx="11" ry="7"/>
  </g>
  <circle cx="300" cy="330" r="4" fill="#8a4d0f"/>
  <text x="338" y="375" font-size="11.5" font-weight="bold" fill="#8a4d0f" text-anchor="middle">c = tracked flock center</text>

  <!-- radius dimension -->
  <line x1="300" y1="330" x2="148" y2="435" stroke="#666" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="52" y="464" font-size="12" font-style="italic" fill="#555">R = 3.0 m (shipped)</text>
  <text x="52" y="480" font-size="10" font-style="italic" fill="#777">design band 8&#8211;15 m</text>
  <line x1="148" y1="435" x2="140" y2="455" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- drone on orbit (upper-left of the circle) -->
  <g transform="translate(173 203)">
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#1a7a8a" stroke-width="3"/>
    <line x1="-12" y1="12" x2="12" y2="-12" stroke="#1a7a8a" stroke-width="3"/>
    <circle cx="-12" cy="-12" r="5" fill="#1a7a8a"/>
    <circle cx="12" cy="-12" r="5" fill="#1a7a8a"/>
    <circle cx="-12" cy="12" r="5" fill="#1a7a8a"/>
    <circle cx="12" cy="12" r="5" fill="#1a7a8a"/>
  </g>
  <!-- tangent velocity arrow -->
  <path d="M 190 185 L 260 115" fill="none" stroke="#1a7a8a" stroke-width="2.6" marker-end="url(#opTeal)"/>
  <text x="272" y="108" font-size="11.5" font-weight="bold" fill="#1a4a5a">v = 2.0 m/s (tangent)</text>
  <!-- yaw toward center -->
  <path d="M 196 216 L 278 310" fill="none" stroke="#b26a1a" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#opAmber)"/>
  <text x="30" y="262" font-size="11" font-style="italic" fill="#8a4d0f">yaw = atan2(c &#8722; p):</text>
  <text x="30" y="278" font-size="11" font-style="italic" fill="#8a4d0f">always face the flock</text>

  <!-- angular rate arc -->
  <path d="M 404 476 A 180 180 0 0 1 300 510" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#opGrey)"/>
  <text x="368" y="530" font-size="11.5" font-style="italic" fill="#555" text-anchor="middle">&#952;&#775; = v / R = 0.67 rad/s</text>

  <!-- sidebar: shipped defaults -->
  <rect x="650" y="92" width="270" height="190" rx="8" fill="#eef4f5" stroke="#1a7a8a" stroke-width="1.5"/>
  <text x="666" y="116" font-size="12.5" font-weight="bold" fill="#1a4a5a">Shipped defaults (20 Hz tick)</text>
  <text x="666" y="138" font-size="11" fill="#333">radius R = 3.0 m &#8226; speed v = 2.0 m/s</text>
  <text x="666" y="155" font-size="11" fill="#333">altitude 3.0 m &#8226; duration 15 s</text>
  <line x1="666" y1="166" x2="904" y2="166" stroke="#1a7a8a" stroke-width="0.8" opacity="0.5"/>
  <text x="666" y="186" font-size="11" fill="#333">lap time 2&#960;R/v &#8776; 9.4 s</text>
  <text x="666" y="203" font-size="11" fill="#333">&#8776; 1.6 laps per activation</text>
  <text x="666" y="220" font-size="11" fill="#333">centripetal v&#178;/R &#8776; 1.3 m/s&#178;</text>
  <text x="666" y="237" font-size="11" fill="#333">per tick: &#916;&#952; &#8776; 1.9&#176;, a 10 cm arc step</text>
  <text x="666" y="262" font-size="10" font-style="italic" fill="#555">SITL-scale defaults &#8212; a default is a claim</text>
  <text x="666" y="276" font-size="10" font-style="italic" fill="#555">about the environment it was tuned in.</text>

  <!-- sidebar: design band -->
  <rect x="650" y="298" width="270" height="122" rx="8" fill="#fdf6ec" stroke="#b26a1a" stroke-width="1.5"/>
  <text x="666" y="322" font-size="12.5" font-weight="bold" fill="#8a4d0f">Design band (field scale)</text>
  <text x="666" y="344" font-size="11" fill="#333">radius 8&#8211;15 m &#8226; speed 2&#8211;4 m/s</text>
  <text x="666" y="361" font-size="11" fill="#333">altitude 5&#8211;10 m</text>
  <text x="666" y="382" font-size="11" fill="#333">at R = 12 m, v = 3 m/s: lap 25 s</text>
  <text x="666" y="404" font-size="10" font-style="italic" fill="#8a4d0f">engineering defaults, not validated</text>

  <!-- figure-8 inset -->
  <rect x="612" y="438" width="330" height="150" rx="8" fill="#f4f8f9" stroke="#888" stroke-width="1.4"/>
  <text x="628" y="462" font-size="12" font-weight="bold" fill="#444">Figure-8: the habituation variant</text>
  <circle cx="712" cy="528" r="38" fill="none" stroke="#1a7a8a" stroke-width="2"/>
  <circle cx="788" cy="528" r="38" fill="none" stroke="#1a7a8a" stroke-width="2"/>
  <circle cx="750" cy="528" r="3.5" fill="#8a4d0f"/>
  <ellipse cx="738" cy="520" rx="8" ry="5" fill="#b26a1a"/>
  <ellipse cx="760" cy="534" rx="8" ry="5" fill="#b26a1a"/>
  <path d="M 692 494 A 38 38 0 0 0 678 522" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#opGrey)"/>
  <path d="M 810 560 A 38 38 0 0 0 822 532" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#opGrey)"/>
  <text x="842" y="500" font-size="10" font-style="italic" fill="#555">two mirrored orbits</text>
  <text x="842" y="514" font-size="10" font-style="italic" fill="#555">joined at a crossover;</text>
  <text x="842" y="528" font-size="10" font-style="italic" fill="#555">direction and bearing</text>
  <text x="842" y="542" font-size="10" font-style="italic" fill="#555">of approach alternate</text>
  <text x="842" y="556" font-size="10" font-style="italic" fill="#555">every lap</text>

  <text x="480" y="626" font-size="11" font-style="italic" fill="#555" text-anchor="middle">The orbit is the one pattern that ships in code: moderate, continuous, target-facing &#8212; never closing, never overhead.</text>
</svg>
