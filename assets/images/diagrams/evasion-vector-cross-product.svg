<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">
  <defs>
    <marker id="evTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
    <marker id="evAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b26a1a"/>
    </marker>
    <marker id="evBold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b26a1a"/>
    </marker>
    <marker id="evGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <text x="480" y="28" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Two cross products build the escape</text>
  <text x="480" y="50" font-size="13" fill="#555" text-anchor="middle">Relative frame, drawn in N&#8211;E&#8211;up axes for legibility (up = &#8722;D in NED). The tinted plane is the encounter altitude, 10 m up.</text>

  <!-- encounter plane (U = 0) -->
  <polygon points="200,368 551,271 666,386 315,484" fill="#eef4f5" stroke="#c5d8dc" stroke-width="1.3"/>
  <text x="500" y="452" font-size="10" fill="#7a9aa1" font-style="italic" text-anchor="middle" transform="rotate(-16 500 452)">encounter altitude (D = &#8722;10)</text>

  <!-- threat's relative track: goose -> CPA -> beyond (in the plane) -->
  <line x1="579" y1="368" x2="363" y2="428" stroke="#b26a1a" stroke-width="2.4" stroke-dasharray="9 6"/>
  <line x1="363" y1="428" x2="309" y2="443" stroke="#b26a1a" stroke-width="1.8" stroke-dasharray="4 5"/>
  <line x1="490" y1="393" x2="455" y2="403" stroke="#b26a1a" stroke-width="2.4" marker-end="url(#evAmber)"/>
  <text x="492" y="419" font-size="11" font-weight="bold" fill="#8a4d0f" text-anchor="middle" transform="rotate(15 492 419)">v&#8202;<tspan font-size="9" dy="2">rel</tspan><tspan dy="-2"> = (&#8722;4, 0, 0)</tspan></text>

  <!-- line of sight r -->
  <line x1="330" y1="395" x2="568" y2="369" stroke="#666" stroke-width="1.8" stroke-dasharray="2 3" marker-end="url(#evGrey)"/>
  <text x="452" y="371" font-size="10.5" font-weight="bold" fill="#555" text-anchor="middle" transform="rotate(-6 452 371)">line of sight r = (8, 2, 0)</text>

  <!-- miss vector + CPA -->
  <line x1="336" y1="401" x2="355" y2="420" stroke="#b26a1a" stroke-width="2.6"/>
  <circle cx="363" cy="428" r="5" fill="#fff" stroke="#b26a1a" stroke-width="2.2"/>
  <text x="352" y="458" font-size="10.5" font-weight="bold" fill="#8a4d0f" text-anchor="end">CPA: miss m = (0, 2, 0) &#8212;</text>
  <text x="352" y="472" font-size="10.5" font-weight="bold" fill="#8a4d0f" text-anchor="end">the goose passes 2.0 m east</text>

  <!-- goose -->
  <circle cx="579" cy="368" r="8.5" fill="#b26a1a"/>
  <text x="594" y="360" font-size="11.5" font-weight="bold" fill="#8a4d0f" text-anchor="start">goose (threat)</text>
  <text x="594" y="374" font-size="10" fill="#555" text-anchor="start" font-style="italic">8 m N, 2 m E, co-altitude</text>

  <!-- parallelogram helper lines: u1 tip -> e tip, u2 tip -> e tip -->
  <line x1="330" y1="335" x2="297" y2="302" stroke="#9bb8be" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="297" y1="362" x2="297" y2="302" stroke="#9bb8be" stroke-width="1.3" stroke-dasharray="4 4"/>

  <!-- u1: straight up -->
  <line x1="330" y1="383" x2="330" y2="335" stroke="#1a7a8a" stroke-width="3" marker-end="url(#evTeal)"/>
  <text x="342" y="322" font-size="11.5" font-weight="bold" fill="#1a4a5a" text-anchor="start">u<tspan font-size="75%" baseline-shift="sub">1</tspan> = v&#8202;<tspan font-size="9" dy="2">rel</tspan><tspan dy="-2"> &#215; r = (0, 0, &#8722;8): straight up</tspan></text>
  <text x="342" y="337" font-size="10" fill="#1a4a5a" text-anchor="start" font-style="italic">&#8869; the track and the line of sight; NED sign</text>
  <text x="342" y="351" font-size="10" fill="#1a4a5a" text-anchor="start" font-style="italic">check: &#8722;D means up &#8212; keep it, never dive</text>

  <!-- u2: due west, away from the miss -->
  <line x1="322" y1="387" x2="297" y2="362" stroke="#1a7a8a" stroke-width="3" marker-end="url(#evTeal)"/>
  <text x="285" y="352" font-size="11.5" font-weight="bold" fill="#1a4a5a" text-anchor="end">u<tspan font-size="75%" baseline-shift="sub">2</tspan> = v&#8202;<tspan font-size="9" dy="2">rel</tspan><tspan dy="-2"> &#215; u&#770;<tspan font-size="75%" baseline-shift="sub">1</tspan> &#8733; &#8722;m</tspan></text>
  <text x="285" y="366" font-size="10" fill="#1a4a5a" text-anchor="end" font-style="italic">due west: away from</text>
  <text x="285" y="380" font-size="10" fill="#1a4a5a" text-anchor="end" font-style="italic">the passing side</text>

  <!-- evasion vector e: the diagonal of the u1-u2 parallelogram -->
  <line x1="330" y1="395" x2="299" y2="306" stroke="#b26a1a" stroke-width="4" marker-end="url(#evBold)"/>
  <text x="277" y="285" font-size="12.5" font-weight="bold" fill="#8a4d0f" text-anchor="end">evasion vector e&#770; &#8733; u&#770;<tspan font-size="75%" baseline-shift="sub">1</tspan> + u&#770;<tspan font-size="75%" baseline-shift="sub">2</tspan></text>
  <text x="277" y="300" font-size="10.5" fill="#8a4d0f" text-anchor="end">v&#8202;<tspan font-size="9" dy="2">cmd</tspan><tspan dy="-2"> = 5&#8202;e&#770; = (0, &#8722;3.54, &#8722;3.54) m/s</tspan></text>
  <text x="277" y="314" font-size="10" fill="#8a4d0f" text-anchor="end" font-style="italic">climb west at 45&#176;, &#8869; the threat's track</text>

  <!-- escape trajectory continuation -->
  <path d="M 299 306 C 291 282 282 256 273 232" fill="none" stroke="#b26a1a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#evAmber)"/>
  <text x="284" y="228" font-size="10.5" fill="#8a4d0f" font-style="italic" text-anchor="start">escape trajectory &#8594; safe altitude (D = &#8722;15)</text>

  <!-- drone -->
  <circle cx="330" cy="395" r="9" fill="#1a7a8a"/>
  <text x="318" y="416" font-size="12" font-weight="bold" fill="#1a4a5a" text-anchor="end">drone (pinned at origin)</text>

  <!-- axis triad -->
  <line x1="100" y1="540" x2="143" y2="528" stroke="#444" stroke-width="2" marker-end="url(#evGrey)"/>
  <text x="153" y="528" font-size="11.5" font-weight="bold" fill="#444">N</text>
  <line x1="100" y1="540" x2="131" y2="571" stroke="#444" stroke-width="2" marker-end="url(#evGrey)"/>
  <text x="138" y="582" font-size="11.5" font-weight="bold" fill="#444">E</text>
  <line x1="100" y1="540" x2="100" y2="495" stroke="#444" stroke-width="2" marker-end="url(#evGrey)"/>
  <text x="100" y="487" font-size="11.5" font-weight="bold" fill="#444" text-anchor="middle">up (&#8722;D)</text>

  <!-- verification sidebar -->
  <rect x="646" y="86" width="292" height="196" rx="8" fill="#f4f8f9" stroke="#c5d8dc" stroke-width="1.5"/>
  <text x="792" y="110" font-size="13" font-weight="bold" fill="#1a4a5a" text-anchor="middle">Verify: recompute the CPA</text>
  <text x="662" y="134" font-size="11.5" fill="#333">v&#8202;<tspan font-size="9.5" dy="2">rel</tspan><tspan dy="-2">&#8202;&#8242; = v&#8202;</tspan><tspan font-size="9.5" dy="2">t</tspan><tspan dy="-2"> &#8722; v&#8202;</tspan><tspan font-size="9.5" dy="2">cmd</tspan><tspan dy="-2"> = (&#8722;3, 3.54, 3.54)</tspan></text>
  <text x="662" y="156" font-size="11.5" fill="#333">t*&#8202;&#8242; = 16.93 / 34.0 = 0.498 s</text>
  <text x="662" y="178" font-size="11.5" fill="#333">m&#8202;&#8242; = (6.51, 3.76, 1.76)</text>
  <text x="662" y="204" font-size="12" font-weight="bold" fill="#1a4a5a">miss: 2.0 m &#8594; 7.72 m &gt; R&#8202;<tspan font-size="9.5" dy="2">safe</tspan><tspan dy="-2"> = 3 m</tspan></text>
  <text x="662" y="228" font-size="10.5" fill="#555" font-style="italic">The D-component of m&#8202;&#8242; is +1.76 m:</text>
  <text x="662" y="243" font-size="10.5" fill="#555" font-style="italic">the goose now passes 1.76 m below</text>
  <text x="662" y="258" font-size="10.5" fill="#555" font-style="italic">the climbing drone.</text>
  <text x="662" y="273" font-size="10" fill="#7a7a7a" font-style="italic">(assumes the command takes effect instantly)</text>

  <!-- code checks note -->
  <rect x="646" y="398" width="292" height="164" rx="8" fill="#ffffff" stroke="#ddd" stroke-width="1.2"/>
  <text x="792" y="420" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Three checks the code must make</text>
  <text x="662" y="442" font-size="10.5" fill="#333"><tspan font-weight="bold">u<tspan font-size="75%" baseline-shift="sub">1</tspan> sign:</tspan> u<tspan font-size="75%" baseline-shift="sub">1</tspan> and &#8722;u<tspan font-size="75%" baseline-shift="sub">1</tspan> are equally perpendicular;</text>
  <text x="662" y="456" font-size="10.5" fill="#333">if u<tspan font-size="75%" baseline-shift="sub">1</tspan> points at the ground (+D), negate it &#8212;</text>
  <text x="662" y="470" font-size="10.5" fill="#333">climb, never dive.</text>
  <text x="662" y="490" font-size="10.5" fill="#333"><tspan font-weight="bold">u<tspan font-size="75%" baseline-shift="sub">2</tspan> sign:</tspan> negating u<tspan font-size="75%" baseline-shift="sub">1</tspan> negates v&#8202;<tspan font-size="8.5" dy="2">rel</tspan><tspan dy="-2"> &#215; u&#770;<tspan font-size="75%" baseline-shift="sub">1</tspan> too, so</tspan></text>
  <text x="662" y="504" font-size="10.5" fill="#333">pin it against the miss: flip if u<tspan font-size="75%" baseline-shift="sub">2</tspan> &#183; m &gt; 0.</text>
  <text x="662" y="524" font-size="10.5" fill="#333"><tspan font-weight="bold">Degeneracy:</tspan> dead-ahead, v&#8202;<tspan font-size="8.5" dy="2">rel</tspan><tspan dy="-2"> &#8741; r makes u<tspan font-size="75%" baseline-shift="sub">1</tspan> = 0;</tspan></text>
  <text x="662" y="538" font-size="10.5" fill="#333">fall back to v&#8202;<tspan font-size="8.5" dy="2">rel</tspan><tspan dy="-2"> &#215; d&#770; (a horizontal sidestep).</tspan></text>

  <!-- footer -->
  <text x="480" y="602" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">The identity v&#8202;<tspan font-size="9.5" dy="2">rel</tspan><tspan dy="-2"> &#215; (v&#8202;</tspan><tspan font-size="9.5" dy="2">rel</tspan><tspan dy="-2"> &#215; r) = &#8722;&#8214;v&#8202;</tspan><tspan font-size="9.5" dy="2">rel</tspan><tspan dy="-2">&#8214;&#178;&#8202;m means u<tspan font-size="75%" baseline-shift="sub">2</tspan> always points away from the predicted miss &#8212; the construction finds the matador's side with no case analysis.</tspan></text>
</svg>
