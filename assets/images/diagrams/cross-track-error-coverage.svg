<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ctArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
    <marker id="ctAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b26a1a"/>
    </marker>
    <marker id="ctDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="570" fill="#ffffff"/>

  <text x="480" y="28" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Cross-track error, and how it eats the coverage margin</text>
  <text x="480" y="50" font-size="13" fill="#555" text-anchor="middle">Left: the error is the perpendicular distance from the vehicle to its planned leg. Right: opposing drifts on adjacent legs open a gap.</text>

  <!-- ===== LEFT PANEL: definition ===== -->
  <text x="215" y="86" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Definition, one leg</text>

  <!-- planned leg A -> B -->
  <line x1="180" y1="470" x2="180" y2="120" stroke="#888" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="180" cy="470" r="8" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="160" y="475" font-size="11.5" font-weight="bold" fill="#444" text-anchor="end">A (waypoint i)</text>
  <circle cx="180" cy="120" r="8" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="160" y="125" font-size="11.5" font-weight="bold" fill="#444" text-anchor="end">B (waypoint i+1)</text>
  <text x="172" y="300" font-size="11" fill="#555" text-anchor="middle" font-style="italic" transform="rotate(-90 172 300)">planned leg, unit tangent t&#770;</text>

  <!-- actual flown path: bowed to the right by wind -->
  <path d="M 180 470 C 215 420 250 380 252 300 C 253 240 220 170 186 122" fill="none" stroke="#1a7a8a" stroke-width="2.8" marker-end="url(#ctArrow)"/>
  <text x="285" y="395" font-size="11" fill="#1a4a5a" font-style="italic" text-anchor="start">actual flown path p(t)</text>

  <!-- wind arrow -->
  <line x1="60" y1="290" x2="115" y2="290" stroke="#b26a1a" stroke-width="2.4" marker-end="url(#ctAmber)"/>
  <text x="87" y="278" font-size="11.5" font-weight="bold" fill="#8a4d0f" text-anchor="middle">wind</text>

  <!-- e_ct arrow at the widest point -->
  <line x1="180" y1="300" x2="250" y2="300" stroke="#b26a1a" stroke-width="2" marker-start="url(#ctAmber)" marker-end="url(#ctAmber)"/>
  <circle cx="252" cy="300" r="5" fill="#1a7a8a"/>
  <text x="262" y="288" font-size="11.5" font-weight="bold" fill="#8a4d0f" text-anchor="start">e<tspan font-size="9" dy="3">ct</tspan><tspan dy="-3"> = (p &#8722; A) &#183; n&#770;</tspan></text>
  <text x="262" y="304" font-size="10.5" fill="#555" text-anchor="start" font-style="italic">perpendicular distance from the</text>
  <text x="262" y="318" font-size="10.5" fill="#555" text-anchor="start" font-style="italic">vehicle to the leg line; n&#770; &#8869; t&#770;</text>

  <text x="215" y="512" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">The along-track coordinate says how far down the leg the vehicle is;</text>
  <text x="215" y="527" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">the cross-track coordinate says how far it has strayed off the line.</text>

  <!-- panel divider -->
  <line x1="450" y1="80" x2="450" y2="530" stroke="#ddd" stroke-width="1.5"/>

  <!-- ===== RIGHT PANEL: coverage gap ===== -->
  <text x="705" y="86" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Consequence, adjacent legs</text>

  <!-- actual swath bands (drifted apart): leg i drifted west, leg i+1 drifted east -->
  <rect x="490" y="120" width="180" height="330" fill="#e3f1f3"/>
  <rect x="710" y="120" width="180" height="330" fill="#e3f1f3"/>
  <!-- the gap between 670 and 710 -->
  <rect x="670" y="120" width="40" height="330" fill="#fdf3e7"/>
  <line x1="670" y1="120" x2="670" y2="450" stroke="#b26a1a" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="710" y1="120" x2="710" y2="450" stroke="#b26a1a" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="690" y="270" font-size="11.5" font-weight="bold" fill="#8a4d0f" text-anchor="middle" transform="rotate(-90 690 270)">coverage gap &#8212; never seen</text>

  <!-- planned leg centerlines -->
  <line x1="620" y1="120" x2="620" y2="450" stroke="#888" stroke-width="1.8" stroke-dasharray="8 6"/>
  <line x1="760" y1="120" x2="760" y2="450" stroke="#888" stroke-width="1.8" stroke-dasharray="8 6"/>
  <text x="620" y="112" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">planned leg i</text>
  <text x="760" y="112" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">planned leg i+1</text>

  <!-- actual flown centerlines -->
  <line x1="580" y1="450" x2="580" y2="130" stroke="#1a7a8a" stroke-width="2.6" marker-end="url(#ctArrow)"/>
  <line x1="800" y1="130" x2="800" y2="450" stroke="#1a7a8a" stroke-width="2.6" marker-end="url(#ctArrow)"/>

  <!-- drift dimensions -->
  <line x1="580" y1="165" x2="620" y2="165" stroke="#666" stroke-width="1.3" marker-start="url(#ctDim)" marker-end="url(#ctDim)"/>
  <text x="600" y="155" font-size="10.5" fill="#666" text-anchor="middle" font-style="italic">e&#7522;</text>
  <line x1="760" y1="165" x2="800" y2="165" stroke="#666" stroke-width="1.3" marker-start="url(#ctDim)" marker-end="url(#ctDim)"/>
  <text x="780" y="155" font-size="10.5" fill="#666" text-anchor="middle" font-style="italic">e&#7522;&#8330;&#8321;</text>

  <!-- spacing dimension between planned legs -->
  <line x1="620" y1="475" x2="760" y2="475" stroke="#666" stroke-width="1.4" marker-start="url(#ctDim)" marker-end="url(#ctDim)"/>
  <text x="690" y="492" font-size="11" fill="#666" text-anchor="middle" font-style="italic">planned spacing s = 6.6 m; each swath is w = 11 m wide</text>

  <text x="705" y="516" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">A gap opens when the drifts oppose by more than the overlap: e&#7522;&#8330;&#8321; &#8722; e&#7522; &gt; w &#8722; s = 4.4 m.</text>
  <text x="705" y="531" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">Worst case splits the budget evenly: each leg may stray at most (w &#8722; s)/2 = 2.2 m.</text>

  <!-- footer -->
  <text x="480" y="556" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">Minimizing cross-track error is not aesthetics: the coverage guarantee is only as strong as the tracking that flies the legs where the arithmetic put them.</text>
</svg>
