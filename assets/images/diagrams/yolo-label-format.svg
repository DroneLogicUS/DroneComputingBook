<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ylfArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 8 4.5 L 0 9 z" fill="#8a5210"/>
    </marker>
  </defs>

  <text x="450" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">One labeled image in YOLO format: a picture, and a text file that shares its name</text>

  <!-- ======== left: the image ======== -->
  <text x="200" y="66" font-size="13.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">field_0142.jpg &#8212; 640 &#215; 480 pixels</text>
  <!-- frame -->
  <rect x="40" y="80" width="320" height="240" fill="#dcebf2" stroke="#1a4a5a" stroke-width="2"/>
  <rect x="41" y="230" width="318" height="89" fill="#eef6f0"/>
  <!-- goose silhouette centred at canvas (240,180) -->
  <g fill="#4a4a4a">
    <ellipse cx="238" cy="184" rx="22" ry="10"/>
    <path d="M 253 180 C 259 173, 260 165, 257 157" stroke="#4a4a4a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="257" cy="154" r="4"/>
    <path d="M 261 152 L 268 154 L 261 157 z"/>
    <path d="M 216 182 L 205 177 L 214 187 z"/>
  </g>
  <!-- bounding box: image (344,144)-(456,216) => canvas (212,162)-(268,198) -->
  <rect x="212" y="162" width="56" height="36" fill="none" stroke="#8a5210" stroke-width="2.5"/>
  <circle cx="240" cy="180" r="3" fill="#822"/>
  <!-- axes -->
  <text x="44" y="76" font-size="11" fill="#555">(0, 0)</text>
  <text x="358" y="334" font-size="11" fill="#555" text-anchor="end">(639, 479)</text>
  <!-- measurements -->
  <g stroke="#8a5210" stroke-width="1.2" fill="none">
    <line x1="240" y1="180" x2="240" y2="345" stroke-dasharray="3 3"/>
    <line x1="240" y1="180" x2="42" y2="180" stroke-dasharray="3 3"/>
    <line x1="212" y1="205" x2="268" y2="205"/>
    <line x1="277" y1="162" x2="277" y2="198"/>
  </g>
  <text x="240" y="358" font-size="11.5" fill="#8a5210" text-anchor="middle">centre u = 400 px</text>
  <text x="58" y="172" font-size="11.5" fill="#8a5210">v = 180 px</text>
  <text x="240" y="218" font-size="11.5" fill="#8a5210" text-anchor="middle">w = 112 px</text>
  <text x="283" y="184" font-size="11.5" fill="#8a5210">h = 72 px</text>

  <!-- ======== right: the label file ======== -->
  <text x="640" y="66" font-size="13.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">field_0142.txt &#8212; one line per object</text>
  <rect x="440" y="80" width="400" height="72" rx="6" fill="#2b2b2b"/>
  <text x="460" y="112" font-size="15" fill="#e8e8e8" font-family="Menlo, Consolas, monospace">0 0.625 0.375 0.175 0.150</text>
  <text x="460" y="136" font-size="12" fill="#8a8a8a" font-family="Menlo, Consolas, monospace"># class  x_c    y_c    w      h</text>

  <!-- field callouts -->
  <g font-size="12" fill="#222">
    <line x1="468" y1="118" x2="468" y2="170" stroke="#8a5210" stroke-width="1.2" marker-end="url(#ylfArrow)"/>
    <text x="468" y="188" text-anchor="middle" font-weight="bold">class id</text>
    <text x="468" y="204" text-anchor="middle" font-size="11">0 = goose</text>
    <text x="468" y="218" text-anchor="middle" font-size="11">1 = other_bird</text>

    <line x1="558" y1="118" x2="548" y2="170" stroke="#8a5210" stroke-width="1.2" marker-end="url(#ylfArrow)"/>
    <text x="548" y="188" text-anchor="middle" font-weight="bold">x_c = 400 / 640</text>
    <text x="548" y="204" text-anchor="middle" font-size="11">centre column,</text>
    <text x="548" y="218" text-anchor="middle" font-size="11">divided by width</text>

    <line x1="640" y1="118" x2="648" y2="170" stroke="#8a5210" stroke-width="1.2" marker-end="url(#ylfArrow)"/>
    <text x="648" y="188" text-anchor="middle" font-weight="bold">y_c = 180 / 480</text>
    <text x="648" y="204" text-anchor="middle" font-size="11">centre row,</text>
    <text x="648" y="218" text-anchor="middle" font-size="11">divided by height</text>

    <line x1="722" y1="118" x2="738" y2="170" stroke="#8a5210" stroke-width="1.2" marker-end="url(#ylfArrow)"/>
    <text x="738" y="188" text-anchor="middle" font-weight="bold">w = 112 / 640</text>
    <text x="738" y="204" text-anchor="middle" font-size="11">box width,</text>
    <text x="738" y="218" text-anchor="middle" font-size="11">divided by width</text>

    <line x1="800" y1="118" x2="822" y2="170" stroke="#8a5210" stroke-width="1.2" marker-end="url(#ylfArrow)"/>
    <text x="822" y="188" text-anchor="middle" font-weight="bold">h = 72 / 480</text>
    <text x="822" y="204" text-anchor="middle" font-size="11">box height,</text>
    <text x="822" y="218" text-anchor="middle" font-size="11">divided by height</text>
  </g>

  <text x="640" y="248" font-size="12" fill="#2f5a3a" font-style="italic" text-anchor="middle">all four numbers live in [0, 1] &#8212; the label survives any resize,</text>
  <text x="640" y="264" font-size="12" fill="#2f5a3a" font-style="italic" text-anchor="middle">because it is stored as a fraction of the frame, not in pixels</text>

  <!-- directory layout -->
  <rect x="440" y="284" width="400" height="92" rx="6" fill="#f2f6f8" stroke="#1a7a8a" stroke-width="1.5"/>
  <text x="460" y="306" font-size="12" font-weight="bold" fill="#1a4a5a">The dataset on disk</text>
  <text x="456" y="326" font-size="10.5" fill="#222" font-family="Menlo, Consolas, monospace">images/train/field_0142.jpg   labels/train/field_0142.txt</text>
  <text x="456" y="344" font-size="10.5" fill="#222" font-family="Menlo, Consolas, monospace">images/val/...                labels/val/...</text>
  <text x="456" y="362" font-size="10.5" fill="#222" font-family="Menlo, Consolas, monospace">data.yaml  (paths + class names, goose=0, other_bird=1)</text>

  <!-- footer -->
  <rect x="30" y="392" width="840" height="46" rx="6" fill="#fdf3e6" stroke="#8a5210" stroke-width="1"/>
  <text x="450" y="411" font-size="12.5" fill="#222" text-anchor="middle"><tspan font-weight="bold">The label is the lesson:</tspan> an image with no goose gets an empty (or absent) label file &#8212; that too is information the model learns from.</text>
  <text x="450" y="429" font-size="12.5" fill="#222" text-anchor="middle">A frame with two geese gets two lines. A wrong or sloppy line is a wrong lesson, taught with full confidence, every epoch.</text>
</svg>
