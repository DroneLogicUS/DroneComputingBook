<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>

  <text x="450" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">From a ranked list of detections to average precision (AP) &#8212; the same 5-goose validation set</text>

  <!-- ===== left: ranked table ===== -->
  <text x="230" y="64" font-size="13.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">Sweep the confidence threshold down the ranking</text>

  <!-- table: x 40..420, header row at y 76, rows 26 tall -->
  <g font-size="12" font-family="Menlo, Consolas, monospace">
    <rect x="40" y="76" width="380" height="26" fill="#1a4a5a"/>
    <text x="60" y="94" fill="#fff">#</text>
    <text x="95" y="94" fill="#fff">conf</text>
    <text x="155" y="94" fill="#fff">verdict</text>
    <text x="240" y="94" fill="#fff">&#931;TP</text>
    <text x="295" y="94" fill="#fff">prec</text>
    <text x="355" y="94" fill="#fff">recall</text>

    <g fill="#222">
      <rect x="40" y="102" width="380" height="26" fill="#f2f6f8"/>
      <text x="60" y="120">1</text><text x="95" y="120">0.95</text><text x="155" y="120" fill="#2f5a3a">TP</text><text x="240" y="120">1</text><text x="295" y="120">1.00</text><text x="355" y="120">0.20</text>
      <rect x="40" y="128" width="380" height="26" fill="#ffffff"/>
      <text x="60" y="146">2</text><text x="95" y="146">0.91</text><text x="155" y="146" fill="#2f5a3a">TP</text><text x="240" y="146">2</text><text x="295" y="146">1.00</text><text x="355" y="146">0.40</text>
      <rect x="40" y="154" width="380" height="26" fill="#fdf0ee"/>
      <text x="60" y="172">3</text><text x="95" y="172">0.83</text><text x="155" y="172" fill="#822">FP</text><text x="240" y="172">2</text><text x="295" y="172">0.67</text><text x="355" y="172">0.40</text>
      <rect x="40" y="180" width="380" height="26" fill="#ffffff"/>
      <text x="60" y="198">4</text><text x="95" y="198">0.78</text><text x="155" y="198" fill="#2f5a3a">TP</text><text x="240" y="198">3</text><text x="295" y="198">0.75</text><text x="355" y="198">0.60</text>
      <rect x="40" y="206" width="380" height="26" fill="#fdf0ee"/>
      <text x="60" y="224">5</text><text x="95" y="224">0.66</text><text x="155" y="224" fill="#822">FP</text><text x="240" y="224">3</text><text x="295" y="224">0.60</text><text x="355" y="224">0.60</text>
      <rect x="40" y="232" width="380" height="26" fill="#ffffff"/>
      <text x="60" y="250">6</text><text x="95" y="250">0.54</text><text x="155" y="250" fill="#2f5a3a">TP</text><text x="240" y="250">4</text><text x="295" y="250">0.67</text><text x="355" y="250">0.80</text>
      <rect x="40" y="258" width="380" height="26" fill="#fdf0ee"/>
      <text x="60" y="276">7</text><text x="95" y="276">0.42</text><text x="155" y="276" fill="#822">FP</text><text x="240" y="276">4</text><text x="295" y="276">0.57</text><text x="355" y="276">0.80</text>
    </g>
  </g>
  <text x="40" y="304" font-size="11.5" fill="#555">verdicts use IoU &#8805; 0.5 against the 5 labeled geese;</text>
  <text x="40" y="319" font-size="11.5" fill="#555">the 5th goose is never detected, so recall never reaches 1.0</text>
  <text x="40" y="343" font-size="11.5" fill="#8a5210" font-style="italic">each row = one operating point: precision = &#931;TP / rows so far,</text>
  <text x="40" y="358" font-size="11.5" fill="#8a5210" font-style="italic">recall = &#931;TP / 5 geese &#8212; plotted as one dot on the right</text>

  <!-- ===== right: PR curve ===== -->
  <text x="670" y="64" font-size="13.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">Precision&#8211;recall curve; AP is the area under it</text>

  <!-- axes: x 500..840 (R 0..1), y 340..120 (P 0..1) -->
  <!-- shaded AP area under envelope -->
  <path d="M 500 340 L 500 120 L 636 120 L 636 175 L 704 175 L 704 193 L 772 193 L 772 340 Z" fill="#f6e3c5"/>
  <!-- envelope -->
  <path d="M 500 120 L 636 120 L 636 175 L 704 175 L 704 193 L 772 193 L 772 340" fill="none" stroke="#8a5210" stroke-width="2.5"/>
  <!-- raw zigzag -->
  <path d="M 568 120 L 636 120 L 636 193 L 704 175 L 704 208 L 772 193 L 772 214" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <g fill="#1a4a5a">
    <circle cx="568" cy="120" r="3.5"/><circle cx="636" cy="120" r="3.5"/><circle cx="636" cy="193" r="3.5"/>
    <circle cx="704" cy="175" r="3.5"/><circle cx="704" cy="208" r="3.5"/><circle cx="772" cy="193" r="3.5"/><circle cx="772" cy="214" r="3.5"/>
  </g>
  <!-- axes lines -->
  <line x1="500" y1="340" x2="850" y2="340" stroke="#222" stroke-width="1.5"/>
  <line x1="500" y1="340" x2="500" y2="105" stroke="#222" stroke-width="1.5"/>
  <g font-size="10.5" fill="#555" text-anchor="middle">
    <text x="500" y="355">0</text><text x="568" y="355">0.2</text><text x="636" y="355">0.4</text><text x="704" y="355">0.6</text><text x="772" y="355">0.8</text><text x="840" y="355">1.0</text>
  </g>
  <g font-size="10.5" fill="#555" text-anchor="end">
    <text x="494" y="344">0</text><text x="494" y="234">0.5</text><text x="494" y="124">1.0</text>
  </g>
  <text x="675" y="374" font-size="12" fill="#222" text-anchor="middle">recall</text>
  <text x="466" y="230" font-size="12" fill="#222" text-anchor="middle" transform="rotate(-90 466 230)">precision</text>
  <text x="618" y="270" font-size="13" font-weight="bold" fill="#6a4a10" text-anchor="middle">AP@0.5 &#8776; 0.68</text>
  <text x="618" y="288" font-size="10.5" fill="#6a4a10" text-anchor="middle">0.4&#215;1.0 + 0.2&#215;0.75</text>
  <text x="618" y="302" font-size="10.5" fill="#6a4a10" text-anchor="middle">+ 0.2&#215;0.67 = 0.683</text>
  <text x="846" y="150" font-size="10.5" fill="#8a5210" text-anchor="end">envelope: best precision</text>
  <text x="846" y="164" font-size="10.5" fill="#8a5210" text-anchor="end">at each recall or beyond</text>

  <!-- footer -->
  <rect x="30" y="392" width="840" height="92" rx="6" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="1"/>
  <text x="450" y="414" font-size="12.5" fill="#222" text-anchor="middle"><tspan font-weight="bold">AP</tspan> summarizes one class across every confidence threshold: here, AP for goose at IoU 0.5 is 0.68.</text>
  <text x="450" y="434" font-size="12.5" fill="#222" text-anchor="middle"><tspan font-weight="bold">mAP</tspan> averages AP over classes: goose 0.68, other_bird 0.52 &#8594; mAP@0.5 = (0.68 + 0.52) / 2 = 0.60.</text>
  <text x="450" y="454" font-size="12.5" fill="#222" text-anchor="middle"><tspan font-weight="bold">mAP@0.5:0.95</tspan> repeats the whole computation at IoU thresholds 0.5, 0.55, &#8230; 0.95 and averages &#8212; it rewards tight boxes, not just found ones,</text>
  <text x="450" y="472" font-size="12.5" fill="#222" text-anchor="middle">which is why it is always the lower of the two numbers a trainer reports.</text>
</svg>
