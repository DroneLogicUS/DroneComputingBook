<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">
  <defs>
    <marker id="ecTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
    <marker id="ecAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b26a1a"/>
    </marker>
    <marker id="ecRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a03333"/>
    </marker>
    <marker id="ecGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <text x="480" y="28" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">The danger cylinder: why perpendicular &#8212; and which perpendicular</text>
  <text x="480" y="50" font-size="13" fill="#555" text-anchor="middle">Relative frame: the drone is pinned at the origin; the threat's track, inflated by the safety radius, is a tube the drone must exit in time.</text>

  <!-- ===== LEFT PANEL: side view of the cylinder ===== -->
  <text x="245" y="88" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Side view: exit the tube, don't race it</text>

  <!-- tube -->
  <rect x="60" y="215" width="370" height="150" fill="#fdf3e7" fill-opacity="0.75"/>
  <line x1="60" y1="215" x2="430" y2="215" stroke="#b26a1a" stroke-width="1.8" stroke-dasharray="7 5"/>
  <line x1="60" y1="365" x2="430" y2="365" stroke="#b26a1a" stroke-width="1.8" stroke-dasharray="7 5"/>
  <ellipse cx="430" cy="290" rx="22" ry="75" fill="#fdf3e7" stroke="#b26a1a" stroke-width="1.8" stroke-dasharray="7 5"/>
  <!-- axis -->
  <line x1="60" y1="290" x2="430" y2="290" stroke="#8a4d0f" stroke-width="1.4" stroke-dasharray="3 4"/>
  <text x="330" y="308" font-size="10.5" fill="#8a4d0f" font-style="italic">threat's relative track (the axis)</text>
  <!-- radius dimension -->
  <line x1="415" y1="290" x2="415" y2="215" stroke="#666" stroke-width="1.3" marker-end="url(#ecGrey)"/>
  <text x="404" y="250" font-size="10.5" fill="#666" text-anchor="end" font-style="italic">R&#8202;<tspan font-size="8.5" dy="2">safe</tspan><tspan dy="-2">&#160;= 3 m</tspan></text>

  <!-- threat approaching along the axis -->
  <circle cx="408" cy="290" r="8" fill="#b26a1a"/>
  <line x1="396" y1="290" x2="340" y2="290" stroke="#b26a1a" stroke-width="2.8" marker-end="url(#ecAmber)"/>
  <text x="408" y="272" font-size="11" font-weight="bold" fill="#8a4d0f" text-anchor="middle">v&#8202;<tspan font-size="9" dy="2">rel</tspan></text>

  <!-- drone inside, 2 m off-axis (above) -->
  <circle cx="185" cy="240" r="8" fill="#1a7a8a"/>
  <text x="185" y="262" font-size="11.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">drone</text>
  <text x="185" y="276" font-size="10" fill="#555" text-anchor="middle" font-style="italic">2 m off-axis &#8212; inside the tube</text>

  <!-- retreat arrow: parallel to axis -->
  <line x1="173" y1="240" x2="88" y2="240" stroke="#a03333" stroke-width="2.6" marker-end="url(#ecRed)"/>
  <text x="130" y="225" font-size="11" font-weight="bold" fill="#a03333" text-anchor="middle">retreat</text>
  <text x="245" y="128" font-size="10.5" fill="#a03333" text-anchor="middle" font-style="italic">Parallel to the axis: never exits the tube &#8212; it changes when the threat</text>
  <text x="245" y="142" font-size="10.5" fill="#a03333" text-anchor="middle" font-style="italic">arrives, not where it passes. It wins only if you outrun the closing speed.</text>

  <!-- perpendicular arrow: exits through the wall -->
  <line x1="185" y1="228" x2="185" y2="188" stroke="#1a7a8a" stroke-width="3" marker-end="url(#ecTeal)"/>
  <text x="196" y="200" font-size="11" font-weight="bold" fill="#1a4a5a" text-anchor="start">perpendicular</text>
  <text x="245" y="404" font-size="10.5" fill="#1a4a5a" text-anchor="middle" font-style="italic">Perpendicular to the axis: exits through the nearest wall. The threat's</text>
  <text x="245" y="418" font-size="10.5" fill="#1a4a5a" text-anchor="middle" font-style="italic">velocity has no component in this plane &#8212; a straight-flying</text>
  <text x="245" y="432" font-size="10.5" fill="#1a4a5a" text-anchor="middle" font-style="italic">threat cannot contest the sidestep, however fast it is.</text>

  <!-- panel divider -->
  <line x1="490" y1="76" x2="490" y2="480" stroke="#ddd" stroke-width="1.5"/>

  <!-- ===== RIGHT PANEL: cross-section ===== -->
  <text x="725" y="88" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Cross-section (&#8869; v&#8202;<tspan font-size="10.5" dy="2">rel</tspan><tspan dy="-2">): the exits are not equivalent</tspan></text>

  <!-- circle -->
  <circle cx="720" cy="275" r="90" fill="#fdf3e7" fill-opacity="0.75" stroke="#b26a1a" stroke-width="1.8" stroke-dasharray="7 5"/>
  <!-- center: where the track pierces the plane -->
  <circle cx="720" cy="275" r="6" fill="#b26a1a"/>
  <text x="737" y="243" font-size="10.5" font-weight="bold" fill="#8a4d0f" text-anchor="start">threat's track pierces here</text>
  <text x="737" y="257" font-size="10" fill="#8a4d0f" text-anchor="start" font-style="italic">(2 m east of the drone: the miss m&#770;)</text>

  <!-- drone, 2 m west of center -->
  <circle cx="660" cy="275" r="8" fill="#1a7a8a"/>
  <text x="655" y="300" font-size="11.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">drone</text>

  <!-- exit west: 1 m, boldest -->
  <line x1="650" y1="275" x2="633" y2="275" stroke="#1a7a8a" stroke-width="4" marker-end="url(#ecTeal)"/>
  <text x="612" y="257" font-size="11.5" font-weight="bold" fill="#1a4a5a" text-anchor="end">1.0 m</text>
  <text x="612" y="272" font-size="10.5" fill="#1a4a5a" text-anchor="end" font-style="italic">away from the</text>
  <text x="612" y="286" font-size="10.5" fill="#1a4a5a" text-anchor="end" font-style="italic">passing side (&#8722;m&#770;)</text>
  <text x="612" y="300" font-size="10.5" fill="#1a4a5a" text-anchor="end" font-style="italic">&#8212; the cheapest wall</text>

  <!-- exit up: 2.24 m -->
  <line x1="660" y1="263" x2="660" y2="212" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#ecTeal)"/>
  <text x="660" y="196" font-size="11.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">2.24 m</text>
  <text x="660" y="182" font-size="10.5" fill="#1a4a5a" text-anchor="middle" font-style="italic">straight up: &#8730;(3&#178; &#8722; 2&#178;)</text>

  <!-- exit east through the center: 5 m, losing -->
  <line x1="672" y1="275" x2="805" y2="275" stroke="#a03333" stroke-width="2.4" stroke-dasharray="8 5" marker-end="url(#ecRed)"/>
  <text x="762" y="322" font-size="11.5" font-weight="bold" fill="#a03333" text-anchor="middle">5.0 m</text>
  <text x="762" y="337" font-size="10.5" fill="#a03333" text-anchor="middle" font-style="italic">across the axis &#8212;</text>
  <text x="762" y="351" font-size="10.5" fill="#a03333" text-anchor="middle" font-style="italic">crossing in front of the threat</text>

  <!-- axes -->
  <line x1="545" y1="448" x2="583" y2="448" stroke="#444" stroke-width="2" marker-end="url(#ecGrey)"/>
  <text x="593" y="452" font-size="11.5" font-weight="bold" fill="#444">E</text>
  <line x1="545" y1="448" x2="545" y2="410" stroke="#444" stroke-width="2" marker-end="url(#ecGrey)"/>
  <text x="545" y="402" font-size="11.5" font-weight="bold" fill="#444" text-anchor="middle">up (&#8722;D)</text>
  <text x="745" y="472" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">Drone 2 m from the axis in a 3 m tube: wall distances 3 &#8722; 2 = 1.0 m (away),</text>
  <text x="745" y="487" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">&#8730;(3&#178; &#8722; 2&#178;) &#8776; 2.24 m (up), 3 + 2 = 5.0 m (across). Drawn to scale.</text>

  <!-- footer -->
  <text x="480" y="508" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">The rule decoded: <tspan font-weight="bold">opposite</tspan> if you are faster than the threat (retreat opens range forever); <tspan font-weight="bold">perpendicular</tspan> if you are not &#8212;</text>
  <text x="480" y="524" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">and among the perpendiculars, dodge away from the side the threat will pass on: the matador's move.</text>
</svg>
