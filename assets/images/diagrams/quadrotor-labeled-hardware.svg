<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="qtip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="940" height="590" fill="#ffffff"/>

  <!-- titles -->
  <text x="470" y="40" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Quadrotor hardware layout, viewed from above</text>
  <text x="470" y="62" font-size="13" fill="#555" text-anchor="middle">500 mm-wheelbase development airframe; front of the aircraft toward the top of the page</text>

  <!-- propeller discs (dashed sweep circles), drawn first so everything overlaps them -->
  <circle cx="381.6" cy="251.6" r="63.5" fill="#f2f6f8" stroke="#9aa8ad" stroke-width="1.4" stroke-dasharray="7 6"/>
  <circle cx="558.4" cy="251.6" r="63.5" fill="#f2f6f8" stroke="#9aa8ad" stroke-width="1.4" stroke-dasharray="7 6"/>
  <circle cx="381.6" cy="428.4" r="63.5" fill="#f2f6f8" stroke="#9aa8ad" stroke-width="1.4" stroke-dasharray="7 6"/>
  <circle cx="558.4" cy="428.4" r="63.5" fill="#f2f6f8" stroke="#9aa8ad" stroke-width="1.4" stroke-dasharray="7 6"/>

  <!-- arms -->
  <g stroke="#4a4a4a" stroke-width="15" stroke-linecap="round">
    <line x1="470" y1="340" x2="381.6" y2="251.6"/>
    <line x1="470" y1="340" x2="558.4" y2="251.6"/>
    <line x1="470" y1="340" x2="381.6" y2="428.4"/>
    <line x1="470" y1="340" x2="558.4" y2="428.4"/>
  </g>

  <!-- camera at the nose, with its field of view -->
  <polygon points="470,240 424,190 516,190" fill="#e8b04a" opacity="0.20"/>
  <rect x="445" y="228" width="50" height="24" rx="4" fill="#e8b04a" stroke="#9a6b1f" stroke-width="1.6"/>

  <!-- central body -->
  <rect x="420" y="250" width="100" height="200" rx="8" fill="#eceff1" stroke="#3a3a3a" stroke-width="2"/>

  <!-- stack bands -->
  <rect x="428" y="258" width="84" height="40" rx="4" fill="#7da7d9" stroke="#34567f" stroke-width="1.6"/>
  <text x="470" y="276" font-size="11" font-weight="bold" fill="#10233c" text-anchor="middle">COMPANION</text>
  <text x="470" y="290" font-size="11" font-weight="bold" fill="#10233c" text-anchor="middle">COMPUTER</text>

  <rect x="428" y="306" width="84" height="40" rx="4" fill="#1a7a8a" stroke="#1a4a5a" stroke-width="1.6"/>
  <text x="470" y="324" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">FLIGHT</text>
  <text x="470" y="338" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">CONTROLLER</text>

  <rect x="428" y="354" width="84" height="22" rx="4" fill="#c8ced2" stroke="#5a5a5a" stroke-width="1.4"/>
  <text x="470" y="369" font-size="10.5" fill="#222" text-anchor="middle">4-IN-1 ESC</text>

  <rect x="428" y="384" width="84" height="22" rx="4" fill="#c8ced2" stroke="#5a5a5a" stroke-width="1.4"/>
  <text x="470" y="399" font-size="10.5" fill="#222" text-anchor="middle">RADIOS</text>

  <!-- underslung battery, dashed and wider than the body -->
  <rect x="408" y="414" width="124" height="30" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="470" y="434" font-size="10.5" fill="#222" text-anchor="middle">BATTERY</text>

  <!-- GPS mast at the rear -->
  <line x1="470" y1="450" x2="470" y2="473" stroke="#5a5a5a" stroke-width="4"/>
  <circle cx="470" cy="490" r="17" fill="#e8b04a" stroke="#9a6b1f" stroke-width="1.6"/>
  <text x="470" y="495" font-size="10.5" font-weight="bold" fill="#4a3410" text-anchor="middle">GPS</text>

  <!-- motors (hub circles with rotation sense) -->
  <g stroke="#1a1a1a" stroke-width="2">
    <circle cx="381.6" cy="251.6" r="16" fill="#2f3a3f"/>
    <circle cx="558.4" cy="251.6" r="16" fill="#2f3a3f"/>
    <circle cx="381.6" cy="428.4" r="16" fill="#2f3a3f"/>
    <circle cx="558.4" cy="428.4" r="16" fill="#2f3a3f"/>
  </g>
  <text x="381.6" y="256" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">CW</text>
  <text x="558.4" y="256" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">CCW</text>
  <text x="381.6" y="433" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">CCW</text>
  <text x="558.4" y="433" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">CW</text>

  <!-- adjacent-motor dimension across the front pair -->
  <line x1="381.6" y1="145" x2="558.4" y2="145" stroke="#666" stroke-width="1.4" marker-start="url(#qtip)" marker-end="url(#qtip)"/>
  <line x1="381.6" y1="145" x2="381.6" y2="184" stroke="#aaa" stroke-width="1"/>
  <line x1="558.4" y1="145" x2="558.4" y2="184" stroke="#aaa" stroke-width="1"/>
  <text x="470" y="133" font-size="12" fill="#333" text-anchor="middle">354 mm between adjacent motors: 10-inch (254 mm) discs, 100 mm tip clearance</text>

  <!-- UART bracket between the two computers -->
  <path d="M 520 286 H 570 V 326 H 520" fill="none" stroke="#1a7a8a" stroke-width="2.2"
        marker-start="url(#qtip)" marker-end="url(#qtip)"/>
  <text x="578" y="301" font-size="12" font-weight="bold" fill="#1a7a8a">UART link</text>
  <text x="578" y="317" font-size="11.5" fill="#1a7a8a">3 wires, 921 600 baud</text>

  <!-- left-hand labels -->
  <g font-size="13" fill="#222" text-anchor="end">
    <text x="295" y="168">10-inch propeller and</text>
    <text x="295" y="185">brushless motor (x4)</text>
    <text x="295" y="252">Carbon-fibre arm</text>
    <text x="295" y="323">4-in-1 electronic</text>
    <text x="295" y="340">speed controller</text>
    <text x="295" y="398">4S 5200 mAh battery,</text>
    <text x="295" y="415">underslung, via power module</text>
    <text x="295" y="490">GPS receiver and compass,</text>
    <text x="295" y="507">on a mast clear of power wiring</text>
  </g>
  <g stroke="#999" stroke-width="1.1" fill="none">
    <line x1="302" y1="178" x2="368" y2="242"/>
    <line x1="302" y1="248" x2="400" y2="272"/>
    <line x1="302" y1="332" x2="426" y2="363"/>
    <line x1="302" y1="408" x2="406" y2="428"/>
    <line x1="302" y1="498" x2="450" y2="492"/>
  </g>

  <!-- right-hand labels -->
  <g font-size="13" fill="#222">
    <text x="690" y="168">Depth camera,</text>
    <text x="690" y="185">forward-facing</text>
    <text x="690" y="248">Companion computer</text>
    <text x="690" y="265">(Linux, GPU inference)</text>
    <text x="690" y="355">Flight controller</text>
    <text x="690" y="372">(real-time attitude loop)</text>
    <text x="690" y="430">Telemetry radio and</text>
    <text x="690" y="447">RC receiver</text>
  </g>
  <g stroke="#999" stroke-width="1.1" fill="none">
    <line x1="685" y1="176" x2="498" y2="238"/>
    <line x1="685" y1="255" x2="523" y2="270"/>
    <line x1="685" y1="362" x2="523" y2="344"/>
    <line x1="685" y1="437" x2="523" y2="398"/>
  </g>

  <!-- caption -->
  <text x="470" y="560" font-size="13.5" fill="#222" text-anchor="middle" font-style="italic">Two computers on one airframe: the flight controller closes the fast attitude loop, the companion computer runs perception and mission logic.</text>
</svg>
