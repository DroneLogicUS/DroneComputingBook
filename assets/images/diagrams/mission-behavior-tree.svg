<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="660" fill="#ffffff"/>

  <text x="490" y="26" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">The same mission as a Behavior Tree</text>
  <text x="490" y="46" font-size="12.5" fill="#555" text-anchor="middle">Every tick starts at the root; child order is priority &#8212; preemption falls out of the structure instead of being drawn as arrows.</text>

  <!-- edges root -> level 2 -->
  <line x1="480" y1="110" x2="180" y2="150" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="490" y1="110" x2="430" y2="150" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="500" y1="110" x2="726" y2="150" stroke="#8a8a8a" stroke-width="1.6"/>
  <circle cx="322" cy="129" r="9" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="322" y="133" font-size="10" fill="#444" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="458" cy="132" r="9" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="458" y="136" font-size="10" fill="#444" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="618" cy="131" r="9" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="618" y="135" font-size="10" fill="#444" text-anchor="middle" font-weight="bold">3</text>

  <!-- root selector -->
  <rect x="460" y="70" width="60" height="40" rx="6" fill="#fafcfd" stroke="#1a4a5a" stroke-width="2"/>
  <text x="490" y="97" font-size="20" font-weight="bold" fill="#1a4a5a" text-anchor="middle">?</text>
  <text x="532" y="88" font-size="10" fill="#555" text-anchor="start" font-style="italic">root selector,</text>
  <text x="532" y="101" font-size="10" fill="#555" text-anchor="start" font-style="italic">ticked at 20 Hz</text>

  <!-- level 2: three sequences -->
  <text x="180" y="144" font-size="10" fill="#8a4d0f" text-anchor="middle" font-style="italic">priority 1: defend</text>
  <rect x="150" y="150" width="60" height="40" rx="6" fill="#fdf3e7" stroke="#b26a1a" stroke-width="2"/>
  <text x="180" y="176" font-size="17" font-weight="bold" fill="#8a4d0f" text-anchor="middle">&#8594;</text>

  <text x="430" y="144" font-size="10" fill="#555" text-anchor="middle" font-style="italic">priority 2: energy</text>
  <rect x="400" y="150" width="60" height="40" rx="6" fill="#fafcfd" stroke="#1a4a5a" stroke-width="2"/>
  <text x="430" y="176" font-size="17" font-weight="bold" fill="#1a4a5a" text-anchor="middle">&#8594;</text>

  <text x="726" y="144" font-size="10" fill="#555" text-anchor="middle" font-style="italic">priority 3: the mission itself</text>
  <rect x="696" y="150" width="60" height="40" rx="6" fill="#fafcfd" stroke="#1a4a5a" stroke-width="2"/>
  <text x="726" y="176" font-size="17" font-weight="bold" fill="#1a4a5a" text-anchor="middle">&#8594;</text>

  <!-- edges level 2 -> level 3 -->
  <line x1="180" y1="190" x2="90" y2="240" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="180" y1="190" x2="233" y2="238" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="430" y1="190" x2="372" y2="240" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="430" y1="190" x2="502" y2="238" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="726" y1="190" x2="628" y2="238" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="726" y1="190" x2="726" y2="242" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="726" y1="190" x2="852" y2="238" stroke="#8a8a8a" stroke-width="1.6"/>

  <!-- level 3: defend branch -->
  <ellipse cx="88" cy="262" rx="66" ry="22" fill="#ffffff" stroke="#b26a1a" stroke-width="1.8"/>
  <text x="88" y="259" font-size="10" fill="#8a4d0f" text-anchor="middle" font-style="italic">threat closing</text>
  <text x="88" y="272" font-size="10" fill="#8a4d0f" text-anchor="middle" font-style="italic">&#8743; miss &lt; R<tspan font-size="8" dy="2.5">safe</tspan><tspan dy="-2.5"> ?</tspan></text>
  <rect x="172" y="240" width="120" height="44" rx="9" fill="#fdf3e7" stroke="#b26a1a" stroke-width="2"/>
  <text x="232" y="258" font-size="11" font-weight="bold" fill="#8a4d0f" text-anchor="middle">EVADE_THREAT</text>
  <text x="232" y="273" font-size="9" fill="#555" text-anchor="middle" font-style="italic">slew onto escape vector</text>

  <!-- level 3: energy branch -->
  <ellipse cx="372" cy="262" rx="60" ry="22" fill="#ffffff" stroke="#1a4a5a" stroke-width="1.6"/>
  <text x="372" y="259" font-size="10.5" fill="#1a4a5a" text-anchor="middle" font-style="italic">battery at</text>
  <text x="372" y="272" font-size="10.5" fill="#1a4a5a" text-anchor="middle" font-style="italic">reserve ?</text>
  <rect x="442" y="240" width="124" height="44" rx="9" fill="#fafcfd" stroke="#1a7a8a" stroke-width="2"/>
  <text x="504" y="258" font-size="11" font-weight="bold" fill="#1a4a5a" text-anchor="middle">RETURN-TO-HOME</text>
  <text x="504" y="273" font-size="9.5" fill="#555" text-anchor="middle" font-style="italic">climb out, fly home, land</text>

  <!-- level 3: mission branch -->
  <rect x="586" y="240" width="86" height="44" rx="9" fill="#fafcfd" stroke="#1a7a8a" stroke-width="2"/>
  <text x="629" y="258" font-size="11" font-weight="bold" fill="#1a4a5a" text-anchor="middle">TAKE OFF</text>
  <text x="629" y="273" font-size="9.5" fill="#555" text-anchor="middle" font-style="italic">to mission altitude</text>

  <rect x="701" y="246" width="50" height="36" rx="6" fill="#fafcfd" stroke="#1a4a5a" stroke-width="2"/>
  <text x="726" y="270" font-size="16" font-weight="bold" fill="#1a4a5a" text-anchor="middle">?</text>

  <rect x="790" y="240" width="124" height="44" rx="9" fill="#fafcfd" stroke="#1a7a8a" stroke-width="2"/>
  <text x="852" y="258" font-size="11" font-weight="bold" fill="#1a4a5a" text-anchor="middle">LAND / RTH</text>
  <text x="852" y="273" font-size="9.5" fill="#555" text-anchor="middle" font-style="italic">sweep done: go home</text>

  <!-- edges fallback -> level 4 -->
  <line x1="726" y1="282" x2="672" y2="336" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="726" y1="282" x2="822" y2="334" stroke="#8a8a8a" stroke-width="1.6"/>

  <!-- level 4 -->
  <rect x="647" y="338" width="50" height="36" rx="6" fill="#fafcfd" stroke="#1a4a5a" stroke-width="2"/>
  <text x="672" y="362" font-size="16" font-weight="bold" fill="#1a4a5a" text-anchor="middle">&#8594;</text>
  <rect x="748" y="336" width="150" height="44" rx="9" fill="#fafcfd" stroke="#1a7a8a" stroke-width="2"/>
  <text x="823" y="354" font-size="11" font-weight="bold" fill="#1a4a5a" text-anchor="middle">SEARCH_GRID</text>
  <text x="823" y="369" font-size="9.5" fill="#555" text-anchor="middle" font-style="italic">fly lawnmower leg i of N</text>

  <!-- edges level 4 -> level 5 -->
  <line x1="672" y1="374" x2="614" y2="424" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="672" y1="374" x2="742" y2="422" stroke="#8a8a8a" stroke-width="1.6"/>

  <!-- level 5 -->
  <ellipse cx="608" cy="446" rx="66" ry="22" fill="#ffffff" stroke="#1a4a5a" stroke-width="1.6"/>
  <text x="608" y="443" font-size="10.5" fill="#1a4a5a" text-anchor="middle" font-style="italic">goose in view</text>
  <text x="608" y="456" font-size="10.5" fill="#1a4a5a" text-anchor="middle" font-style="italic">(k frames) ?</text>
  <rect x="690" y="424" width="150" height="44" rx="9" fill="#fafcfd" stroke="#1a7a8a" stroke-width="2"/>
  <text x="765" y="442" font-size="11" font-weight="bold" fill="#1a4a5a" text-anchor="middle">HARASS_TARGET</text>
  <text x="765" y="457" font-size="9.5" fill="#555" text-anchor="middle" font-style="italic">deterrence pattern (next chapter)</text>

  <!-- legend -->
  <rect x="40" y="480" width="440" height="118" rx="8" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="54" y="502" font-size="10.5" font-weight="bold" fill="#444" text-anchor="start">Reading the tree (each node returns SUCCESS, FAILURE, or RUNNING):</text>
  <text x="54" y="520" font-size="10" fill="#555" text-anchor="start"><tspan font-weight="bold">?</tspan> selector &#8212; tick children left to right; return the first that does not fail.</text>
  <text x="54" y="536" font-size="10" fill="#555" text-anchor="start"><tspan font-weight="bold">&#8594;</tspan> sequence &#8212; tick children in order; every child must succeed.</text>
  <text x="54" y="552" font-size="10" fill="#555" text-anchor="start">ellipse = condition (an instant test) &#183; rounded box = action (may return</text>
  <text x="54" y="566" font-size="10" fill="#555" text-anchor="start">RUNNING for many ticks) &#183; RUNNING is how a long behavior holds the tree</text>
  <text x="54" y="586" font-size="10" fill="#8a4d0f" text-anchor="start" font-style="italic">amber branch: the reflex &#8212; first in priority order, so it is checked first every tick.</text>

  <!-- footer -->
  <text x="490" y="624" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">When &#8220;threat closing?&#8221; flips true, the very next tick never reaches the mission branch: the running SEARCH or HARASS action</text>
  <text x="490" y="640" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">is preempted by construction. The flat machine drew one dashed arrow per state; the tree gets the same behavior from ordering.</text>
</svg>
