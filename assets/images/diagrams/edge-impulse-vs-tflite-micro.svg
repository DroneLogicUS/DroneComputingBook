<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tkArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55636b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="700" fill="#ffffff"/>

  <text x="470" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Two roads to the same microcontroller: TFLite Micro versus Edge Impulse</text>
  <text x="470" y="52" font-size="12.5" fill="#555" text-anchor="middle">A library you assemble against, versus a hosted platform that assembles for you &#8212; shaded steps are the ones you own</text>

  <!-- legend -->
  <rect x="290" y="66" width="14" height="14" fill="#e8b04a"/>
  <text x="310" y="78" font-size="11" fill="#222">your work, your code</text>
  <rect x="480" y="66" width="14" height="14" fill="#f2f6f8" stroke="#1a7a8a" stroke-width="1.2"/>
  <text x="500" y="78" font-size="11" fill="#222">tool does it for you</text>

  <!-- ============ LEFT COLUMN: TFLM ============ -->
  <rect x="50" y="94" width="400" height="452" rx="8" fill="#ffffff" stroke="#1a4a5a" stroke-width="2"/>
  <text x="250" y="120" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">TensorFlow Lite for Microcontrollers</text>
  <text x="250" y="138" font-size="11.5" fill="#555" text-anchor="middle">an open-source C++ inference library &#8212; you build the pipeline</text>

  <rect x="80" y="152" width="340" height="44" rx="5" fill="#e8b04a" stroke="#4a3410" stroke-width="1"/>
  <text x="250" y="170" font-size="11.5" font-weight="bold" fill="#4a3410" text-anchor="middle">1 &#183; Collect and label data</text>
  <text x="250" y="186" font-size="10.5" fill="#4a3410" text-anchor="middle">your scripts, your storage, your label discipline</text>
  <line x1="250" y1="196" x2="250" y2="206" stroke="#55636b" stroke-width="1.5" marker-end="url(#tkArrow)"/>

  <rect x="80" y="208" width="340" height="44" rx="5" fill="#e8b04a" stroke="#4a3410" stroke-width="1"/>
  <text x="250" y="226" font-size="11.5" font-weight="bold" fill="#4a3410" text-anchor="middle">2 &#183; Train in TensorFlow / Keras</text>
  <text x="250" y="242" font-size="10.5" fill="#4a3410" text-anchor="middle">on your workstation or cloud account</text>
  <line x1="250" y1="252" x2="250" y2="262" stroke="#55636b" stroke-width="1.5" marker-end="url(#tkArrow)"/>

  <rect x="80" y="264" width="340" height="44" rx="5" fill="#e8b04a" stroke="#4a3410" stroke-width="1"/>
  <text x="250" y="282" font-size="11.5" font-weight="bold" fill="#4a3410" text-anchor="middle">3 &#183; Convert + quantize to int8 (.tflite)</text>
  <text x="250" y="298" font-size="10.5" fill="#4a3410" text-anchor="middle">you supply the calibration (representative) dataset</text>
  <line x1="250" y1="308" x2="250" y2="318" stroke="#55636b" stroke-width="1.5" marker-end="url(#tkArrow)"/>

  <rect x="80" y="320" width="340" height="44" rx="5" fill="#e8b04a" stroke="#4a3410" stroke-width="1"/>
  <text x="250" y="338" font-size="11.5" font-weight="bold" fill="#4a3410" text-anchor="middle">4 &#183; Embed model as a C array in firmware</text>
  <text x="250" y="354" font-size="10.5" fill="#4a3410" text-anchor="middle">the model ships inside the binary &#8212; no filesystem, no OS</text>
  <line x1="250" y1="364" x2="250" y2="374" stroke="#55636b" stroke-width="1.5" marker-end="url(#tkArrow)"/>

  <rect x="80" y="376" width="340" height="56" rx="5" fill="#e8b04a" stroke="#4a3410" stroke-width="1"/>
  <text x="250" y="394" font-size="11.5" font-weight="bold" fill="#4a3410" text-anchor="middle">5 &#183; Integrate the interpreter</text>
  <text x="250" y="410" font-size="10.5" fill="#4a3410" text-anchor="middle">register only the ops you use &#183; size the static tensor arena</text>
  <text x="250" y="424" font-size="10.5" fill="#4a3410" text-anchor="middle">by hand &#8212; no malloc at inference time</text>
  <line x1="250" y1="432" x2="250" y2="442" stroke="#55636b" stroke-width="1.5" marker-end="url(#tkArrow)"/>

  <rect x="80" y="444" width="340" height="44" rx="5" fill="#e8b04a" stroke="#4a3410" stroke-width="1"/>
  <text x="250" y="462" font-size="11.5" font-weight="bold" fill="#4a3410" text-anchor="middle">6 &#183; Profile on target, iterate</text>
  <text x="250" y="478" font-size="10.5" fill="#4a3410" text-anchor="middle">your benchmarks, your regression tests</text>

  <text x="250" y="512" font-size="11" font-style="italic" fill="#1a4a5a" text-anchor="middle">full control, no vendor dependency, any compilable target &#8212;</text>
  <text x="250" y="528" font-size="11" font-style="italic" fill="#1a4a5a" text-anchor="middle">and every one of the six steps is on your shoulders</text>

  <!-- ============ RIGHT COLUMN: EDGE IMPULSE ============ -->
  <rect x="490" y="94" width="400" height="452" rx="8" fill="#ffffff" stroke="#1a4a5a" stroke-width="2"/>
  <text x="690" y="120" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Edge Impulse</text>
  <text x="690" y="138" font-size="11.5" fill="#555" text-anchor="middle">a hosted end-to-end platform &#8212; the pipeline is the product</text>

  <rect x="520" y="152" width="340" height="44" rx="5" fill="#f2f6f8" stroke="#1a7a8a" stroke-width="1.2"/>
  <text x="690" y="170" font-size="11.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">1 &#183; Acquire data through the studio</text>
  <text x="690" y="186" font-size="10.5" fill="#555" text-anchor="middle">browser upload, phone, or a connected dev board</text>
  <line x1="690" y1="196" x2="690" y2="206" stroke="#55636b" stroke-width="1.5" marker-end="url(#tkArrow)"/>

  <rect x="520" y="208" width="340" height="44" rx="5" fill="#f2f6f8" stroke="#1a7a8a" stroke-width="1.2"/>
  <text x="690" y="226" font-size="11.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">2 &#183; Compose DSP block + model in the browser</text>
  <text x="690" y="242" font-size="10.5" fill="#555" text-anchor="middle">visual defaults, or Keras &#8220;expert mode&#8221; underneath</text>
  <line x1="690" y1="252" x2="690" y2="262" stroke="#55636b" stroke-width="1.5" marker-end="url(#tkArrow)"/>

  <rect x="520" y="264" width="340" height="44" rx="5" fill="#f2f6f8" stroke="#1a7a8a" stroke-width="1.2"/>
  <text x="690" y="282" font-size="11.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">3 &#183; Train on the platform&#8217;s cloud</text>
  <text x="690" y="298" font-size="10.5" fill="#555" text-anchor="middle">quantization and calibration handled as defaults</text>
  <line x1="690" y1="308" x2="690" y2="318" stroke="#55636b" stroke-width="1.5" marker-end="url(#tkArrow)"/>

  <rect x="520" y="320" width="340" height="44" rx="5" fill="#f2f6f8" stroke="#1a7a8a" stroke-width="1.2"/>
  <text x="690" y="338" font-size="11.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">4 &#183; Test in the browser, then on the device</text>
  <text x="690" y="354" font-size="10.5" fill="#555" text-anchor="middle">live classification against held-out samples</text>
  <line x1="690" y1="364" x2="690" y2="374" stroke="#55636b" stroke-width="1.5" marker-end="url(#tkArrow)"/>

  <rect x="520" y="376" width="340" height="56" rx="5" fill="#f2f6f8" stroke="#1a7a8a" stroke-width="1.2"/>
  <text x="690" y="394" font-size="11.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">5 &#183; Export a compiled C++ library</text>
  <text x="690" y="410" font-size="10.5" fill="#555" text-anchor="middle">EON compiler emits the network as source code &#8212; no</text>
  <text x="690" y="424" font-size="10.5" fill="#555" text-anchor="middle">interpreter, meaningfully less RAM and flash</text>
  <line x1="690" y1="432" x2="690" y2="442" stroke="#55636b" stroke-width="1.5" marker-end="url(#tkArrow)"/>

  <rect x="520" y="444" width="340" height="44" rx="5" fill="#e8b04a" stroke="#4a3410" stroke-width="1"/>
  <text x="690" y="462" font-size="11.5" font-weight="bold" fill="#4a3410" text-anchor="middle">6 &#183; Integrate the exported library, profile</text>
  <text x="690" y="478" font-size="10.5" fill="#4a3410" text-anchor="middle">per-target latency and RAM estimates come with it</text>

  <text x="690" y="512" font-size="11" font-style="italic" fill="#1a4a5a" text-anchor="middle">days to a working prototype, guided estimates, easiest on</text>
  <text x="690" y="528" font-size="11" font-style="italic" fill="#1a4a5a" text-anchor="middle">supported boards &#8212; the pipeline lives on someone else&#8217;s servers</text>

  <!-- center vs -->
  <circle cx="470" cy="320" r="20" fill="#1a4a5a"/>
  <text x="470" y="325" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">vs</text>

  <!-- banner -->
  <rect x="50" y="566" width="840" height="118" rx="8" fill="#10233c"/>
  <text x="470" y="594" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Same destination, different contract</text>
  <text x="470" y="618" font-size="12.5" fill="#ffffff" text-anchor="middle">both roads end in an int8 model executing C++ on the same silicon &#8212; Edge Impulse itself builds on TensorFlow and the TFLite format</text>
  <text x="470" y="638" font-size="12.5" fill="#ffffff" text-anchor="middle">choose by who should own the pipeline: a team that must control and reproduce every step, or one that must ship a trigger this month</text>
  <text x="470" y="662" font-size="12" fill="#e8b04a" text-anchor="middle">Running example: this is the MCU tier&#8217;s decision &#8212; the Jetson-class detector takes a third road (TFLite/ONNX &#8594; TensorRT) with no MCU limits</text>
</svg>
