<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">
  <defs>
    <marker id="ohTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
    <marker id="ohAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b26a1a"/>
    </marker>
    <marker id="ohGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="790" fill="#ffffff"/>

  <text x="480" y="28" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">ORCA: collision avoidance as a half-plane</text>
  <text x="480" y="50" font-size="13" fill="#555" text-anchor="middle">The worked head-on encounter: 6 m apart, combined envelope r = 1.5 m, horizon &#964; = 2 s, closing at 2.6 m/s.</text>

  <!-- ===== inset: physical picture (top right) ===== -->
  <rect x="668" y="66" width="272" height="118" rx="8" fill="#f7f7f7" stroke="#cccccc" stroke-width="1"/>
  <text x="804" y="86" font-size="11.5" font-weight="bold" fill="#333" text-anchor="middle">The encounter (position space)</text>
  <!-- drone A -->
  <g transform="translate(716 130)">
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#1a7a8a" stroke-width="2.2"/>
    <line x1="-7" y1="7" x2="7" y2="-7" stroke="#1a7a8a" stroke-width="2.2"/>
  </g>
  <circle cx="716" cy="130" r="20" fill="none" stroke="#1a7a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- drone B -->
  <g transform="translate(892 130)">
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#b26a1a" stroke-width="2.2"/>
    <line x1="-7" y1="7" x2="7" y2="-7" stroke="#b26a1a" stroke-width="2.2"/>
  </g>
  <circle cx="892" cy="130" r="20" fill="none" stroke="#b26a1a" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 740 130 L 774 130" fill="none" stroke="#1a7a8a" stroke-width="2" marker-end="url(#ohTeal)"/>
  <path d="M 868 130 L 834 130" fill="none" stroke="#b26a1a" stroke-width="2" marker-end="url(#ohAmber)"/>
  <text x="716" y="167" font-size="10" fill="#1a4a5a" text-anchor="middle">A: +1.3 m/s</text>
  <text x="892" y="167" font-size="10" fill="#8a4d0f" text-anchor="middle">B: &#8722;1.3 m/s</text>
  <text x="804" y="112" font-size="10" font-style="italic" fill="#666" text-anchor="middle">6 m apart, envelopes 0.75 m each</text>

  <!-- ===== TOP BAND: relative-velocity space ===== -->
  <text x="60" y="96" font-size="13.5" font-weight="bold" fill="#1a4a5a">1. Relative-velocity space: is v = v<tspan dy="3" font-size="10">A</tspan><tspan dy="-3"> &#8722; v</tspan><tspan dy="3" font-size="10">B</tspan><tspan dy="-3"> headed for contact?</tspan></text>

  <!-- forbidden region VO^tau: cap disc plus cone beyond it (near arc between tangency points, then flanks outward) -->
  <path d="M 570 243.8 A 120 120 0 0 0 570 476.2 L 800 536 L 800 184 Z" fill="#ececec" opacity="0.6"/>

  <!-- axis -->
  <line x1="90" y1="360" x2="880" y2="360" stroke="#888" stroke-width="1.3" marker-end="url(#ohGrey)"/>
  <text x="892" y="364" font-size="11" fill="#666">rel. v&#8339; (m/s)</text>
  <!-- ticks each 1 m/s: scale 160 px per m/s, origin x=120 -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <line x1="120" y1="355" x2="120" y2="365" stroke="#888"/><text x="120" y="380">0</text>
    <line x1="280" y1="355" x2="280" y2="365" stroke="#888"/><text x="280" y="380">1</text>
    <line x1="440" y1="355" x2="440" y2="365" stroke="#888"/><text x="440" y="380">2</text>
    <line x1="600" y1="355" x2="600" y2="365" stroke="#888"/><text x="600" y="380">3</text>
    <line x1="760" y1="355" x2="760" y2="365" stroke="#888"/><text x="760" y="380">4</text>
  </g>

  <!-- cone from origin tangent to cap disc: half-angle asin(0.25)=14.48deg, slope 0.2583 -->
  <line x1="120" y1="360" x2="800" y2="184" stroke="#999" stroke-width="1.4" stroke-dasharray="7 5"/>
  <line x1="120" y1="360" x2="800" y2="536" stroke="#999" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="238" y="272" font-size="10.5" font-style="italic" fill="#777" text-anchor="middle">VO cone flank</text>
  <text x="238" y="287" font-size="10.5" font-style="italic" fill="#777" text-anchor="middle">(the sideways exit &#8212; farther away here)</text>
  <path d="M 268 294 L 306 312" fill="none" stroke="#999" stroke-width="1" marker-end="url(#ohGrey)"/>

  <!-- cap disc: center (3.0, 0) -> x=600, r = 0.75 m/s -> 120 px -->
  <circle cx="600" cy="360" r="120" fill="#f0e6da" opacity="0.55" stroke="#b26a1a" stroke-width="1.6" stroke-dasharray="8 6"/>
  <text x="600" y="238" font-size="11" font-weight="bold" fill="#8a4d0f" text-anchor="middle">&#964;-truncation cap: disc at p/&#964; = (3.0, 0), radius r/&#964; = 0.75 m/s</text>
  <text x="600" y="254" font-size="10.5" font-style="italic" fill="#8a4d0f" text-anchor="middle">relative velocities in the truncated cone collide within &#964; = 2 s</text>
  <circle cx="600" cy="360" r="3" fill="#8a4d0f"/>

  <!-- current relative velocity v = (2.6, 0) -> x=536 -->
  <circle cx="536" cy="360" r="7" fill="#1a7a8a"/>
  <text x="536" y="416" font-size="11.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">v = v<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> &#8722; v</tspan><tspan dy="3" font-size="9">B</tspan><tspan dy="-3"> = (2.6, 0)</tspan></text>
  <text x="536" y="432" font-size="10.5" font-style="italic" fill="#1a4a5a" text-anchor="middle">contact in 4.5/2.6 &#8776; 1.7 s &#8212; inside the obstacle</text>

  <!-- u: smallest exit, to cap boundary at (2.25,0) -> x=480 -->
  <path d="M 529 360 L 487 360" fill="none" stroke="#b26a1a" stroke-width="3" marker-end="url(#ohAmber)"/>
  <circle cx="480" cy="360" r="4.5" fill="#b26a1a"/>
  <text x="470" y="336" font-size="12" font-weight="bold" fill="#8a4d0f" text-anchor="middle">u = (&#8722;0.35, 0)</text>
  <text x="452" y="320" font-size="10.5" font-style="italic" fill="#8a4d0f" text-anchor="middle">smallest correction that exits</text>
  <text x="404" y="462" font-size="10" fill="#8a4d0f" text-anchor="middle">boundary: 2.25 m/s &#8212;</text>
  <text x="404" y="476" font-size="10" fill="#8a4d0f" text-anchor="middle">contact exactly at &#964;</text>
  <path d="M 428 448 L 470 372" fill="none" stroke="#b26a1a" stroke-width="0.9" stroke-dasharray="3 3"/>

  <!-- ===== BOTTOM BAND: agent A's own velocity space ===== -->
  <text x="60" y="574" font-size="13.5" font-weight="bold" fill="#1a4a5a">2. Agent A's velocity space: take half of u, keep everything on the far side</text>

  <!-- permitted region shading: left of x=457.5 -->
  <rect x="90" y="596" width="368" height="110" fill="#eef4f5"/>
  <!-- axis: scale 300 px per m/s, origin x=120, y=662 -->
  <line x1="90" y1="662" x2="880" y2="662" stroke="#888" stroke-width="1.3" marker-end="url(#ohGrey)"/>
  <text x="892" y="666" font-size="11" fill="#666">v&#8339; (m/s)</text>
  <g font-size="10" fill="#888" text-anchor="middle">
    <line x1="120" y1="657" x2="120" y2="667" stroke="#888"/><text x="120" y="682">0</text>
    <line x1="270" y1="657" x2="270" y2="667" stroke="#888"/><text x="270" y="682">0.5</text>
    <line x1="420" y1="657" x2="420" y2="667" stroke="#888"/><text x="420" y="682">1.0</text>
    <line x1="570" y1="657" x2="570" y2="667" stroke="#888"/><text x="570" y="682">1.5</text>
    <line x1="720" y1="657" x2="720" y2="667" stroke="#888"/><text x="720" y="682">2.0</text>
  </g>

  <!-- half-plane boundary at vA + u/2 = 1.125 -> x=457.5 -->
  <line x1="457.5" y1="596" x2="457.5" y2="706" stroke="#1a7a8a" stroke-width="2.6"/>
  <circle cx="457.5" cy="662" r="5" fill="#1a7a8a"/>
  <text x="457.5" y="726" font-size="11.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">v<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> + &#189;u = (1.125, 0)</tspan></text>
  <text x="278" y="616" font-size="11" font-weight="bold" fill="#1a4a5a" text-anchor="middle">ORCA half-plane: permitted velocities</text>
  <text x="278" y="631" font-size="10.5" font-style="italic" fill="#1a4a5a" text-anchor="middle">(v &#8722; (v<tspan dy="2.5" font-size="8">A</tspan><tspan dy="-2.5"> + &#189;u)) &#183; &#251;  &#8805; 0  &#8658;  v</tspan><tspan dy="2.5" font-size="8">x</tspan><tspan dy="-2.5"> &#8804; 1.125</tspan></text>

  <!-- preferred velocity, violating -->
  <circle cx="510" cy="662" r="6.5" fill="none" stroke="#b26a1a" stroke-width="2.4"/>
  <text x="522" y="646" font-size="10.5" fill="#8a4d0f">preferred: (1.3, 0) &#8212; violates</text>
  <!-- chosen velocity -->
  <path d="M 503 662 L 466 662" fill="none" stroke="#b26a1a" stroke-width="2.2" marker-end="url(#ohAmber)"/>
  <text x="590" y="694" font-size="10.5" font-style="italic" fill="#8a4d0f">the LP picks the nearest permitted point:</text>
  <text x="590" y="708" font-size="10.5" font-style="italic" fill="#8a4d0f">(1.125, 0) &#8212; ease off 0.175 m/s; B mirrors it</text>

  <!-- footer -->
  <rect x="60" y="740" width="840" height="38" rx="6" fill="#f7f7f7" stroke="#cccccc" stroke-width="1"/>
  <text x="480" y="756" font-size="10.5" fill="#444" text-anchor="middle">Check: new closure 2.6 &#8722; 0.35 = 2.25 m/s, and 4.5 m &#247; 2.25 m/s = 2.0 s = &#964; &#8212; contact deferred to exactly the horizon, re-deferred every tick.</text>
  <text x="480" y="771" font-size="10.5" font-style="italic" fill="#666" text-anchor="middle">No messages exchanged: each agent needs only an estimate of its neighbor's position and velocity &#8212; from telemetry, or from a camera.</text>
</svg>
