<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="masArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
    <marker id="masArrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="masArrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b26a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1020" height="640" fill="#ffffff"/>

  <text x="510" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">The autopilot software stack</text>
  <text x="510" y="52" font-size="13" fill="#555" text-anchor="middle">Where each named layer sits, and which of the three command paths it rides.</text>

  <!-- aircraft enclosure -->
  <rect x="370" y="72" width="620" height="480" rx="10" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="982" y="92" font-size="12" fill="#777" text-anchor="end" font-style="italic">on the aircraft</text>

  <!-- companion computer -->
  <rect x="395" y="100" width="570" height="140" rx="8" fill="#f4f8fa" stroke="#1a4a5a" stroke-width="2"/>
  <text x="680" y="122" font-size="15" font-weight="bold" fill="#1a4a5a" text-anchor="middle">Companion computer &#8212; Jetson Nano, Linux</text>

  <rect x="415" y="136" width="255" height="86" rx="6" fill="#ffffff" stroke="#1a7a8a" stroke-width="1.8"/>
  <text x="542" y="158" font-size="13" font-weight="bold" fill="#1a4a5a" text-anchor="middle">MAVSDK mission script</text>
  <text x="542" y="176" font-size="11" fill="#555" text-anchor="middle" font-style="italic">one linear Python program</text>
  <text x="542" y="192" font-size="11" fill="#555" text-anchor="middle" font-style="italic">connect &#8594; arm &#8594; takeoff &#8594; land</text>
  <text x="542" y="212" font-size="11" fill="#222" text-anchor="middle">speaks MAVLink</text>

  <rect x="690" y="136" width="255" height="86" rx="6" fill="#ffffff" stroke="#1a7a8a" stroke-width="1.8"/>
  <text x="817" y="158" font-size="13" font-weight="bold" fill="#1a4a5a" text-anchor="middle">ROS 2 node graph</text>
  <text x="817" y="176" font-size="11" fill="#555" text-anchor="middle" font-style="italic">nodes exchanging topics + services,</text>
  <text x="817" y="192" font-size="11" fill="#555" text-anchor="middle" font-style="italic">Micro XRCE-DDS agent at the edge</text>
  <text x="817" y="212" font-size="11" fill="#222" text-anchor="middle">speaks uORB over DDS</text>

  <!-- UART band -->
  <line x1="542" y1="240" x2="542" y2="284" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#masArrow)"/>
  <line x1="817" y1="240" x2="817" y2="284" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#masArrow)"/>
  <text x="530" y="268" font-size="10.5" fill="#222" text-anchor="end" font-style="italic">MAVLink v2 packets</text>
  <text x="829" y="268" font-size="10.5" fill="#222" font-style="italic">serialized uORB topics</text>

  <rect x="395" y="288" width="570" height="42" rx="6" fill="#eef5f7" stroke="#1a7a8a" stroke-width="2"/>
  <text x="680" y="308" font-size="13" font-weight="bold" fill="#1a4a5a" text-anchor="middle">UART &#8212; TELEM2, three wires, 921,600 baud</text>
  <text x="680" y="323" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">the physical link wired and heartbeat-verified in Part I; both protocols ride the same wire</text>

  <line x1="680" y1="330" x2="680" y2="360" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#masArrow)"/>

  <!-- flight controller -->
  <rect x="395" y="364" width="570" height="118" rx="8" fill="#fdf3e7" stroke="#b26a1a" stroke-width="2.4"/>
  <text x="680" y="386" font-size="15" font-weight="bold" fill="#8a4d0f" text-anchor="middle">Flight controller &#8212; Pixhawk 6C running PX4</text>

  <rect x="413" y="398" width="168" height="68" rx="6" fill="#ffffff" stroke="#b26a1a" stroke-width="1.4"/>
  <text x="497" y="420" font-size="12" font-weight="bold" fill="#8a4d0f" text-anchor="middle">EKF2 estimator</text>
  <text x="497" y="437" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">one fused state,</text>
  <text x="497" y="451" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">every loop closes on it</text>

  <rect x="597" y="398" width="168" height="68" rx="6" fill="#ffffff" stroke="#b26a1a" stroke-width="1.4"/>
  <text x="681" y="420" font-size="12" font-weight="bold" fill="#8a4d0f" text-anchor="middle">Cascaded PID loops</text>
  <text x="681" y="437" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">position &#8594; velocity &#8594;</text>
  <text x="681" y="451" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">attitude &#8594; rate</text>

  <rect x="781" y="398" width="168" height="68" rx="6" fill="#ffffff" stroke="#b26a1a" stroke-width="1.4"/>
  <text x="865" y="420" font-size="12" font-weight="bold" fill="#8a4d0f" text-anchor="middle">Modes + parameters</text>
  <text x="865" y="437" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">Offboard, failsafes,</text>
  <text x="865" y="451" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">MC_ROLLRATE_P &#8230;</text>

  <!-- motors -->
  <line x1="680" y1="482" x2="680" y2="508" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#masArrow)"/>
  <rect x="580" y="512" width="200" height="34" rx="6" fill="#f4f8fa" stroke="#1a4a5a" stroke-width="1.8"/>
  <text x="680" y="534" font-size="12.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">four motor commands</text>

  <!-- ground column -->
  <rect x="35" y="100" width="270" height="122" rx="8" fill="#f4f8fa" stroke="#1a4a5a" stroke-width="2"/>
  <text x="170" y="124" font-size="14" font-weight="bold" fill="#1a4a5a" text-anchor="middle">QGroundControl</text>
  <text x="170" y="143" font-size="11" fill="#555" text-anchor="middle" font-style="italic">ground-control station on a laptop:</text>
  <text x="170" y="159" font-size="11" fill="#555" text-anchor="middle" font-style="italic">monitoring, mission upload,</text>
  <text x="170" y="175" font-size="11" fill="#555" text-anchor="middle" font-style="italic">parameter editing, calibration</text>
  <text x="170" y="200" font-size="11" fill="#222" text-anchor="middle">speaks MAVLink</text>

  <path d="M 305 190 C 350 220, 360 330, 393 380" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#masArrowGrey)"/>
  <text x="316" y="290" font-size="10.5" fill="#666" font-style="italic">MAVLink over the</text>
  <text x="316" y="304" font-size="10.5" fill="#666" font-style="italic">telemetry radio</text>

  <rect x="35" y="420" width="270" height="96" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="170" y="444" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">RC transmitter</text>
  <text x="170" y="463" font-size="11" fill="#555" text-anchor="middle" font-style="italic">the safety pilot&#8217;s sticks, straight to a</text>
  <text x="170" y="479" font-size="11" fill="#555" text-anchor="middle" font-style="italic">receiver on the flight controller &#8212;</text>
  <text x="170" y="495" font-size="11" fill="#555" text-anchor="middle" font-style="italic">no protocol stack, always able to override</text>

  <path d="M 305 468 C 345 468, 360 445, 393 440" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#masArrowGrey)"/>

  <text x="510" y="585" font-size="13" fill="#222" text-anchor="middle">Three command paths converge on one autopilot. The ground station and the MAVSDK script speak MAVLink;</text>
  <text x="510" y="604" font-size="13" fill="#222" text-anchor="middle">ROS 2 skips the translation and publishes PX4&#8217;s own uORB topics across the DDS bridge &#8212; over the same three wires.</text>
</svg>
