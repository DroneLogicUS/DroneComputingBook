  <text x="407.0" y="106" font-size="11" font-weight="bold" fill="#444" text-anchor="middle">obstacle cells (occupied)</text>
  <text x="730" y="180" font-size="12.5" font-weight="bold" fill="#222">Per-cell bookkeeping</text>
  <text x="730" y="206" font-size="11.5" fill="#333">g(n): cost from S so far</text>
  <text x="730" y="230" font-size="11.5" fill="#333">h(n): straight-line</text>
  <text x="730" y="246" font-size="11.5" fill="#333">distance to G (dashed)</text>
  <text x="730" y="270" font-size="11.5" font-weight="bold" fill="#333">f(n) = g(n) + h(n)</text>
  <text x="730" y="300" font-size="11" fill="#555" font-style="italic">h never overestimates</text>
  <text x="730" y="316" font-size="11" fill="#555" font-style="italic">(admissible), so the</text>
  <text x="730" y="332" font-size="11" fill="#555" font-style="italic">first path to reach G</text>
  <text x="730" y="348" font-size="11" fill="#555" font-style="italic">is the shortest one.</text>
