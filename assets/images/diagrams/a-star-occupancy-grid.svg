  <text x="670" y="579" font-size="11.5" fill="#333">heuristic h to G</text>
  <text x="480" y="612" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">The lawnmower answers &#8220;how do I see every point of an area?&#8221;; A* answers &#8220;how do I reach one point past what is in the way?&#8221; &#8212;</text>
  <text x="480" y="628" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">different questions, different algorithms, one mission. This figure&#8217;s expansion and path were computed by the chapter&#8217;s own A* implementation.</text>
