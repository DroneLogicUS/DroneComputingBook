<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="cclArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
    <marker id="cclArrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1010" height="500" fill="#ffffff"/>

  <text x="505" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">The cascaded control stack</text>
  <text x="505" y="52" font-size="13" fill="#555" text-anchor="middle">Each controller&#8217;s output is the next inner loop&#8217;s setpoint; every loop closes against the same estimator.</text>

  <text x="125" y="78" font-size="11" fill="#777" text-anchor="middle" font-style="italic">position setpoint from mission / offboard</text>

  <!-- controller row -->
  <rect x="40" y="85" width="170" height="100" rx="8" fill="#f4f8fa" stroke="#1a4a5a" stroke-width="2"/>
  <text x="125" y="113" font-size="15" font-weight="bold" fill="#1a4a5a" text-anchor="middle">Position</text>
  <text x="125" y="136" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">P on position error</text>
  <text x="125" y="165" font-size="12" fill="#222" text-anchor="middle">&#8776; 50 Hz</text>

  <rect x="275" y="85" width="170" height="100" rx="8" fill="#f4f8fa" stroke="#1a4a5a" stroke-width="2"/>
  <text x="360" y="113" font-size="15" font-weight="bold" fill="#1a4a5a" text-anchor="middle">Velocity</text>
  <text x="360" y="136" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">PID on velocity error</text>
  <text x="360" y="151" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">output: a thrust vector</text>
  <text x="360" y="172" font-size="12" fill="#222" text-anchor="middle">&#8776; 50 Hz</text>

  <rect x="510" y="85" width="170" height="100" rx="8" fill="#f4f8fa" stroke="#1a4a5a" stroke-width="2"/>
  <text x="595" y="113" font-size="15" font-weight="bold" fill="#1a4a5a" text-anchor="middle">Attitude</text>
  <text x="595" y="136" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">P on quaternion error</text>
  <text x="595" y="165" font-size="12" fill="#222" text-anchor="middle">&#8776; 250 Hz</text>

  <rect x="745" y="85" width="170" height="100" rx="8" fill="#fdf3e7" stroke="#b26a1a" stroke-width="2.4"/>
  <text x="830" y="113" font-size="15" font-weight="bold" fill="#8a4d0f" text-anchor="middle">Rate</text>
  <text x="830" y="136" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">PID &#215; 3 on p, q, r error</text>
  <text x="830" y="151" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">the stabilization heart</text>
  <text x="830" y="172" font-size="12" fill="#222" text-anchor="middle">&#8776; 1 kHz</text>

  <!-- arrows between controllers -->
  <line x1="212" y1="135" x2="271" y2="135" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#cclArrow)"/>
  <text x="242" y="115" font-size="10.5" fill="#222" text-anchor="middle" font-style="italic">velocity</text>
  <text x="242" y="127" font-size="10.5" fill="#222" text-anchor="middle" font-style="italic">setpoint</text>

  <line x1="447" y1="135" x2="506" y2="135" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#cclArrow)"/>
  <text x="477" y="115" font-size="10.5" fill="#222" text-anchor="middle" font-style="italic">attitude</text>
  <text x="477" y="127" font-size="10.5" fill="#222" text-anchor="middle" font-style="italic">setpoint</text>

  <line x1="682" y1="135" x2="741" y2="135" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#cclArrow)"/>
  <text x="712" y="115" font-size="10.5" fill="#222" text-anchor="middle" font-style="italic">body-rate</text>
  <text x="712" y="127" font-size="10.5" fill="#222" text-anchor="middle" font-style="italic">setpoint</text>

  <!-- rate -> allocation -->
  <line x1="830" y1="187" x2="830" y2="226" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#cclArrow)"/>
  <text x="842" y="202" font-size="10.5" fill="#222" font-style="italic">torque &#964; +</text>
  <text x="842" y="214" font-size="10.5" fill="#222" font-style="italic">thrust F<tspan font-size="8" dy="2">z</tspan></text>

  <rect x="745" y="230" width="170" height="80" rx="8" fill="#f4f8fa" stroke="#1a4a5a" stroke-width="2"/>
  <text x="830" y="262" font-size="14" font-weight="bold" fill="#1a4a5a" text-anchor="middle">Control allocation</text>
  <text x="830" y="284" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">torque + thrust &#8594; four motors</text>

  <!-- allocation -> airframe -->
  <line x1="741" y1="270" x2="616" y2="270" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#cclArrow)"/>
  <text x="678" y="258" font-size="10.5" fill="#222" text-anchor="middle" font-style="italic">motor commands</text>

  <rect x="430" y="230" width="180" height="80" rx="8" fill="#f4f8fa" stroke="#1a4a5a" stroke-width="2"/>
  <text x="520" y="262" font-size="14" font-weight="bold" fill="#1a4a5a" text-anchor="middle">Motors + airframe</text>
  <text x="520" y="284" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">thrusts become motion</text>

  <!-- airframe -> EKF2 -->
  <line x1="520" y1="310" x2="520" y2="366" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#cclArrowGrey)"/>
  <text x="530" y="342" font-size="10.5" fill="#666" font-style="italic">raw sensor data</text>

  <!-- EKF2 band -->
  <rect x="40" y="370" width="920" height="60" rx="8" fill="#eef5f7" stroke="#1a7a8a" stroke-width="2"/>
  <text x="500" y="395" font-size="14" font-weight="bold" fill="#1a4a5a" text-anchor="middle">EKF2 state estimator</text>
  <text x="500" y="415" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">fuses gyroscope, accelerometer, magnetometer, barometer, and GPS into one state estimate</text>

  <!-- feedback arrows -->
  <line x1="125" y1="370" x2="125" y2="190" stroke="#1a7a8a" stroke-width="2" marker-end="url(#cclArrow)"/>
  <text x="133" y="352" font-size="10.5" fill="#222" font-style="italic">p&#770; position</text>
  <line x1="360" y1="370" x2="360" y2="190" stroke="#1a7a8a" stroke-width="2" marker-end="url(#cclArrow)"/>
  <text x="368" y="352" font-size="10.5" fill="#222" font-style="italic">v&#770; velocity</text>
  <line x1="630" y1="370" x2="630" y2="190" stroke="#1a7a8a" stroke-width="2" marker-end="url(#cclArrow)"/>
  <text x="638" y="352" font-size="10.5" fill="#222" font-style="italic">q&#770; attitude</text>
  <path d="M 945 370 V 135 H 920" fill="none" stroke="#1a7a8a" stroke-width="2" marker-end="url(#cclArrow)"/>
  <text x="937" y="352" font-size="10.5" fill="#222" font-style="italic" text-anchor="end">&#969;&#770; body rates</text>

  <text x="505" y="470" font-size="13" fill="#222" text-anchor="middle">Outer loops decide what the vehicle should do; the inner rate loop keeps it stable enough to do it.</text>
</svg>
