<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="780" height="500" fill="#ffffff"/>

  <!-- top fixed electrode rail and fingers (anchored) -->
  <rect x="250" y="40" width="260" height="20" fill="#e8b04a" stroke="#9a6b1f" stroke-width="1.5"/>
  <rect x="283" y="60" width="14" height="95" fill="#e8b04a" stroke="#9a6b1f" stroke-width="1.5"/>
  <rect x="358" y="60" width="14" height="95" fill="#e8b04a" stroke="#9a6b1f" stroke-width="1.5"/>
  <rect x="403" y="60" width="14" height="95" fill="#e8b04a" stroke="#9a6b1f" stroke-width="1.5"/>
  <rect x="478" y="60" width="14" height="95" fill="#e8b04a" stroke="#9a6b1f" stroke-width="1.5"/>
  <text x="520" y="55" font-size="15" fill="#222">fixed electrode rail (anchored)</text>

  <!-- bottom fixed electrode rail and fingers (anchored) -->
  <rect x="250" y="380" width="260" height="20" fill="#e8b04a" stroke="#9a6b1f" stroke-width="1.5"/>
  <rect x="283" y="285" width="14" height="95" fill="#e8b04a" stroke="#9a6b1f" stroke-width="1.5"/>
  <rect x="358" y="285" width="14" height="95" fill="#e8b04a" stroke="#9a6b1f" stroke-width="1.5"/>
  <rect x="403" y="285" width="14" height="95" fill="#e8b04a" stroke="#9a6b1f" stroke-width="1.5"/>
  <rect x="478" y="285" width="14" height="95" fill="#e8b04a" stroke="#9a6b1f" stroke-width="1.5"/>
  <text x="520" y="395" font-size="15" fill="#222">fixed electrode rail (anchored)</text>

  <!-- anchors -->
  <rect x="40" y="185" width="40" height="70" fill="#8a8a8a" stroke="#555" stroke-width="1.5"/>
  <rect x="680" y="185" width="40" height="70" fill="#8a8a8a" stroke="#555" stroke-width="1.5"/>
  <text x="30" y="277" font-size="15" fill="#222">anchor (to substrate)</text>

  <!-- flexure springs (serpentine) -->
  <path d="M 80 220 H 105 V 195 H 125 V 245 H 145 V 195 H 165 V 245 H 185 V 195 H 205 V 245 H 225 V 220 H 250"
        fill="none" stroke="#555" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 510 220 H 535 V 195 H 555 V 245 H 575 V 195 H 595 V 245 H 615 V 195 H 635 V 245 H 655 V 220 H 680"
        fill="none" stroke="#555" stroke-width="5" stroke-linejoin="round"/>
  <text x="60" y="325" font-size="15" fill="#222">flexure spring, stiffness k</text>
  <line x1="130" y1="318" x2="150" y2="250" stroke="#888" stroke-width="1.2"/>

  <!-- proof mass with movable fingers -->
  <rect x="313" y="75" width="14" height="95" fill="#7da7d9" stroke="#34567f" stroke-width="1.5"/>
  <rect x="433" y="75" width="14" height="95" fill="#7da7d9" stroke="#34567f" stroke-width="1.5"/>
  <rect x="313" y="270" width="14" height="95" fill="#7da7d9" stroke="#34567f" stroke-width="1.5"/>
  <rect x="433" y="270" width="14" height="95" fill="#7da7d9" stroke="#34567f" stroke-width="1.5"/>
  <rect x="250" y="170" width="260" height="100" fill="#7da7d9" stroke="#34567f" stroke-width="2"/>
  <text x="380" y="212" font-size="17" fill="#10233c" text-anchor="middle" font-weight="bold">proof mass, m</text>
  <line x1="352" y1="242" x2="408" y2="242" stroke="#10233c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="380" y="262" font-size="14" fill="#10233c" text-anchor="middle" font-style="italic">displacement x</text>

  <!-- movable finger label -->
  <text x="25" y="163" font-size="15" fill="#222">movable finger</text>
  <line x1="135" y1="158" x2="309" y2="158" stroke="#888" stroke-width="1.2"/>

  <!-- fixed finger label -->
  <text x="25" y="70" font-size="15" fill="#222">fixed sense finger</text>
  <line x1="155" y1="66" x2="279" y2="66" stroke="#888" stroke-width="1.2"/>

  <!-- differential gap annotations C1 (narrow) and C2 (wide) -->
  <line x1="297" y1="112" x2="313" y2="112" stroke="#444" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="327" y1="112" x2="358" y2="112" stroke="#444" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="305" y="99" font-size="13" fill="#222" text-anchor="middle">C&#8321;</text>
  <text x="342" y="99" font-size="13" fill="#222" text-anchor="middle">C&#8322;</text>

  <!-- sense axis -->
  <line x1="300" y1="435" x2="460" y2="435" stroke="#444" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="380" y="456" font-size="15" fill="#222" text-anchor="middle">sense axis</text>

  <!-- relation caption -->
  <text x="390" y="486" font-size="15" fill="#222" text-anchor="middle" font-style="italic">acceleration a &#8594; displacement x &#8776; (m/k)&#183;a &#8594; &#916;C = C&#8321; &#8722; C&#8322; &#8733; a</text>
</svg>
