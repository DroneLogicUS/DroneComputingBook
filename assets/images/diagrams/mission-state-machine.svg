<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="smArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
    <marker id="smArrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b26a1a"/>
    </marker>
    <marker id="smArrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="540" fill="#ffffff"/>

  <text x="490" y="28" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">The mission as a finite state machine</text>
  <text x="490" y="50" font-size="13" fill="#555" text-anchor="middle">One state is active at a time; transitions fire on guards that test estimated state &#8212; not elapsed time.</text>

  <!-- start marker -->
  <circle cx="34" cy="157" r="7" fill="#222"/>
  <line x1="41" y1="157" x2="58" y2="157" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#smArrow)"/>

  <!-- IDLE -->
  <rect x="62" y="112" width="158" height="92" rx="10" fill="#fafcfd" stroke="#1a7a8a" stroke-width="2"/>
  <text x="141" y="138" font-size="13.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">IDLE</text>
  <text x="141" y="158" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">on ground, disarmed;</text>
  <text x="141" y="172" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">stream warm-up setpoints,</text>
  <text x="141" y="186" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">request Offboard + arm</text>

  <!-- IDLE -> TAKEOFF -->
  <line x1="220" y1="157" x2="283" y2="157" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#smArrow)"/>
  <line x1="252" y1="168" x2="252" y2="210" stroke="#bbbbbb" stroke-width="1"/>
  <text x="252" y="224" font-size="9.5" fill="#222" text-anchor="middle" font-style="italic">stream established &#8743;</text>
  <text x="252" y="237" font-size="9.5" fill="#222" text-anchor="middle" font-style="italic">arm acknowledged</text>

  <!-- TAKEOFF -->
  <rect x="287" y="112" width="172" height="92" rx="10" fill="#fafcfd" stroke="#1a7a8a" stroke-width="2"/>
  <text x="373" y="138" font-size="13.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">TAKEOFF</text>
  <text x="373" y="158" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">stream the climb setpoint</text>
  <text x="373" y="172" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">(0, 0, &#8722;5 m) every tick</text>

  <!-- TAKEOFF -> NAVIGATE -->
  <line x1="459" y1="157" x2="528" y2="157" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#smArrow)"/>
  <line x1="494" y1="168" x2="494" y2="210" stroke="#bbbbbb" stroke-width="1"/>
  <text x="494" y="224" font-size="9.5" fill="#222" text-anchor="middle" font-style="italic">altitude reached:</text>
  <text x="494" y="237" font-size="9.5" fill="#222" text-anchor="middle" font-style="italic">|z &#8722; z&#8347;&#8346;| &lt; 0.5 m</text>

  <!-- NAVIGATE self-loop -->
  <path d="M 590 112 C 570 58 700 58 680 112" fill="none" stroke="#1a7a8a" stroke-width="2.2" marker-end="url(#smArrow)"/>
  <text x="558" y="72" font-size="9.5" fill="#222" text-anchor="end" font-style="italic">arrived (&#8214;p &#8722; p&#7522;&#8214; &lt; r) &#8743; i &lt; N :</text>
  <text x="558" y="86" font-size="9.5" fill="#222" text-anchor="end" font-style="italic">i &#8592; i + 1</text>
  <line x1="564" y1="76" x2="592" y2="80" stroke="#bbbbbb" stroke-width="1"/>

  <!-- NAVIGATE -->
  <rect x="532" y="112" width="204" height="92" rx="10" fill="#fafcfd" stroke="#1a7a8a" stroke-width="2"/>
  <text x="634" y="138" font-size="13.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">NAVIGATE</text>
  <text x="634" y="158" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">stream waypoint i of N</text>
  <text x="634" y="172" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">every tick; test arrival</text>
  <text x="634" y="186" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">against the EKF position</text>

  <!-- NAVIGATE -> LAND -->
  <line x1="736" y1="157" x2="806" y2="157" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#smArrow)"/>
  <line x1="771" y1="168" x2="771" y2="210" stroke="#bbbbbb" stroke-width="1"/>
  <text x="771" y="224" font-size="9.5" fill="#222" text-anchor="middle" font-style="italic">arrived &#8743; i = N</text>
  <text x="771" y="237" font-size="9.5" fill="#222" text-anchor="middle" font-style="italic">(list exhausted)</text>

  <!-- LAND -->
  <rect x="810" y="112" width="150" height="92" rx="10" fill="#fafcfd" stroke="#1a7a8a" stroke-width="2"/>
  <text x="885" y="138" font-size="13.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">LAND</text>
  <text x="885" y="158" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">NAV_LAND sent once;</text>
  <text x="885" y="172" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">node falls silent &#8212;</text>
  <text x="885" y="186" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">PX4 owns the descent</text>

  <!-- LAND -> DONE -->
  <line x1="885" y1="204" x2="885" y2="288" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#smArrow)"/>
  <text x="878" y="242" font-size="9.5" fill="#222" text-anchor="end" font-style="italic">PX4 reports</text>
  <text x="878" y="255" font-size="9.5" fill="#222" text-anchor="end" font-style="italic">landed &#8743; disarmed</text>

  <!-- DONE -->
  <rect x="810" y="292" width="150" height="64" rx="10" fill="#eef5f7" stroke="#1a7a8a" stroke-width="2"/>
  <text x="885" y="318" font-size="13.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">DONE</text>
  <text x="885" y="337" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">log, shut down cleanly</text>

  <!-- FAILSAFE / RTL -->
  <rect x="330" y="330" width="290" height="100" rx="10" fill="#fdf3e7" stroke="#b26a1a" stroke-width="2.2"/>
  <text x="475" y="356" font-size="13.5" font-weight="bold" fill="#8a4d0f" text-anchor="middle">FAILSAFE / RTL</text>
  <text x="475" y="376" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">authority handed back to PX4:</text>
  <text x="475" y="390" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">climb, return to home, land &#8212; the mission</text>
  <text x="475" y="404" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">node stops streaming and only observes</text>

  <!-- failsafe preemption arrows -->
  <line x1="373" y1="204" x2="420" y2="326" stroke="#b26a1a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#smArrowAmber)"/>
  <line x1="634" y1="204" x2="540" y2="326" stroke="#b26a1a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#smArrowAmber)"/>
  <text x="212" y="292" font-size="10" fill="#8a4d0f" text-anchor="middle" font-style="italic">failsafe event, from any flying state &#8212;</text>
  <text x="212" y="306" font-size="10" fill="#8a4d0f" text-anchor="middle" font-style="italic">geofence breach, low battery, link loss</text>
  <text x="212" y="320" font-size="10" fill="#8a4d0f" text-anchor="middle" font-style="italic">(the next chapter&#8217;s subject)</text>

  <!-- RTL -> DONE -->
  <line x1="620" y1="380" x2="806" y2="340" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#smArrowGrey)"/>
  <text x="712" y="348" font-size="9.5" fill="#666" text-anchor="middle" font-style="italic">landed at home</text>

  <!-- footer -->
  <text x="490" y="480" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">Every 10 Hz tick, in order: (1) check failsafe events first, (2) evaluate the active state&#8217;s exit guard,</text>
  <text x="490" y="496" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">(3) perform the active state&#8217;s one action. The dashed transitions outrank everything &#8212; safety preempts progress.</text>
</svg>
