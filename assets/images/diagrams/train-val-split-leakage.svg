<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>

  <text x="450" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Two ways to split video frames &#8212; one of them quietly lies to you</text>
  <text x="450" y="52" font-size="13" fill="#555" text-anchor="middle">Frames extracted seconds apart from the same flight are near-duplicates; where the split line falls decides what validation measures.</text>

  <!-- ===== top panel: random split ===== -->
  <rect x="30" y="72" width="840" height="150" rx="8" fill="#fdf0ee" stroke="#822" stroke-width="1.5"/>
  <text x="46" y="96" font-size="13.5" font-weight="bold" fill="#822">Random split, frame by frame &#8212; leakage</text>
  <text x="46" y="114" font-size="12" fill="#555">12 frames extracted from one flight video, shuffled, 80/20:</text>

  <!-- frame strip: 12 frames, x start 60, w 58, gap 8 -->
  <g font-size="10" text-anchor="middle">
    <!-- T T V T T T V T T T V T pattern -->
    <g>
      <rect x="60"  y="126" width="58" height="44" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="1.5"/><text x="89"  y="152" font-size="11" fill="#1a4a5a" font-weight="bold">train</text>
      <rect x="126" y="126" width="58" height="44" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="1.5"/><text x="155" y="152" font-size="11" fill="#1a4a5a" font-weight="bold">train</text>
      <rect x="192" y="126" width="58" height="44" fill="#fdf3e6" stroke="#8a5210" stroke-width="2.5"/><text x="221" y="152" font-size="11" fill="#8a5210" font-weight="bold">val</text>
      <rect x="258" y="126" width="58" height="44" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="1.5"/><text x="287" y="152" font-size="11" fill="#1a4a5a" font-weight="bold">train</text>
      <rect x="324" y="126" width="58" height="44" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="1.5"/><text x="353" y="152" font-size="11" fill="#1a4a5a" font-weight="bold">train</text>
      <rect x="390" y="126" width="58" height="44" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="1.5"/><text x="419" y="152" font-size="11" fill="#1a4a5a" font-weight="bold">train</text>
      <rect x="456" y="126" width="58" height="44" fill="#fdf3e6" stroke="#8a5210" stroke-width="2.5"/><text x="485" y="152" font-size="11" fill="#8a5210" font-weight="bold">val</text>
      <rect x="522" y="126" width="58" height="44" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="1.5"/><text x="551" y="152" font-size="11" fill="#1a4a5a" font-weight="bold">train</text>
      <rect x="588" y="126" width="58" height="44" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="1.5"/><text x="617" y="152" font-size="11" fill="#1a4a5a" font-weight="bold">train</text>
      <rect x="654" y="126" width="58" height="44" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="1.5"/><text x="683" y="152" font-size="11" fill="#1a4a5a" font-weight="bold">train</text>
      <rect x="720" y="126" width="58" height="44" fill="#fdf3e6" stroke="#8a5210" stroke-width="2.5"/><text x="749" y="152" font-size="11" fill="#8a5210" font-weight="bold">val</text>
      <rect x="786" y="126" width="58" height="44" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="1.5"/><text x="815" y="152" font-size="11" fill="#1a4a5a" font-weight="bold">train</text>
    </g>
    <text x="60" y="182" font-size="10.5" fill="#555" text-anchor="start">t = 0 s</text>
    <text x="844" y="182" font-size="10.5" fill="#555" text-anchor="end">t = 11 s &#8212; same flock, same light, same background throughout</text>
  </g>
  <text x="450" y="206" font-size="12" fill="#822" font-style="italic" text-anchor="middle">every val frame has a near-copy sitting in train &#8212; the model is graded on questions it has effectively already seen; the score measures memory, not generalization</text>

  <!-- ===== bottom panel: split by session ===== -->
  <rect x="30" y="238" width="840" height="150" rx="8" fill="#eef6f0" stroke="#2f5a3a" stroke-width="1.5"/>
  <text x="46" y="262" font-size="13.5" font-weight="bold" fill="#2f5a3a">Split by recording session &#8212; honest</text>
  <text x="46" y="280" font-size="12" fill="#555">whole sessions assigned to one side or the other; validation is footage the model has never seen a neighbour of:</text>

  <g font-size="10.5" text-anchor="middle">
    <rect x="60" y="292" width="240" height="52" rx="4" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="1.5"/>
    <text x="180" y="313" font-size="11.5" fill="#222">Flight A &#8212; morning, low sun</text>
    <text x="180" y="330" font-size="11" fill="#1a4a5a" font-weight="bold">all frames &#8594; train</text>

    <rect x="316" y="292" width="240" height="52" rx="4" fill="#f2f6f8" stroke="#1a4a5a" stroke-width="1.5"/>
    <text x="436" y="313" font-size="11.5" fill="#222">Flight B &#8212; overcast, higher altitude</text>
    <text x="436" y="330" font-size="11" fill="#1a4a5a" font-weight="bold">all frames &#8594; train</text>

    <rect x="572" y="292" width="272" height="52" rx="4" fill="#fdf3e6" stroke="#8a5210" stroke-width="2.5"/>
    <text x="708" y="313" font-size="11.5" fill="#222">Flight C &#8212; different day, different site</text>
    <text x="708" y="330" font-size="11" fill="#8a5210" font-weight="bold">all frames &#8594; validation</text>
  </g>
  <text x="450" y="372" font-size="12" fill="#2f5a3a" font-style="italic" text-anchor="middle">the validation score now estimates what the mission cares about: performance on footage from a flight that has not happened yet</text>

  <!-- footer -->
  <text x="450" y="416" font-size="12.5" fill="#222" text-anchor="middle"><tspan font-weight="bold">Rule:</tspan> the unit of splitting is the recording session, not the frame. Aim for roughly 80/20 by image count, and make the</text>
  <text x="450" y="432" font-size="12.5" fill="#222" text-anchor="middle">validation side as unlike the training side as flight conditions will be unlike the dataset &#8212; that difficulty is the point.</text>
</svg>
