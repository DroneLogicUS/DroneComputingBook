<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">
  <defs>
    <marker id="idTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <text x="480" y="26" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Five deliveries, each one a working system</text>
  <text x="480" y="46" font-size="12.5" fill="#555" text-anchor="middle">The Goose Management System was built as five incremental stages, each adding one layer of capability on top of a proven foundation.</text>

  <!-- ===== staircase ===== -->
  <!-- Stage 1 -->
  <rect x="30" y="480" width="250" height="108" rx="8" fill="#ffffff" stroke="#1a7a8a" stroke-width="1.8"/>
  <text x="42" y="500" font-size="11.5" font-weight="bold" fill="#1a4a5a">Stage 1 &#8212; Telemetry &amp; environment</text>
  <text x="42" y="516" font-size="8.8" fill="#333">Companion computer running; remote shell</text>
  <text x="42" y="527" font-size="8.8" fill="#333">into the aircraft; sensor data confirmed</text>
  <text x="42" y="538" font-size="8.8" fill="#333">flowing &#8212; and logged.</text>
  <text x="42" y="555" font-size="8.8" font-weight="bold" fill="#1a4a5a">Proves: the data path is real.</text>
  <text x="42" y="570" font-size="8.3" font-style="italic" fill="#666">Machinery: Part I (companion computer &amp;</text>
  <text x="42" y="581" font-size="8.3" font-style="italic" fill="#666">UART); Part V's logging posture.</text>

  <!-- Stage 2 -->
  <rect x="198" y="385" width="250" height="88" rx="8" fill="#ffffff" stroke="#1a7a8a" stroke-width="1.8"/>
  <text x="210" y="405" font-size="11.5" font-weight="bold" fill="#1a4a5a">Stage 2 &#8212; SITL &amp; safety failsafes</text>
  <text x="210" y="421" font-size="8.8" fill="#333">Waypoints flying in simulation; geofence</text>
  <text x="210" y="432" font-size="8.8" fill="#333">armed and a kill-switch proven &#8212; before</text>
  <text x="210" y="443" font-size="8.8" fill="#333">any autonomy exists to constrain.</text>
  <text x="210" y="459" font-size="8.8" font-weight="bold" fill="#1a4a5a">Proves: the envelope holds.</text>
  <text x="210" y="470" font-size="8.3" font-style="italic" fill="#666">Machinery: Part II, end to end.</text>

  <!-- Stage 3 -->
  <rect x="366" y="290" width="250" height="88" rx="8" fill="#ffffff" stroke="#1a7a8a" stroke-width="1.8"/>
  <text x="378" y="310" font-size="11.5" font-weight="bold" fill="#1a4a5a">Stage 3 &#8212; Live inference pipeline</text>
  <text x="378" y="326" font-size="8.8" fill="#333">Real camera frames through an optimized</text>
  <text x="378" y="337" font-size="8.8" fill="#333">edge model on the real hardware &#8212; the first</text>
  <text x="378" y="348" font-size="8.8" fill="#333">stage where perception stops being scripted.</text>
  <text x="378" y="364" font-size="8.8" font-weight="bold" fill="#1a4a5a">Proves: perception is real, at measured rates.</text>
  <text x="378" y="375" font-size="8.3" font-style="italic" fill="#666">Machinery: Part III; Part IV's frame chain.</text>

  <!-- Stage 4 -->
  <rect x="534" y="195" width="250" height="88" rx="8" fill="#ffffff" stroke="#1a7a8a" stroke-width="1.8"/>
  <text x="546" y="215" font-size="11.5" font-weight="bold" fill="#1a4a5a">Stage 4 &#8212; Simulated mission logic</text>
  <text x="546" y="231" font-size="8.8" fill="#333">The full state machine in SITL: search grid,</text>
  <text x="546" y="242" font-size="8.8" fill="#333">transition to harassment, a computed evasion</text>
  <text x="546" y="253" font-size="8.8" fill="#333">vector &#8212; deliberately not yet flown for real.</text>
  <text x="546" y="269" font-size="8.8" font-weight="bold" fill="#1a4a5a">Proves: the decisions are right before flight.</text>
  <text x="546" y="280" font-size="8.3" font-style="italic" fill="#666">Machinery: Part IV; Part V's architecture.</text>

  <!-- Stage 5 -->
  <rect x="680" y="88" width="250" height="100" rx="8" fill="#1a7a8a"/>
  <text x="692" y="109" font-size="11.5" font-weight="bold" fill="#ffffff">Stage 5 &#8212; Live field validation</text>
  <text x="692" y="125" font-size="8.8" fill="#d8ecef">The full autonomous loop &#8212; every prior</text>
  <text x="692" y="136" font-size="8.8" fill="#d8ecef">stage's work, integrated and flown at the</text>
  <text x="692" y="147" font-size="8.8" fill="#d8ecef">deployment site, under real conditions.</text>
  <text x="692" y="163" font-size="8.8" font-weight="bold" fill="#ffffff">Proves: the assumptions survive the world.</text>
  <text x="692" y="177" font-size="8.3" font-style="italic" fill="#d8ecef">Machinery: everything; Part V's diagnostics.</text>

  <!-- arrows between stages -->
  <path d="M 280 516 C 312 510 326 496 332 480 L 333 477" fill="none" stroke="#1a7a8a" stroke-width="2.2" marker-end="url(#idTeal)"/>
  <path d="M 448 420 C 480 414 494 401 500 385 L 501 382" fill="none" stroke="#1a7a8a" stroke-width="2.2" marker-end="url(#idTeal)"/>
  <path d="M 616 324 C 648 318 662 306 668 290 L 669 287" fill="none" stroke="#1a7a8a" stroke-width="2.2" marker-end="url(#idTeal)"/>
  <path d="M 784 224 C 812 220 826 210 832 196 L 833 193" fill="none" stroke="#1a7a8a" stroke-width="2.2" marker-end="url(#idTeal)"/>

  <!-- one-layer diff annotations on arrows -->
  <text x="340" y="510" font-size="7.8" fill="#1a7a8a">+ flight &amp; failsafes</text>
  <text x="500" y="408" font-size="7.8" fill="#1a7a8a">+ real perception</text>
  <text x="672" y="314" font-size="7.8" fill="#1a7a8a">+ autonomous decisions</text>
  <text x="856" y="216" font-size="7.8" fill="#1a7a8a">+ the real world</text>

  <!-- ===== ordering principles ===== -->
  <rect x="500" y="420" width="430" height="150" rx="8" fill="#fdf6ec" stroke="#d9b98c" stroke-width="1.4"/>
  <text x="715" y="442" font-size="11.5" font-weight="bold" fill="#8a4d0f" text-anchor="middle">The order is the lesson</text>
  <text x="518" y="463" font-size="9.5" fill="#8a4d0f">&#8226; infrastructure before autonomy (Stage 1 before everything)</text>
  <text x="518" y="481" font-size="9.5" fill="#8a4d0f">&#8226; safety before capability (the fence and kill-switch precede</text>
  <text x="530" y="493" font-size="9.5" fill="#8a4d0f">the behaviors they will one day have to stop)</text>
  <text x="518" y="511" font-size="9.5" fill="#8a4d0f">&#8226; perception before decision-making (thresholds are sized</text>
  <text x="530" y="523" font-size="9.5" fill="#8a4d0f">against a real detector, not a perfect one)</text>
  <text x="518" y="541" font-size="9.5" fill="#8a4d0f">&#8226; simulated logic before committed flight</text>
  <text x="518" y="559" font-size="9.5" fill="#8a4d0f">&#8226; real-world integration last &#8212; but integration risk spent all along</text>

  <!-- footer -->
  <text x="480" y="608" font-size="9.5" font-style="italic" fill="#666" text-anchor="middle">Each stage is a working, demonstrable system &#8212; not a fragment of one. The diff between adjacent stages is one layer,</text>
  <text x="480" y="622" font-size="9.5" font-style="italic" fill="#666" text-anchor="middle">and when integration breaks, so is the suspect list.</text>
</svg>
