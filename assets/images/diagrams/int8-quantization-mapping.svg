<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="iqmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
    <marker id="iqmArrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3a3f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="660" fill="#ffffff"/>

  <text x="470" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">int8 quantization: one scale factor maps a layer&#8217;s weights onto 256 integers</text>
  <text x="470" y="52" font-size="12.5" fill="#555" text-anchor="middle">r &#8776; S &#183; q &#8212; the float value r is stored as the 8-bit integer q; the scale S is the only float the layer keeps</text>

  <!-- weight distribution curve (schematic bell) -->
  <path d="M 150 148 C 300 148, 380 78, 480 78 C 580 78, 660 148, 810 148" fill="none" stroke="#1a7a8a" stroke-width="2"/>
  <text x="480" y="70" font-size="11" font-style="italic" fill="#1a7a8a" text-anchor="middle">distribution of this layer&#8217;s 294,912 trained weights</text>

  <!-- float number line -->
  <line x1="120" y1="150" x2="840" y2="150" stroke="#222" stroke-width="1.8"/>
  <line x1="140" y1="143" x2="140" y2="157" stroke="#222" stroke-width="1.5"/>
  <line x1="480" y1="143" x2="480" y2="157" stroke="#222" stroke-width="1.5"/>
  <line x1="820" y1="143" x2="820" y2="157" stroke="#222" stroke-width="1.5"/>
  <text x="140" y="174" font-size="11.5" fill="#222" text-anchor="middle">&#8722;0.42</text>
  <text x="480" y="174" font-size="11.5" fill="#222" text-anchor="middle">0.0</text>
  <text x="820" y="174" font-size="11.5" fill="#222" text-anchor="middle">+0.42</text>
  <text x="98" y="154" font-size="12" font-weight="bold" fill="#222" text-anchor="end">float32</text>
  <text x="855" y="146" font-size="10.5" fill="#555">32 bits</text>
  <text x="855" y="160" font-size="10.5" fill="#555">per value</text>

  <!-- highlighted value on float line -->
  <circle cx="631" cy="150" r="5" fill="#e8b04a" stroke="#4a3410" stroke-width="1.5"/>
  <text x="631" y="132" font-size="11.5" font-weight="bold" fill="#4a3410" text-anchor="middle">r = 0.186</text>

  <!-- mapping arrows -->
  <line x1="240" y1="162" x2="240" y2="268" stroke="#1a7a8a" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#iqmArrow)"/>
  <line x1="480" y1="162" x2="480" y2="268" stroke="#1a7a8a" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#iqmArrow)"/>
  <line x1="720" y1="162" x2="720" y2="268" stroke="#1a7a8a" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#iqmArrow)"/>
  <line x1="631" y1="162" x2="631" y2="268" stroke="#4a3410" stroke-width="1.8" marker-end="url(#iqmArrowDark)"/>

  <!-- quantize / dequantize labels -->
  <rect x="30" y="196" width="200" height="46" rx="6" fill="#f2f6f8" stroke="#1a7a8a" stroke-width="1.2"/>
  <text x="130" y="215" font-size="11.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">quantize: q = round(r / S)</text>
  <text x="130" y="232" font-size="11.5" fill="#555" text-anchor="middle">S = 0.42 / 127 &#8776; 0.0033</text>
  <rect x="710" y="196" width="204" height="46" rx="6" fill="#f2f6f8" stroke="#1a7a8a" stroke-width="1.2"/>
  <text x="812" y="215" font-size="11.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">dequantize: r&#770; = S &#183; q</text>
  <text x="812" y="232" font-size="11.5" fill="#555" text-anchor="middle">error &#8804; S/2 &#8776; 0.0017</text>

  <!-- int8 number line -->
  <line x1="120" y1="280" x2="840" y2="280" stroke="#222" stroke-width="1.8"/>
  <text x="98" y="284" font-size="12" font-weight="bold" fill="#222" text-anchor="end">int8</text>
  <text x="855" y="276" font-size="10.5" fill="#555">8 bits</text>
  <text x="855" y="290" font-size="10.5" fill="#555">per value</text>
  <!-- discrete ticks -->
  <line x1="140" y1="273" x2="140" y2="287" stroke="#222" stroke-width="1.5"/>
  <line x1="225" y1="275" x2="225" y2="285" stroke="#55636b" stroke-width="1"/>
  <line x1="310" y1="275" x2="310" y2="285" stroke="#55636b" stroke-width="1"/>
  <line x1="395" y1="275" x2="395" y2="285" stroke="#55636b" stroke-width="1"/>
  <line x1="480" y1="273" x2="480" y2="287" stroke="#222" stroke-width="1.5"/>
  <line x1="565" y1="275" x2="565" y2="285" stroke="#55636b" stroke-width="1"/>
  <line x1="650" y1="275" x2="650" y2="285" stroke="#55636b" stroke-width="1"/>
  <line x1="735" y1="275" x2="735" y2="285" stroke="#55636b" stroke-width="1"/>
  <line x1="820" y1="273" x2="820" y2="287" stroke="#222" stroke-width="1.5"/>
  <text x="140" y="304" font-size="11.5" fill="#222" text-anchor="middle">&#8722;128</text>
  <text x="480" y="304" font-size="11.5" fill="#222" text-anchor="middle">0</text>
  <text x="820" y="304" font-size="11.5" fill="#222" text-anchor="middle">+127</text>
  <circle cx="631" cy="280" r="5" fill="#e8b04a" stroke="#4a3410" stroke-width="1.5"/>
  <text x="631" y="322" font-size="11.5" font-weight="bold" fill="#4a3410" text-anchor="middle">q = 56 &#8594; r&#770; = 0.1852</text>
  <text x="480" y="342" font-size="11" font-style="italic" fill="#555" text-anchor="middle">256 representable levels &#8212; the same amplitude resolution the camera&#8217;s own 8-bit pixels had on arrival</text>

  <!-- ============ MEMORY BARS ============ -->
  <text x="120" y="392" font-size="14" font-weight="bold" fill="#222">The bill for one layer: 3 &#215; 3 conv, 128 &#8594; 256 channels = 294,912 weights</text>

  <!-- float32 bar: 1.18 MB -> 680px wide -->
  <text x="120" y="424" font-size="12" fill="#222">float32</text>
  <rect x="185" y="408" width="680" height="34" fill="#2f3a3f"/>
  <text x="525" y="430" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">294,912 &#215; 4 B = 1,179,648 B &#8776; 1.18 MB</text>

  <!-- int8 bar: 0.29 MB -> 170px, + metadata sliver -->
  <text x="120" y="480" font-size="12" fill="#222">int8</text>
  <rect x="185" y="464" width="170" height="34" fill="#1a7a8a"/>
  <rect x="355" y="464" width="3" height="34" fill="#e8b04a"/>
  <text x="270" y="486" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">&#8776; 0.29 MB</text>
  <line x1="357" y1="460" x2="390" y2="448" stroke="#b8860b" stroke-width="1.2"/>
  <text x="395" y="450" font-size="10.5" fill="#b8860b">+ 256 per-channel scales &#8776; 1 KB &#8212; the metadata is noise</text>

  <line x1="700" y1="481" x2="380" y2="481" stroke="#1a7a8a" stroke-width="2" marker-end="url(#iqmArrow)"/>
  <text x="545" y="474" font-size="12" font-weight="bold" fill="#1a7a8a" text-anchor="middle">&#247;4 memory &#183; &#247;4 bandwidth</text>

  <!-- banner -->
  <rect x="60" y="530" width="820" height="106" rx="8" fill="#10233c"/>
  <text x="470" y="558" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">What is kept, what is spent, what is gained</text>
  <text x="470" y="582" font-size="12.5" fill="#ffffff" text-anchor="middle">kept: the relative structure of the weights &#8212; spent: rounding error bounded by S/2 per weight, typically &#8804; 1&#8211;2 % accuracy</text>
  <text x="470" y="602" font-size="12.5" fill="#ffffff" text-anchor="middle">gained: 4&#215; less memory and memory traffic, and integer arithmetic that embedded CPUs execute several-fold faster</text>
  <text x="470" y="624" font-size="12" fill="#e8b04a" text-anchor="middle">The scale S is chosen per layer (or per channel) from the trained weights &#8212; quantization is a measurement of the model, then a rounding</text>
</svg>
