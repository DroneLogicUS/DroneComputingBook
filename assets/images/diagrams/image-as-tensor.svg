<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="iatArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
    <marker id="iatAxis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="540" fill="#ffffff"/>

  <text x="440" y="32" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">One camera frame as a height &#215; width &#215; channels tensor</text>
  <text x="440" y="54" font-size="13" fill="#555" text-anchor="middle">Every pixel is three numbers; the frame is a 3-axis grid of 480 &#215; 640 &#215; 3 = 921,600 of them.</text>

  <!-- ===== left: the pixel grid with a zoomed pixel ===== -->
  <text x="170" y="92" font-size="14" font-weight="bold" fill="#1a4a5a" text-anchor="middle">What the camera delivers</text>

  <!-- grid frame -->
  <g>
    <rect x="60" y="104" width="220" height="165" fill="#eef4f0" stroke="#1a4a5a" stroke-width="2"/>
    <!-- sky band -->
    <rect x="61" y="105" width="218" height="50" fill="#dcebf2"/>
    <!-- grid lines: 10 cols x 8 rows over 220x165 -->
    <g stroke="#b8c4c9" stroke-width="0.8">
      <line x1="82" y1="105" x2="82" y2="268"/><line x1="104" y1="105" x2="104" y2="268"/>
      <line x1="126" y1="105" x2="126" y2="268"/><line x1="148" y1="105" x2="148" y2="268"/>
      <line x1="170" y1="105" x2="170" y2="268"/><line x1="192" y1="105" x2="192" y2="268"/>
      <line x1="214" y1="105" x2="214" y2="268"/><line x1="236" y1="105" x2="236" y2="268"/>
      <line x1="258" y1="105" x2="258" y2="268"/>
      <line x1="60" y1="125" x2="280" y2="125"/><line x1="60" y1="145" x2="280" y2="145"/>
      <line x1="60" y1="166" x2="280" y2="166"/><line x1="60" y1="186" x2="280" y2="186"/>
      <line x1="60" y1="207" x2="280" y2="207"/><line x1="60" y1="227" x2="280" y2="227"/>
      <line x1="60" y1="248" x2="280" y2="248"/>
    </g>
    <!-- goose silhouette -->
    <g fill="#4a4a4a">
      <ellipse cx="168" cy="205" rx="30" ry="13"/>
      <path d="M 188 200 C 196 190, 198 178, 194 166" stroke="#4a4a4a" stroke-width="6" fill="none" stroke-linecap="round"/>
      <circle cx="194" cy="162" r="5.5"/>
      <path d="M 199 160 L 208 163 L 199 166 z"/>
      <path d="M 138 202 L 124 195 L 136 209 z"/>
    </g>
    <!-- highlighted pixel -->
    <rect x="104" y="145" width="22" height="21" fill="none" stroke="#8a5210" stroke-width="2.5"/>
  </g>

  <!-- image coordinate axes -->
  <line x1="60" y1="286" x2="150" y2="286" stroke="#222" stroke-width="1.6" marker-end="url(#iatAxis)"/>
  <text x="106" y="302" font-size="11.5" fill="#222" text-anchor="middle">column u (0 &#8594; 639)</text>
  <line x1="44" y1="104" x2="44" y2="194" stroke="#222" stroke-width="1.6" marker-end="url(#iatAxis)"/>
  <text x="36" y="152" font-size="11.5" fill="#222" text-anchor="middle" transform="rotate(-90 36 152)">row v (0 &#8594; 479)</text>
  <text x="60" y="100" font-size="10.5" fill="#555" text-anchor="start" font-style="italic"></text>
  <circle cx="60" cy="104" r="3" fill="#822"/>
  <text x="70" y="99" font-size="10.5" fill="#822">origin: top-left corner</text>

  <!-- zoom lines to the value stack -->
  <line x1="126" y1="145" x2="330" y2="330" stroke="#8a5210" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="126" y1="166" x2="330" y2="430" stroke="#8a5210" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- zoomed pixel values -->
  <text x="392" y="318" font-size="13" font-weight="bold" fill="#8a5210" text-anchor="middle">one pixel = three intensities</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="332" y="328" width="120" height="30" fill="#fbeaea" stroke="#822" stroke-width="1.5"/>
    <text x="392" y="348" fill="#822">R = 96</text>
    <rect x="332" y="362" width="120" height="30" fill="#eef6f0" stroke="#2f5a3a" stroke-width="1.5"/>
    <text x="392" y="382" fill="#2f5a3a">G = 148</text>
    <rect x="332" y="396" width="120" height="30" fill="#e8edef" stroke="#1a4a5a" stroke-width="1.5"/>
    <text x="392" y="416" fill="#1a4a5a">B = 84</text>
  </g>
  <text x="392" y="446" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">unsigned 8-bit integers,</text>
  <text x="392" y="461" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">0 (dark) to 255 (saturated)</text>

  <!-- ===== right: the stacked channel planes ===== -->
  <text x="660" y="92" font-size="14" font-weight="bold" fill="#1a4a5a" text-anchor="middle">How software indexes it</text>

  <!-- three offset planes: blue back, green middle, red front -->
  <g>
    <rect x="590" y="110" width="200" height="150" fill="#e8edef" stroke="#1a4a5a" stroke-width="2"/>
    <text x="775" y="126" font-size="11.5" fill="#1a4a5a" text-anchor="end">c = 2 (blue)</text>
    <rect x="565" y="135" width="200" height="150" fill="#eef6f0" stroke="#2f5a3a" stroke-width="2"/>
    <text x="750" y="151" font-size="11.5" fill="#2f5a3a" text-anchor="end">c = 1 (green)</text>
    <rect x="540" y="160" width="200" height="150" fill="#fbeaea" stroke="#822" stroke-width="2"/>
    <text x="725" y="176" font-size="11.5" fill="#822" text-anchor="end">c = 0 (red)</text>
    <!-- sample cell on front plane -->
    <rect x="592" y="204" width="16" height="15" fill="#ffffff" stroke="#8a5210" stroke-width="2"/>
    <text x="600" y="234" font-size="11" fill="#8a5210" text-anchor="middle">I[v, u, c]</text>
  </g>

  <!-- tensor axes -->
  <line x1="540" y1="322" x2="660" y2="322" stroke="#222" stroke-width="1.6" marker-end="url(#iatAxis)"/>
  <text x="600" y="338" font-size="11.5" fill="#222" text-anchor="middle">axis 1: width W = 640</text>
  <line x1="524" y1="160" x2="524" y2="270" stroke="#222" stroke-width="1.6" marker-end="url(#iatAxis)"/>
  <text x="516" y="215" font-size="11.5" fill="#222" text-anchor="middle" transform="rotate(-90 516 215)">axis 0: height H = 480</text>
  <line x1="742" y1="316" x2="794" y2="266" stroke="#222" stroke-width="1.6" marker-end="url(#iatAxis)"/>
  <text x="800" y="304" font-size="11.5" fill="#222" text-anchor="middle">axis 2:</text>
  <text x="800" y="319" font-size="11.5" fill="#222" text-anchor="middle">channels</text>
  <text x="800" y="334" font-size="11.5" fill="#222" text-anchor="middle">C = 3</text>

  <!-- arrow from left to right -->
  <line x1="290" y1="185" x2="500" y2="185" stroke="#1a7a8a" stroke-width="2.6" marker-end="url(#iatArrow)"/>
  <text x="395" y="176" font-size="12" fill="#1a7a8a" text-anchor="middle" font-style="italic">same numbers, one array</text>

  <!-- footer -->
  <text x="440" y="498" font-size="13" fill="#222" text-anchor="middle">shape (H, W, C) = (480, 640, 3) &#8226; 480 &#215; 640 &#215; 3 = 921,600 values &#8226; 921,600 bytes as uint8, 3.7 MB as float32</text>
  <text x="440" y="520" font-size="12.5" fill="#555" text-anchor="middle" font-style="italic">A depth camera adds a fourth kind of plane; a thermal camera delivers C = 1. The tensor shape is the contract between camera and model.</text>
</svg>
