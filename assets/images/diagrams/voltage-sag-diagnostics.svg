<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <text x="480" y="26" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Sag or depletion? Reading battery_status against the three-tier failsafe</text>
  <text x="480" y="46" font-size="13" fill="#555" text-anchor="middle">Top: voltage dips with current and recovers — sag. The slow one-way descent underneath is depletion. Bottom: what the failsafe actually watches.</text>

  <!-- ============ top panel: voltage & current ============ -->
  <g>
    <rect x="40" y="64" width="880" height="270" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="56" y="86" font-size="12" font-weight="bold" fill="#1a4a5a">battery_status.voltage_v (teal, left axis)  &#183;  battery_status.current_a (amber, right axis)</text>

    <!-- axes -->
    <line x1="100" y1="100" x2="100" y2="300" stroke="#888" stroke-width="1.2"/>
    <line x1="100" y1="300" x2="880" y2="300" stroke="#888" stroke-width="1.2"/>
    <line x1="880" y1="100" x2="880" y2="300" stroke="#b26a1a" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- left ticks (V) -->
    <text x="94" y="118" font-size="9" fill="#1a4a5a" text-anchor="end">16 V</text>
    <text x="94" y="168" font-size="9" fill="#1a4a5a" text-anchor="end">15 V</text>
    <text x="94" y="218" font-size="9" fill="#1a4a5a" text-anchor="end">14 V</text>
    <text x="94" y="268" font-size="9" fill="#1a4a5a" text-anchor="end">13 V</text>
    <!-- right ticks (A) -->
    <text x="886" y="168" font-size="9" fill="#8a4d0f">60 A</text>
    <text x="886" y="238" font-size="9" fill="#8a4d0f">30 A</text>
    <text x="886" y="298" font-size="9" fill="#8a4d0f">0 A</text>

    <!-- current trace (amber): baseline ~25A with two spikes to ~65A -->
    <path d="M 100 246 L 220 244 L 236 242
             L 250 160 L 268 156 L 284 158 L 298 242
             L 420 244 L 560 243
             L 576 164 L 596 158 L 612 162 L 626 242
             L 780 244 L 880 243"
          fill="none" stroke="#b26a1a" stroke-width="2"/>

    <!-- voltage trace (teal): plateau ~15.1 V declining, ~0.8 V dips mirror current spikes, later baseline sags lower -->
    <path d="M 100 158 L 220 162 L 236 164
             L 250 202 L 268 204 L 284 202 L 298 166
             L 420 170 L 560 176
             L 576 218 L 596 222 L 612 220 L 626 186
             L 780 192 L 880 198"
          fill="none" stroke="#1a7a8a" stroke-width="2.4"/>

    <!-- annotations -->
    <path d="M 268 204 L 268 176" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="278" y="130" font-size="10" font-weight="bold" fill="#1a4a5a">the dip tracks the load:</text>
    <text x="278" y="143" font-size="10" fill="#1a4a5a">&#916;V = I &#183; R_int, and it recovers</text>
    <text x="278" y="156" font-size="10" fill="#1a4a5a">the moment current drops — <tspan font-weight="bold">sag</tspan></text>

    <text x="700" y="120" font-size="10" font-weight="bold" fill="#1a4a5a">the resting level between loads</text>
    <text x="700" y="133" font-size="10" fill="#1a4a5a">only ever descends — <tspan font-weight="bold">depletion</tspan></text>
    <path d="M 740 140 C 750 160 756 175 762 186" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="3 2"/>

    <text x="180" y="318" font-size="9.5" fill="#777">arming</text>
    <text x="840" y="318" font-size="9.5" fill="#777">disarm</text>
    <text x="480" y="318" font-size="9.5" fill="#777" text-anchor="middle">flight time &#8594;</text>
  </g>

  <!-- ============ bottom panel: remaining + tiers ============ -->
  <g>
    <rect x="40" y="346" width="880" height="220" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="56" y="368" font-size="12" font-weight="bold" fill="#1a4a5a">battery_status.remaining — load-compensated fraction of capacity, the quantity the failsafe tiers compare</text>

    <!-- axes -->
    <line x1="100" y1="382" x2="100" y2="540" stroke="#888" stroke-width="1.2"/>
    <line x1="100" y1="540" x2="880" y2="540" stroke="#888" stroke-width="1.2"/>
    <text x="94" y="390" font-size="9" fill="#555" text-anchor="end">1.0</text>
    <text x="94" y="465" font-size="9" fill="#555" text-anchor="end">0.5</text>
    <text x="94" y="543" font-size="9" fill="#555" text-anchor="end">0.0</text>

    <!-- tier lines -->
    <line x1="100" y1="474" x2="880" y2="474" stroke="#b26a1a" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="872" y="470" font-size="9.5" font-weight="bold" fill="#8a4d0f" text-anchor="end">BAT_LOW_THR — warn the operator</text>
    <line x1="100" y1="507" x2="880" y2="507" stroke="#b26a1a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="872" y="503" font-size="9.5" font-weight="bold" fill="#8a4d0f" text-anchor="end">BAT_CRIT_THR — act (default: return, then&#8230;)</text>
    <line x1="100" y1="527" x2="880" y2="527" stroke="#a83232" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="872" y="523" font-size="9.5" font-weight="bold" fill="#7a2424" text-anchor="end">BAT_EMERGEN_THR — &#8230;land, unconditionally</text>

    <!-- remaining trace: smooth monotone decline crossing warn tier -->
    <path d="M 100 392 C 300 420 500 448 650 470 C 720 480 800 490 880 498"
          fill="none" stroke="#1a7a8a" stroke-width="2.4"/>

    <!-- warning transition marker -->
    <circle cx="676" cy="474" r="5" fill="#b26a1a"/>
    <text x="676" y="452" font-size="9.5" font-weight="bold" fill="#8a4d0f" text-anchor="middle">warning: 0 &#8594; 1 (WARNING_LOW)</text>
    <text x="676" y="464" font-size="9" fill="#8a4d0f" text-anchor="middle">timestamped in the log at the crossing</text>

    <text x="480" y="556" font-size="9.5" fill="#777" text-anchor="middle">flight time &#8594;</text>
  </g>

  <!-- footer -->
  <rect x="40" y="580" width="880" height="46" rx="8" fill="#f7f7f7" stroke="#ccc" stroke-width="1"/>
  <text x="480" y="598" font-size="10.5" fill="#444" text-anchor="middle">The tiers run on estimated remaining capacity, not on the sagged instantaneous voltage — a hard climb&#8217;s dip does not trip the failsafe;</text>
  <text x="480" y="614" font-size="10.5" fill="#444" text-anchor="middle">a genuinely depleted (or aged, high-resistance) pack does. Ordering is enforced: Warn &gt; Failsafe &gt; Emergency, and the most severe active action wins.</text>
</svg>
