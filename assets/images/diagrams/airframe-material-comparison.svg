<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Helvetica, Arial, sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="920" height="560" fill="#ffffff"/>

  <!-- titles -->
  <text x="460" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Airframe materials, drawn to scale</text>
  <text x="460" y="52" font-size="12.5" fill="#555" text-anchor="middle">The two per-kilogram figures of merit for the materials in the comparison table</text>

  <!-- panel headers -->
  <text x="330" y="92" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">specific stiffness E/&#961; (MJ/kg)</text>
  <text x="330" y="110" font-size="12" font-style="italic" fill="#555" text-anchor="middle">governs the flying structure</text>
  <text x="735" y="92" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">specific strength &#963;/&#961; (kJ/kg)</text>
  <text x="735" y="110" font-size="12" font-style="italic" fill="#555" text-anchor="middle">governs crash survival and fittings</text>

  <!-- material row labels -->
  <g font-size="13" fill="#222">
    <text x="15" y="146">carbon, unidirectional</text>
    <text x="15" y="163" font-size="12" fill="#555">(fibers along the load)</text>
    <text x="15" y="209">carbon, quasi-isotropic</text>
    <text x="15" y="264">aluminium 6061-T6</text>
    <text x="15" y="319">nylon (printed, PA12)</text>
    <text x="15" y="374">PLA (printed)</text>
    <text x="15" y="429">ABS (printed)</text>
  </g>

  <!-- baselines -->
  <line x1="185" y1="128" x2="185" y2="445" stroke="#999" stroke-width="1.4"/>
  <line x1="590" y1="128" x2="590" y2="445" stroke="#999" stroke-width="1.4"/>

  <!-- left panel: specific stiffness, scale 84 MJ/kg = 290 px -->
  <rect x="185" y="138" width="290" height="24" fill="#3f3f3f" stroke="#222" stroke-width="1.3"/>
  <rect x="185" y="193" width="107" height="24" fill="#6f6f6f" stroke="#3f3f3f" stroke-width="1.3"/>
  <rect x="185" y="248" width="90" height="24" fill="#9aa2ab" stroke="#4a4f55" stroke-width="1.3"/>
  <rect x="185" y="303" width="6" height="24" fill="#c9b458" stroke="#7d6c22" stroke-width="1.3"/>
  <rect x="185" y="358" width="10" height="24" fill="#5b84b8" stroke="#2f4d75" stroke-width="1.3"/>
  <rect x="185" y="413" width="7" height="24" fill="#c9524e" stroke="#7d2f2c" stroke-width="1.3"/>
  <g font-size="12.5" fill="#222">
    <text x="483" y="155">~84</text>
    <text x="300" y="210">~31</text>
    <text x="283" y="265">26</text>
    <text x="199" y="320">~1.7</text>
    <text x="203" y="375">~2.8</text>
    <text x="200" y="430">~2.1</text>
  </g>

  <!-- right panel: specific strength, scale 940 kJ/kg = 290 px -->
  <rect x="590" y="138" width="290" height="24" fill="#3f3f3f" stroke="#222" stroke-width="1.3"/>
  <rect x="590" y="193" width="105" height="24" fill="#6f6f6f" stroke="#3f3f3f" stroke-width="1.3"/>
  <rect x="590" y="248" width="31" height="24" fill="#9aa2ab" stroke="#4a4f55" stroke-width="1.3"/>
  <rect x="590" y="303" width="15" height="24" fill="#c9b458" stroke="#7d6c22" stroke-width="1.3"/>
  <rect x="590" y="358" width="14" height="24" fill="#5b84b8" stroke="#2f4d75" stroke-width="1.3"/>
  <rect x="590" y="413" width="12" height="24" fill="#c9524e" stroke="#7d2f2c" stroke-width="1.3"/>
  <g font-size="12.5" fill="#222">
    <text x="872" y="155" fill="#ffffff" text-anchor="end">~940</text>
    <text x="703" y="210">~340</text>
    <text x="629" y="265">102 (yield)</text>
    <text x="613" y="320">~50</text>
    <text x="612" y="375">~44</text>
    <text x="610" y="430">~38</text>
  </g>

  <!-- panel annotations -->
  <text x="330" y="475" font-size="12" font-style="italic" fill="#555" text-anchor="middle">even quasi-isotropic carbon carries ten times</text>
  <text x="330" y="492" font-size="12" font-style="italic" fill="#555" text-anchor="middle">the specific stiffness of printed PLA</text>
  <text x="735" y="475" font-size="12" font-style="italic" fill="#555" text-anchor="middle">oriented fibers are the decisive advantage:</text>
  <text x="735" y="492" font-size="12" font-style="italic" fill="#555" text-anchor="middle">~940 against aluminium&#8217;s 102 kJ/kg</text>

  <!-- footer -->
  <text x="460" y="528" font-size="13" font-style="italic" fill="#222" text-anchor="middle">Printed-material values assume loading within the layer plane; across the layers, strength falls to 30&#8211;70 % of the plotted figure.</text>
  <text x="460" y="548" font-size="12" fill="#555" text-anchor="middle">compared per kilogram, not per cubic centimetre &#8212; an airborne structure&#8217;s binding constraint is its mass budget</text>
</svg>
