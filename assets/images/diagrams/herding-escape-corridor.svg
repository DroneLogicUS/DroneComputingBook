<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">
  <defs>
    <marker id="hcTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
    <marker id="hcGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="hcTealBig" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1a7a8a"/>
    </marker>
    <pattern id="hcHatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#999" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <text x="480" y="28" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Herding, not chasing: one open door</text>
  <text x="480" y="50" font-size="13" fill="#555" text-anchor="middle">Hold behind the flock on the line through the exit; the drone's presence closes every direction but one.</text>

  <!-- protected area boundary -->
  <path d="M 90 120 Q 60 300 110 480 Q 240 560 460 545 Q 560 540 640 500 L 700 430
           L 760 350 Q 800 280 760 200 Q 690 100 520 85 Q 280 70 90 120 Z"
        fill="#f4f8f9" stroke="#888" stroke-width="2.2" stroke-dasharray="10 6"/>
  <text x="150" y="150" font-size="12.5" font-weight="bold" fill="#666">PROTECTED AREA</text>

  <!-- open exit corridor wedge (gap in boundary drawn by overpainting) -->
  <path d="M 430 300 L 780 130 L 880 260 Z" fill="#e8f2e8" stroke="none" opacity="0.9"/>
  <path d="M 700 168 L 830 105" stroke="#ffffff" stroke-width="10"/>
  <path d="M 430 300 L 795 122" stroke="#4a7a4a" stroke-width="1.6" stroke-dasharray="5 5"/>
  <path d="M 430 300 L 872 248" stroke="#4a7a4a" stroke-width="1.6" stroke-dasharray="5 5"/>
  <text x="762" y="92" font-size="12" font-weight="bold" fill="#3a6a3a" text-anchor="middle">exit corridor — kept open</text>
  <text x="835" y="150" font-size="11.5" font-style="italic" fill="#3a6a3a" text-anchor="middle">safe area</text>
  <text x="835" y="166" font-size="11.5" font-style="italic" fill="#3a6a3a" text-anchor="middle">beyond the</text>
  <text x="835" y="182" font-size="11.5" font-style="italic" fill="#3a6a3a" text-anchor="middle">boundary</text>

  <!-- closed wedges -->
  <path d="M 430 300 L 250 140 L 480 110 Z" fill="url(#hcHatch)" opacity="0.45"/>
  <text x="355" y="150" font-size="10.5" font-style="italic" fill="#666" text-anchor="middle">closed — wrong direction</text>
  <path d="M 430 300 L 560 500 L 340 520 Z" fill="url(#hcHatch)" opacity="0.45"/>
  <text x="452" y="492" font-size="10.5" font-style="italic" fill="#666" text-anchor="middle">closed by the drone's presence</text>

  <!-- herding vector: drone -> flock -> exit -->
  <path d="M 235 395 L 780 130" fill="none" stroke="#1a7a8a" stroke-width="4" marker-end="url(#hcTealBig)" opacity="0.85"/>
  <text x="600" y="235" font-size="12.5" font-weight="bold" fill="#1a4a5a" transform="rotate(-26 600 235)">herding vector — directional pressure</text>

  <!-- flock -->
  <g fill="#b26a1a">
    <ellipse cx="420" cy="290" rx="13" ry="8"/>
    <ellipse cx="448" cy="305" rx="13" ry="8"/>
    <ellipse cx="405" cy="315" rx="13" ry="8"/>
    <ellipse cx="437" cy="330" rx="13" ry="8"/>
    <ellipse cx="465" cy="282" rx="13" ry="8"/>
    <ellipse cx="472" cy="318" rx="13" ry="8"/>
  </g>
  <circle cx="438" cy="306" r="4" fill="#8a4d0f"/>
  <text x="438" y="268" font-size="12" font-weight="bold" fill="#8a4d0f" text-anchor="middle">flock</text>
  <text x="462" y="345" font-size="11" font-style="italic" fill="#8a4d0f">c = tracked center</text>

  <!-- drone hold point -->
  <g transform="translate(235 395)">
    <line x1="-14" y1="-14" x2="14" y2="14" stroke="#1a7a8a" stroke-width="3.4"/>
    <line x1="-14" y1="14" x2="14" y2="-14" stroke="#1a7a8a" stroke-width="3.4"/>
    <circle cx="-14" cy="-14" r="5.5" fill="#1a7a8a"/>
    <circle cx="14" cy="-14" r="5.5" fill="#1a7a8a"/>
    <circle cx="-14" cy="14" r="5.5" fill="#1a7a8a"/>
    <circle cx="14" cy="14" r="5.5" fill="#1a7a8a"/>
  </g>
  <text x="228" y="440" font-size="12" font-weight="bold" fill="#1a4a5a" text-anchor="middle">drone hold point</text>
  <text x="228" y="456" font-size="11" fill="#1a4a5a" text-anchor="middle">p&#8202;<tspan font-size="75%" baseline-shift="sub">drone</tspan> = c &#8722; d&#8202;<tspan font-size="75%" baseline-shift="sub">s</tspan>&#8202;&#251;</text>

  <!-- standoff dimension -->
  <path d="M 262 372 L 402 303" fill="none" stroke="#666" stroke-width="1.4" marker-start="url(#hcGrey)" marker-end="url(#hcGrey)"/>
  <text x="308" y="326" font-size="11" font-style="italic" fill="#555" transform="rotate(-26 308 326)">standoff d&#8202;<tspan font-size="75%" baseline-shift="sub">s</tspan></text>

  <!-- behavioral grounding notes -->
  <rect x="70" y="500" width="470" height="92" rx="8" fill="#eef4f5" stroke="#1a7a8a" stroke-width="1.4"/>
  <text x="86" y="522" font-size="11.5" font-weight="bold" fill="#1a4a5a">Why the geometry does the work</text>
  <text x="86" y="540" font-size="10.5" fill="#333">&#8226; target-oriented approach reads as predator; tangential reads as traffic</text>
  <text x="86" y="556" font-size="10.5" fill="#333">&#8226; larger flocks flee earlier and together &#8212; address the flock, not the bird</text>
  <text x="86" y="572" font-size="10.5" fill="#333">&#8226; never approach vertically &#8212; overhead adds stress, no directional signal</text>

  <rect x="560" y="500" width="330" height="92" rx="8" fill="#fdf6ec" stroke="#b26a1a" stroke-width="1.4"/>
  <text x="576" y="522" font-size="11.5" font-weight="bold" fill="#8a4d0f">The follow rule</text>
  <text x="576" y="540" font-size="10.5" fill="#333">Re-read c from the tracker every tick and hold</text>
  <text x="576" y="556" font-size="10.5" fill="#333">c &#8722; d&#8202;<tspan font-size="75%" baseline-shift="sub">s</tspan>&#8202;&#251;: the drone follows at the flock's own</text>
  <text x="576" y="572" font-size="10.5" fill="#333">pace, down the corridor, never closing the gap.</text>

  <text x="480" y="612" font-size="11" font-style="italic" fill="#555" text-anchor="middle">Pressure without an open exit produces scatter, not dispersal &#8212; a split flock means multiple tracks, multiple directions, and a failed engagement.</text>
</svg>
