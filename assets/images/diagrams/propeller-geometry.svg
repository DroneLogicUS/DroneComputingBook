<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="parrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="840" height="600" fill="#ffffff"/>

  <!-- ============ panel A: diameter ============ -->
  <text x="185" y="45" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">diameter</text>

  <!-- rotation arc -->
  <path d="M 102 107 A 165 165 0 0 1 267 107" fill="none" stroke="#444" stroke-width="2" marker-end="url(#parrow)"/>
  <text x="185" y="70" font-size="13" fill="#222" text-anchor="middle">rotation</text>

  <!-- swept disc -->
  <circle cx="185" cy="250" r="150" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="185" y="130" font-size="13" fill="#555" text-anchor="middle" font-style="italic">swept disc (area A)</text>

  <!-- two-blade propeller, slight twist -->
  <g transform="rotate(8 185 250)">
    <ellipse cx="112" cy="250" rx="74" ry="22" fill="#c9b458" stroke="#7d6c22" stroke-width="1.5"/>
    <ellipse cx="258" cy="250" rx="74" ry="22" fill="#c9b458" stroke="#7d6c22" stroke-width="1.5"/>
  </g>
  <circle cx="185" cy="250" r="17" fill="#6f6f6f" stroke="#3f3f3f" stroke-width="1.5"/>
  <circle cx="185" cy="250" r="5" fill="#ffffff" stroke="#3f3f3f" stroke-width="1"/>

  <!-- diameter dimension -->
  <line x1="35" y1="258" x2="35" y2="452" stroke="#aaa" stroke-width="1"/>
  <line x1="335" y1="258" x2="335" y2="452" stroke="#aaa" stroke-width="1"/>
  <line x1="35" y1="445" x2="335" y2="445" stroke="#444" stroke-width="1.5" marker-start="url(#parrow)" marker-end="url(#parrow)"/>
  <text x="185" y="472" font-size="14" fill="#222" text-anchor="middle">diameter &#8212; the &#8220;10&#8221;</text>
  <text x="185" y="491" font-size="13" fill="#555" text-anchor="middle">tip-to-tip span: 10 in = 254 mm</text>

  <!-- ============ panel B: pitch ============ -->
  <text x="500" y="55" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">pitch</text>
  <line x1="670" y1="82" x2="785" y2="82" stroke="#444" stroke-width="1.5" marker-end="url(#parrow)"/>
  <text x="725" y="70" font-size="12" fill="#555" text-anchor="middle">direction of advance</text>

  <!-- cylinder swept by the blade tip -->
  <g stroke="#b0b0b0" stroke-width="1.3" fill="none" stroke-dasharray="5 4">
    <ellipse cx="430" cy="175" rx="16" ry="60"/>
    <ellipse cx="790" cy="175" rx="16" ry="60"/>
    <line x1="430" y1="115" x2="790" y2="115"/>
    <line x1="430" y1="235" x2="790" y2="235"/>
  </g>

  <!-- one revolution marker at the left end -->
  <path d="M 398 205 A 42 42 0 1 1 400 145" fill="none" stroke="#444" stroke-width="2" marker-end="url(#parrow)"/>
  <text x="390" y="265" font-size="12" fill="#555" text-anchor="middle">one revolution</text>

  <!-- helical path of the blade tip: one full turn advances by the pitch -->
  <path d="M 450 235 C 485 235 515 115 550 115" fill="none" stroke="#b3592a" stroke-width="3"/>
  <path d="M 550 115 C 585 115 615 235 650 235" fill="none" stroke="#b3592a" stroke-width="3" stroke-dasharray="7 5"/>
  <path d="M 650 235 C 685 235 715 115 750 115" fill="none" stroke="#b3592a" stroke-width="3" stroke-opacity="0.4"/>
  <circle cx="450" cy="235" r="4.5" fill="#b3592a"/>
  <circle cx="650" cy="235" r="4.5" fill="#b3592a"/>
  <text x="618" y="152" font-size="12.5" fill="#b3592a" font-style="italic">helical path of the blade</text>

  <!-- pitch dimension: axial advance of one turn -->
  <line x1="450" y1="242" x2="450" y2="280" stroke="#aaa" stroke-width="1"/>
  <line x1="650" y1="242" x2="650" y2="280" stroke="#aaa" stroke-width="1"/>
  <line x1="450" y1="274" x2="650" y2="274" stroke="#444" stroke-width="1.5" marker-start="url(#parrow)" marker-end="url(#parrow)"/>
  <text x="550" y="300" font-size="14" fill="#222" text-anchor="middle">pitch &#8212; the &#8220;4.5&#8221;</text>
  <text x="550" y="319" font-size="13" fill="#555" text-anchor="middle">axial advance in one full revolution, assuming no slip</text>

  <!-- ============ panel C: blade count ============ -->
  <text x="610" y="368" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">blade count</text>

  <!-- two-blade mini prop -->
  <circle cx="495" cy="460" r="62" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <g transform="rotate(10 495 460)">
    <ellipse cx="462" cy="460" rx="32" ry="11" fill="#c9b458" stroke="#7d6c22" stroke-width="1.3"/>
    <ellipse cx="528" cy="460" rx="32" ry="11" fill="#c9b458" stroke="#7d6c22" stroke-width="1.3"/>
  </g>
  <circle cx="495" cy="460" r="9" fill="#6f6f6f" stroke="#3f3f3f" stroke-width="1.3"/>
  <text x="495" y="545" font-size="13.5" fill="#222" text-anchor="middle">10 &#215; 4.5 &#8212; two blades (implied)</text>

  <!-- three-blade mini prop -->
  <circle cx="720" cy="460" r="62" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <g fill="#c9b458" stroke="#7d6c22" stroke-width="1.3">
    <ellipse cx="720" cy="425" rx="11" ry="34"/>
    <ellipse cx="720" cy="425" rx="11" ry="34" transform="rotate(120 720 460)"/>
    <ellipse cx="720" cy="425" rx="11" ry="34" transform="rotate(240 720 460)"/>
  </g>
  <circle cx="720" cy="460" r="9" fill="#6f6f6f" stroke="#3f3f3f" stroke-width="1.3"/>
  <text x="720" y="545" font-size="13.5" fill="#222" text-anchor="middle">5 &#215; 5 &#215; 3 &#8212; third number: three blades</text>

  <!-- footer -->
  <text x="420" y="585" font-size="14" fill="#222" text-anchor="middle" font-style="italic">designation = diameter &#215; pitch (&#215; blade count), all in inches</text>
</svg>
