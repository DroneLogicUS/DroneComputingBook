<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="sitlArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
    <marker id="sitlArrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1010" height="560" fill="#ffffff"/>

  <text x="505" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Software-in-the-loop: the same stack, a swapped plant</text>
  <text x="505" y="52" font-size="13" fill="#555" text-anchor="middle">Identical mission code and identical PX4 firmware run in both rows; only what sits below the autopilot changes.</text>

  <!-- row 1: SITL -->
  <rect x="25" y="78" width="960" height="200" rx="10" fill="#fafcfd" stroke="#1a7a8a" stroke-width="2"/>
  <text x="45" y="104" font-size="14" font-weight="bold" fill="#1a4a5a">On the bench &#8212; SITL</text>
  <text x="45" y="122" font-size="11" fill="#555" font-style="italic">everything is a process on one Linux machine</text>

  <rect x="60" y="140" width="230" height="90" rx="8" fill="#ffffff" stroke="#1a7a8a" stroke-width="1.8"/>
  <text x="175" y="165" font-size="12.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">Mission code</text>
  <text x="175" y="184" font-size="11" fill="#555" text-anchor="middle" font-style="italic">the same ROS 2 node or</text>
  <text x="175" y="200" font-size="11" fill="#555" text-anchor="middle" font-style="italic">MAVSDK script, unchanged</text>

  <line x1="290" y1="185" x2="352" y2="185" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#sitlArrow)"/>
  <text x="321" y="172" font-size="10" fill="#222" text-anchor="middle" font-style="italic">local socket</text>

  <rect x="356" y="140" width="270" height="90" rx="8" fill="#fdf3e7" stroke="#b26a1a" stroke-width="2.2"/>
  <text x="491" y="165" font-size="12.5" font-weight="bold" fill="#8a4d0f" text-anchor="middle">PX4 firmware</text>
  <text x="491" y="184" font-size="11" fill="#555" text-anchor="middle" font-style="italic">the flight code, compiled for the</text>
  <text x="491" y="200" font-size="11" fill="#555" text-anchor="middle" font-style="italic">laptop instead of the Pixhawk &#8212;</text>
  <text x="491" y="216" font-size="11" fill="#555" text-anchor="middle" font-style="italic">same EKF2, loops, modes, failsafes</text>

  <line x1="626" y1="170" x2="688" y2="170" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#sitlArrow)"/>
  <text x="657" y="149" font-size="9.5" fill="#222" text-anchor="middle" font-style="italic">motor</text>
  <text x="657" y="161" font-size="9.5" fill="#222" text-anchor="middle" font-style="italic">commands</text>
  <line x1="688" y1="205" x2="626" y2="205" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#sitlArrowGrey)"/>
  <text x="657" y="218" font-size="9.5" fill="#666" text-anchor="middle" font-style="italic">simulated</text>
  <text x="657" y="230" font-size="9.5" fill="#666" text-anchor="middle" font-style="italic">sensor data</text>

  <rect x="692" y="140" width="260" height="90" rx="8" fill="#eef5f7" stroke="#1a7a8a" stroke-width="1.8"/>
  <text x="822" y="165" font-size="12.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">Gazebo simulator</text>
  <text x="822" y="184" font-size="11" fill="#555" text-anchor="middle" font-style="italic">modeled physics, wind, and a</text>
  <text x="822" y="200" font-size="11" fill="#555" text-anchor="middle" font-style="italic">synthetic IMU, GPS, and barometer</text>
  <text x="822" y="216" font-size="11" fill="#555" text-anchor="middle" font-style="italic">a crash costs a restart</text>

  <!-- swap arrow -->
  <line x1="505" y1="286" x2="505" y2="312" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#sitlArrowGrey)"/>
  <text x="520" y="304" font-size="11" fill="#666" font-style="italic">when the mission survives simulation, swap only the plant</text>

  <!-- row 2: field -->
  <rect x="25" y="320" width="960" height="180" rx="10" fill="#fafcfd" stroke="#1a4a5a" stroke-width="2"/>
  <text x="45" y="346" font-size="14" font-weight="bold" fill="#1a4a5a">In the field</text>
  <text x="45" y="364" font-size="11" fill="#555" font-style="italic">the two computers and three wires of Part I</text>

  <rect x="60" y="376" width="230" height="90" rx="8" fill="#ffffff" stroke="#1a7a8a" stroke-width="1.8"/>
  <text x="175" y="401" font-size="12.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">Mission code</text>
  <text x="175" y="420" font-size="11" fill="#555" text-anchor="middle" font-style="italic">byte-for-byte the same,</text>
  <text x="175" y="436" font-size="11" fill="#555" text-anchor="middle" font-style="italic">now on the Jetson Nano</text>

  <line x1="290" y1="421" x2="352" y2="421" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#sitlArrow)"/>
  <text x="321" y="400" font-size="9.5" fill="#222" text-anchor="middle" font-style="italic">UART,</text>
  <text x="321" y="412" font-size="9.5" fill="#222" text-anchor="middle" font-style="italic">921,600 baud</text>

  <rect x="356" y="376" width="270" height="90" rx="8" fill="#fdf3e7" stroke="#b26a1a" stroke-width="2.2"/>
  <text x="491" y="401" font-size="12.5" font-weight="bold" fill="#8a4d0f" text-anchor="middle">PX4 firmware</text>
  <text x="491" y="420" font-size="11" fill="#555" text-anchor="middle" font-style="italic">the same flight code, now on</text>
  <text x="491" y="436" font-size="11" fill="#555" text-anchor="middle" font-style="italic">the Pixhawk 6C&#8217;s microcontroller</text>

  <line x1="626" y1="406" x2="688" y2="406" stroke="#1a7a8a" stroke-width="2.4" marker-end="url(#sitlArrow)"/>
  <text x="657" y="385" font-size="9.5" fill="#222" text-anchor="middle" font-style="italic">motor</text>
  <text x="657" y="397" font-size="9.5" fill="#222" text-anchor="middle" font-style="italic">commands</text>
  <line x1="688" y1="441" x2="626" y2="441" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#sitlArrowGrey)"/>
  <text x="657" y="454" font-size="9.5" fill="#666" text-anchor="middle" font-style="italic">real</text>
  <text x="657" y="466" font-size="9.5" fill="#666" text-anchor="middle" font-style="italic">sensor data</text>

  <rect x="692" y="376" width="260" height="90" rx="8" fill="#ffffff" stroke="#1a4a5a" stroke-width="1.8"/>
  <text x="822" y="401" font-size="12.5" font-weight="bold" fill="#1a4a5a" text-anchor="middle">The 2.2 kg airframe</text>
  <text x="822" y="420" font-size="11" fill="#555" text-anchor="middle" font-style="italic">real physics, real wind, real</text>
  <text x="822" y="436" font-size="11" fill="#555" text-anchor="middle" font-style="italic">IMU, GPS, and barometer &#8212;</text>
  <text x="822" y="452" font-size="11" fill="#555" text-anchor="middle" font-style="italic">a crash costs the aircraft</text>

  <text x="505" y="534" font-size="13" fill="#222" text-anchor="middle">A bug caught in the top row costs nothing; the identical bug in the bottom row costs a drone.</text>
</svg>
