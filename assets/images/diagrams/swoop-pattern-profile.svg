<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">
  <defs>
    <marker id="spTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7a8a"/>
    </marker>
    <marker id="spGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <text x="480" y="28" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">The swoop: a shallow pass that never enters the floor</text>
  <text x="480" y="50" font-size="13" fill="#555" text-anchor="middle">Side view, drawn to scale (worked example: 15 m standoff, 8 m altitude, closest point 6 m / 4 m).</text>

  <!-- safety floor keep-out (drawn first, under the path) -->
  <rect x="612" y="368" width="288" height="152" fill="#fdf6ec" stroke="#b26a1a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="756" y="404" font-size="12" font-weight="bold" fill="#8a4d0f" text-anchor="middle">SAFETY FLOOR</text>
  <text x="756" y="421" font-size="11" font-weight="bold" fill="#8a4d0f" text-anchor="middle">never entered</text>
  <text x="756" y="444" font-size="10" fill="#8a4d0f" text-anchor="middle">horizontal floor 5&#8211;8 m</text>
  <text x="756" y="459" font-size="10" fill="#8a4d0f" text-anchor="middle">altitude floor 3&#8211;5 m</text>
  <text x="756" y="477" font-size="10" font-style="italic" fill="#8a4d0f" text-anchor="middle">engineering defaults &#8212;</text>
  <text x="756" y="491" font-size="10" font-style="italic" fill="#8a4d0f" text-anchor="middle">no published deterrence standard</text>

  <!-- ground -->
  <line x1="60" y1="520" x2="910" y2="520" stroke="#444" stroke-width="2.4"/>
  <g stroke="#999" stroke-width="1.2">
    <line x1="90" y1="520" x2="78" y2="532"/><line x1="150" y1="520" x2="138" y2="532"/>
    <line x1="210" y1="520" x2="198" y2="532"/><line x1="270" y1="520" x2="258" y2="532"/>
    <line x1="330" y1="520" x2="318" y2="532"/><line x1="390" y1="520" x2="378" y2="532"/>
    <line x1="450" y1="520" x2="438" y2="532"/><line x1="510" y1="520" x2="498" y2="532"/>
    <line x1="570" y1="520" x2="558" y2="532"/>
  </g>

  <!-- goose -->
  <ellipse cx="840" cy="508" rx="18" ry="10" fill="#b26a1a"/>
  <path d="M 852 502 Q 864 492 862 480 Q 870 484 868 494" fill="#b26a1a"/>
  <text x="840" y="545" font-size="12" font-weight="bold" fill="#8a4d0f" text-anchor="middle">goose</text>

  <!-- phase 1: approach hold -->
  <line x1="120" y1="216" x2="270" y2="216" stroke="#1a7a8a" stroke-width="3"/>
  <text x="195" y="192" font-size="12" font-weight="bold" fill="#1a4a5a" text-anchor="middle">1 &#183; APPROACH</text>
  <text x="195" y="164" font-size="10.5" font-style="italic" fill="#1a4a5a" text-anchor="middle">hold 10&#8211;15 m standoff behind the flock,</text>
  <text x="195" y="178" font-size="10.5" font-style="italic" fill="#1a4a5a" text-anchor="middle">match its drift, observation altitude</text>

  <!-- phase 2: descent -->
  <line x1="270" y1="216" x2="612" y2="368" stroke="#1a7a8a" stroke-width="3"/>
  <text x="398" y="258" font-size="12" font-weight="bold" fill="#1a4a5a" transform="rotate(24 398 258)">2 &#183; DESCEND &#8212; &#947; = arctan(4/9) &#8776; 24&#176;</text>

  <!-- angle arc at descent start -->
  <line x1="270" y1="216" x2="400" y2="216" stroke="#666" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M 360 216 A 90 90 0 0 1 352 253" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#spGrey)"/>
  <text x="382" y="242" font-size="11" font-style="italic" fill="#555">&#947;</text>

  <!-- phase 3: closest point -->
  <circle cx="612" cy="368" r="6" fill="#ffffff" stroke="#b26a1a" stroke-width="2.6"/>
  <text x="588" y="352" font-size="12" font-weight="bold" fill="#8a4d0f" text-anchor="end">3 &#183; CLOSEST POINT</text>
  <text x="588" y="368" font-size="10.5" font-style="italic" fill="#8a4d0f" text-anchor="end">bottom out at the floor &#8212; 6 m out, 4 m up,</text>
  <text x="588" y="382" font-size="10.5" font-style="italic" fill="#8a4d0f" text-anchor="end">no sudden direction changes</text>

  <!-- phase 4: recovery climb-out -->
  <path d="M 612 368 C 648 344 636 268 566 234 C 520 212 470 204 420 204" fill="none" stroke="#1a7a8a" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#spTeal)"/>
  <text x="525" y="180" font-size="12" font-weight="bold" fill="#1a4a5a" text-anchor="middle">4 &#183; RECOVER</text>
  <text x="525" y="196" font-size="10.5" font-style="italic" fill="#1a4a5a" text-anchor="middle">turn away, climb, rejoin orbit or herding</text>

  <!-- dimensions -->
  <!-- start altitude 8 m -->
  <line x1="120" y1="216" x2="120" y2="520" stroke="#666" stroke-width="1.3" marker-start="url(#spGrey)" marker-end="url(#spGrey)"/>
  <text x="108" y="372" font-size="11" font-style="italic" fill="#555" text-anchor="middle" transform="rotate(-90 108 372)">start altitude 8 m</text>
  <!-- closest altitude 4 m -->
  <line x1="612" y1="380" x2="612" y2="520" stroke="#666" stroke-width="1.3" marker-end="url(#spGrey)"/>
  <text x="600" y="456" font-size="11" font-style="italic" fill="#555" text-anchor="middle" transform="rotate(-90 600 456)">4 m</text>
  <!-- drop 4 m -->
  <line x1="288" y1="216" x2="288" y2="368" stroke="#666" stroke-width="1.3" stroke-dasharray="3 3" marker-start="url(#spGrey)" marker-end="url(#spGrey)"/>
  <line x1="270" y1="368" x2="612" y2="368" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="302" y="298" font-size="11" font-style="italic" fill="#555">drop 4 m</text>

  <!-- standoff / advance dimensions below ground -->
  <line x1="270" y1="558" x2="840" y2="558" stroke="#666" stroke-width="1.3" marker-start="url(#spGrey)" marker-end="url(#spGrey)"/>
  <line x1="270" y1="524" x2="270" y2="566" stroke="#999" stroke-width="1"/>
  <text x="555" y="576" font-size="11" font-style="italic" fill="#555" text-anchor="middle">standoff at descent start: 15 m</text>
  <line x1="270" y1="596" x2="612" y2="596" stroke="#666" stroke-width="1.3" marker-start="url(#spGrey)" marker-end="url(#spGrey)"/>
  <line x1="612" y1="524" x2="612" y2="604" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="441" y="614" font-size="11" font-style="italic" fill="#555" text-anchor="middle">horizontal advance: 9 m</text>
  <line x1="612" y1="558" x2="612" y2="566" stroke="#999" stroke-width="1"/>
  <text x="726" y="548" font-size="10.5" font-style="italic" fill="#555" text-anchor="middle">6 m</text>

  <!-- note box -->
  <rect x="640" y="86" width="286" height="154" rx="8" fill="#eef4f5" stroke="#1a7a8a" stroke-width="1.4"/>
  <text x="656" y="110" font-size="12" font-weight="bold" fill="#1a4a5a">The band is the message</text>
  <text x="656" y="130" font-size="10.5" fill="#333">Committed phase &#8776; 2.5 s at 4 m/s along</text>
  <text x="656" y="145" font-size="10.5" fill="#333">the &#8776; 9.8 m descent path; speed up</text>
  <text x="656" y="160" font-size="10.5" fill="#333">slightly &#8212; the pass must read as deliberate.</text>
  <text x="656" y="180" font-size="10.5" fill="#333">Steeper than 30&#176;: reads as a dive.</text>
  <text x="656" y="195" font-size="10.5" fill="#333">Shallower than 20&#176;: stops reading as</text>
  <text x="656" y="210" font-size="10.5" fill="#333">an approach at all.</text>

  <text x="480" y="634" font-size="11" font-style="italic" fill="#555" text-anchor="middle">A designed extension: specified by the pattern vocabulary, not implemented in the shipped node &#8212; the escalation reserved for a flock that ignores the orbit.</text>
</svg>
