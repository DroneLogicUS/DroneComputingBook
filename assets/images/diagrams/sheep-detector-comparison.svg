<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="600" fill="#ffffff"/>

  <text x="470" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Five detectors on one sheep dataset &#8212; accuracy against inference time</text>
  <text x="470" y="52" font-size="13" fill="#555" text-anchor="middle">Reported F1-score versus time per image for the five networks of the sheep-detection study; same data, same training budget, same GPU.</text>

  <!-- plot area: x 110..860 for 0..4.0 s; y 430..110 for F1 78..94 -->
  <!-- gridlines -->
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="110" y1="390" x2="860" y2="390"/>
    <line x1="110" y1="350" x2="860" y2="350"/>
    <line x1="110" y1="310" x2="860" y2="310"/>
    <line x1="110" y1="270" x2="860" y2="270"/>
    <line x1="110" y1="230" x2="860" y2="230"/>
    <line x1="110" y1="190" x2="860" y2="190"/>
    <line x1="110" y1="150" x2="860" y2="150"/>
    <line x1="110" y1="110" x2="860" y2="110"/>
  </g>

  <!-- "want to be here" corner -->
  <text x="128" y="100" font-size="11" fill="#2f5a3a" font-style="italic">the good corner: accurate and fast</text>

  <!-- data points -->
  <!-- UNet (0.14 s, 93.07) -->
  <circle cx="136" cy="129" r="7" fill="#e6f2f4" stroke="#1a7a8a" stroke-width="2.5"/>
  <circle cx="136" cy="129" r="14" fill="none" stroke="#1a7a8a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="160" y="126" font-size="12.5" font-weight="bold" fill="#1a7a8a">UNet + weighted Hausdorff distance</text>
  <text x="160" y="142" font-size="10.5" fill="#555">F1 93.07% &#183; precision 96.20% &#183; recall 90.14% &#183; 0.14 s/image</text>
  <text x="160" y="157" font-size="10.5" fill="#1a7a8a" font-style="italic">centroids, not boxes &#183; best on every metric &#183; fails only on sheep very close together</text>

  <!-- Network-I (0.20, 84.38) -->
  <circle cx="148" cy="302" r="6" fill="#fdf3e6" stroke="#8a5210" stroke-width="2.5"/>
  <text x="168" y="299" font-size="12" font-weight="bold" fill="#222">Network-I (1 conv layer)</text>
  <text x="168" y="314" font-size="10.5" fill="#555">F1 84.38% &#183; 0.20 s &#183; false positives on fences</text>

  <!-- Network-II (2.22, 86.31) -->
  <circle cx="526" cy="264" r="6" fill="#fdf3e6" stroke="#8a5210" stroke-width="2.5"/>
  <text x="540" y="252" font-size="12" font-weight="bold" fill="#222">Network-II (7-layer, contour-oriented)</text>
  <text x="540" y="267" font-size="10.5" fill="#555">F1 86.31% &#183; 2.22 s &#183; second-best accuracy, 16&#215; slower than UNet</text>

  <!-- AlexNet (1.31, 80.03) -->
  <circle cx="356" cy="389" r="6" fill="#fdf3e6" stroke="#8a5210" stroke-width="2.5"/>
  <text x="370" y="379" font-size="12" font-weight="bold" fill="#222">AlexNet (pretrained, retrained)</text>
  <text x="370" y="394" font-size="10.5" fill="#555">F1 80.03% &#183; 1.31 s &#183; duplicate detections on the same sheep</text>

  <!-- GoogLeNet (3.53, 81.23) -->
  <circle cx="772" cy="365" r="6" fill="#fdf3e6" stroke="#8a5210" stroke-width="2.5"/>
  <text x="758" y="347" font-size="12" font-weight="bold" fill="#222" text-anchor="end">GoogLeNet (pretrained, retrained)</text>
  <text x="758" y="362" font-size="10.5" fill="#555" text-anchor="end">F1 81.23% &#183; 3.53 s &#183; duplicate detections, fewest false alarms of the R-CNN four</text>

  <!-- bracket: two-stage group -->
  <path d="M 200 452 C 300 466, 600 466, 790 452" fill="none" stroke="#8a5210" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="480" y="478" font-size="11.5" fill="#8a5210" text-anchor="middle" font-style="italic">the four box-predicting networks, trained through a modified R-CNN procedure: 1,000 region proposals per image,</text>
  <text x="480" y="492" font-size="11.5" fill="#8a5210" text-anchor="middle" font-style="italic">every proposal classified &#8212; a per-image cost the one-pass UNet never pays</text>

  <!-- axes -->
  <line x1="110" y1="430" x2="880" y2="430" stroke="#222" stroke-width="1.5"/>
  <line x1="110" y1="430" x2="110" y2="90" stroke="#222" stroke-width="1.5"/>
  <g font-size="10.5" fill="#555" text-anchor="middle">
    <text x="110" y="446">0</text>
    <text x="204" y="446">0.5</text>
    <text x="298" y="446">1.0</text>
    <text x="391" y="446">1.5</text>
    <text x="485" y="446">2.0</text>
    <text x="579" y="446">2.5</text>
    <text x="673" y="446">3.0</text>
    <text x="766" y="446">3.5</text>
    <text x="860" y="446">4.0</text>
  </g>
  <text x="495" y="508" font-size="12" fill="#222" text-anchor="middle">time per image (s), measured on a desktop GTX 1080 GPU &#8212; not on flight hardware</text>
  <g font-size="10.5" fill="#555" text-anchor="end">
    <text x="104" y="434">78</text>
    <text x="104" y="394">80</text>
    <text x="104" y="354">82</text>
    <text x="104" y="314">84</text>
    <text x="104" y="274">86</text>
    <text x="104" y="234">88</text>
    <text x="104" y="194">90</text>
    <text x="104" y="154">92</text>
    <text x="104" y="114">94</text>
  </g>
  <text x="45" y="260" font-size="12" fill="#222" text-anchor="middle" transform="rotate(-90 45 260)">F1-score on the sheep test set (%)</text>

  <!-- footer -->
  <text x="470" y="540" font-size="12.5" fill="#222" text-anchor="middle"><tspan font-weight="bold">Two readings:</tspan> the winner sits alone in the good corner &#8212; the centroid-based UNet dominates on accuracy <tspan font-style="italic">and</tspan> speed, so for this task</text>
  <text x="470" y="558" font-size="12.5" fill="#222" text-anchor="middle">there was no accuracy&#8211;latency trade to make. And every time on this axis is a desktop-GPU number: at 0.14 s/image (&#8776;7 FPS) on a GTX 1080,</text>
  <text x="470" y="576" font-size="12.5" fill="#222" text-anchor="middle">the &#8220;real-time onboard&#8221; conclusion is a projection onto weaker hardware that the study itself never measured.</text>
</svg>
